<script type="application/json" id="roadmap-data">{"version":1,"title":"C++ Atlas","branches":[{"id":"core","title":"Основы языка C++","summary":"От первой программы до функций и небольшого проекта из нескольких файлов. Осваивайте на коротких программах с понятным вводом и проверяемым результатом.","stage":0,"track":"language","prereq":[],"mini":["Можете объяснить, с какой функции начинается выполнение программы и что означает её результат?","Можете проследить изменение переменных в условии и цикле без запуска программы?","Можете разделить задачу на функции и объяснить область видимости каждой переменной?","Можете отличить объявление функции от её определения?"],"practice":["Напишите калькулятор с обработкой неизвестной операции и деления на ноль.","Создайте игру «Угадай число» с ограничением числа попыток.","Разделите конвертер единиц на main.cpp, заголовок и файл реализации.","Проверьте функции на обычных значениях, нуле, отрицательных числах и границах допустимого диапазона."],"skills":[{"id":"core-program","title":"Структура программы и main","stage":0,"tier":"junior-required","difficulty":0,"what":"Программа состоит из объявлений и определений; выполнение обычного приложения начинается с main.","know":"Функция main, инструкции, фигурные скобки, точка с запятой, #include, return и код завершения.","why":"Позволяет понимать минимальный исходный файл и отделять ошибки записи программы от её поведения.","practice":"Напишите программу, которая выводит три строки и возвращает успешный код завершения.","prereq":["build-commands"]},{"id":"core-readability","title":"Чтение кода, имена и комментарии","stage":0,"tier":"junior-required","difficulty":0,"what":"Имена, отступы и небольшие выражения помогают читать код и проверять намерение автора.","know":"Комментарии // и /* */, единый стиль имён, форматирование, отличие объяснения причины от пересказа строки.","why":"Большую часть рабочего времени разработчик читает и меняет уже существующий код.","practice":"Переименуйте однобуквенные переменные в учебной программе и оставьте комментарий только у нетривиального решения.","prereq":["core-program"]},{"id":"core-variables","title":"Переменные и инициализация","stage":0,"tier":"junior-required","difficulty":0,"what":"Переменная обозначает объект определённого типа; инициализация задаёт его начальное состояние.","know":"Объявление, определение, инициализация через = и {}, присваивание, неинициализированные значения, сужение при {}.","why":"Предотвращает использование случайных значений и создаёт основу для работы с состоянием программы.","practice":"Напишите расчёт стоимости покупки, инициализируя все переменные в месте объявления.","prereq":["core-program"]},{"id":"core-io","title":"Ввод и вывод через std::cin и std::cout","stage":0,"tier":"junior-required","difficulty":0,"what":"Потоки стандартной библиотеки позволяют читать данные и выводить результаты в консоль.","know":"Операторы >> и \u003c\u003c, пробельный ввод, std::getline, состояние потока после ошибки, '\\n' и сброс буфера.","why":"Нужен для первых прикладных программ и ручного воспроизведения ошибок.","practice":"Считайте имя с пробелами и возраст; при нечисловом возрасте покажите понятное сообщение.","prereq":["core-variables"]},{"id":"core-arithmetic","title":"Арифметические выражения","stage":0,"tier":"junior-required","difficulty":0,"what":"Операторы вычисляют значения с учётом типов операндов и правил приоритета.","know":"+, -, *, /, %, целочисленное деление, скобки, ++, +=, переполнение и деление на ноль.","why":"Помогает писать корректные расчёты и понимать, почему одинаковая формула даёт разный результат для разных типов.","practice":"Рассчитайте часы и минуты по числу секунд и среднее значение трёх целых чисел без потери дробной части.","prereq":["core-variables"]},{"id":"core-logic","title":"Сравнения и логические выражения","stage":0,"tier":"junior-required","difficulty":0,"what":"Сравнения возвращают bool; логические операторы объединяют условия.","know":"==, !=, \u003c, \u003c=, &&, ||, !, короткое замыкание, отличие = от ==.","why":"Позволяет описывать проверки входных данных и безопасно защищать последующие операции.","practice":"Проверьте допустимость даты в упрощённом календаре и защитите деление условием с &&.","prereq":["core-arithmetic"]},{"id":"core-condition","title":"Ветвление: if и else","stage":0,"tier":"junior-required","difficulty":0,"what":"Условные инструкции выбирают один из путей выполнения.","know":"if, else if, else, вложенные условия, ранний return, обязательные скобки для ясности.","why":"Любая прикладная программа принимает решения в зависимости от данных.","practice":"Сделайте расчёт скидки с несколькими диапазонами и проверьте значения на границах.","prereq":["core-logic"]},{"id":"core-switch","title":"Выбор варианта: switch","stage":1,"tier":"junior-required","difficulty":0,"what":"switch выбирает ветку по целому значению или перечислению.","know":"case, default, break, намеренный переход между ветками и [[fallthrough]].","why":"Удобен для команд меню и небольших машин состояний с конечным числом вариантов.","practice":"Напишите консольное меню из четырёх команд с отдельным обработчиком неизвестного значения.","prereq":["core-condition"]},{"id":"core-loops","title":"Циклы и управление повторением","stage":0,"tier":"junior-required","difficulty":0,"what":"Циклы повторяют действия, пока выполняется условие или остаются элементы.","know":"for, while, do while, range-for, break, continue, инвариант цикла, ошибка на единицу.","why":"Нужен для обработки коллекций и поиска результатов без повторения кода.","practice":"Выведите таблицу умножения, найдите сумму диапазона и остановите ввод по специальной команде.","prereq":["core-condition"]},{"id":"core-functions","title":"Функции и параметры","stage":1,"tier":"junior-required","difficulty":0,"what":"Функция выделяет операцию с понятными входами и результатом.","know":"Объявление и определение, тип возвращаемого значения, void, параметры по значению, return, контракт функции.","why":"Позволяет декомпозировать задачу, повторно использовать вычисления и тестировать их отдельно.","practice":"Вынесите проверки входа и арифметические операции калькулятора в небольшие функции.","prereq":["core-loops"]},{"id":"core-scope","title":"Область видимости и пространства имён","stage":1,"tier":"junior-required","difficulty":0,"what":"Область видимости определяет доступность имени, а namespace группирует имена.","know":"Локальные и глобальные имена, затенение, время существования блока, ::, собственный namespace, риски using namespace в заголовке.","why":"Помогает устранять конфликты имён и ограничивать связи между частями программы.","practice":"Разместите две функции с одинаковым именем в разных namespace и устраните затенение локальной переменной.","prereq":["core-functions"]},{"id":"core-overloads","title":"Перегрузка функций и значения по умолчанию","stage":1,"tier":"junior-plus","difficulty":1,"what":"Несколько функций могут иметь одно имя и различаться списком параметров.","know":"Выбор перегрузки, точное совпадение и преобразование, неоднозначность, параметры по умолчанию, отличие от переопределения.","why":"Помогает читать API стандартной библиотеки и создавать удобные интерфейсы без неожиданных вызовов.","practice":"Создайте перегрузки функции печати для числа и строки и намеренно получите неоднозначный вызов.","prereq":["core-functions"]},{"id":"core-recursion","title":"Рекурсивные функции","stage":2,"tier":"junior-plus","difficulty":1,"what":"Рекурсивная функция решает задачу через вызов себя для меньшей подзадачи.","know":"Базовый случай, продвижение к завершению, глубина вызовов, расход стека, сравнение с циклом.","why":"Нужна для деревьев и рекурсивных алгоритмов; позволяет замечать риск переполнения стека.","practice":"Напишите рекурсивный и циклический варианты суммы цифр, сравните ограничения по размеру входа.","prereq":["core-functions","core-condition"]},{"id":"core-files","title":"Объявления, определения и несколько файлов","stage":1,"tier":"junior-required","difficulty":1,"what":"Интерфейс помещают в заголовок, реализацию — в исходный файл; файлы собираются в программу.","know":"Заголовки .h/.hpp, .cpp, include guards, объявление против определения, базовое правило одного определения, inline для функций в заголовках.","why":"Позволяет перейти от одного учебного файла к сопровождаемому небольшому проекту.","practice":"Разделите библиотеку геометрии на заголовок и реализацию и вызовите её из двух исходных файлов.","prereq":["core-scope"]}]},{"id":"types","title":"Типы данных и система типов","summary":"Тип определяет допустимые значения, операции и часть гарантий корректности. От базовых чисел до вывода типов и безопасных преобразований.","stage":0,"track":"language","prereq":["core"],"mini":["Почему int и double по-разному вычисляют 5 / 2?","Почему unsigned не является универсальным способом запретить отрицательные значения?","Когда auto делает код яснее, а когда скрывает важное преобразование?","Чем enum class отличается от набора целых констант?"],"practice":["Проверьте пределы числовых типов на своей платформе через std::numeric_limits.","Напишите функцию безопасного преобразования размера коллекции к меньшему целому типу.","Замените числовые коды состояний на enum class.","Создайте struct для координат и отделите операции над ним от ввода данных."],"skills":[{"id":"types-fundamental","title":"Основные типы и размер объекта","stage":0,"tier":"junior-required","difficulty":0,"what":"Встроенные типы представляют логические значения, символы, целые и вещественные числа.","know":"bool, char, int, long, float, double, sizeof; стандарт задаёт ограничения, но не один размер int для всех платформ.","why":"Помогает выбирать подходящее представление данных и избегать скрытых предположений о платформе.","practice":"Выведите sizeof нескольких типов и объясните, какие результаты нельзя считать универсальными.","prereq":["core-variables"]},{"id":"types-integers","title":"Целые числа, знаковость и границы","stage":1,"tier":"junior-required","difficulty":1,"what":"Целые типы имеют ограниченный диапазон; signed и unsigned ведут себя по-разному на границах.","know":"std::int32_t при наличии, std::size_t, знаковое переполнение как UB, арифметика unsigned по модулю, смешанные сравнения.","why":"Ошибки размеров, индексов и переполнения часто приводят к неверным результатам или повреждению памяти.","practice":"Разберите сравнение -1 с unsigned и напишите проверку сложения без знакового переполнения.","prereq":["types-fundamental","core-arithmetic"]},{"id":"types-floating","title":"Вещественные числа и точность","stage":1,"tier":"junior-required","difficulty":1,"what":"float и double хранят приближённые значения с конечной точностью.","know":"Округление, относительная и абсолютная погрешность, NaN и infinity при поддержке, ограничения сравнения через ==.","why":"Необходимы для корректных расчётов, геометрии и проверки результатов численных функций.","practice":"Продемонстрируйте погрешность 0.1 + 0.2 и напишите сравнение с обоснованными допусками.","prereq":["types-fundamental"]},{"id":"types-characters","title":"Символы, байты и кодировки","stage":1,"tier":"junior-plus","difficulty":1,"what":"char хранит кодовую единицу; число байтов строки может отличаться от числа пользовательских символов.","know":"Знаковость char зависит от реализации, UTF-8 использует переменную длину, std::string не выполняет декодирование Unicode автоматически.","why":"Особенно важно для русского текста, файлов и сетевого обмена.","practice":"Сравните число байтов ASCII-строки и строки на русском; объясните, почему обычный индекс не означает номер буквы.","prereq":["types-fundamental"]},{"id":"types-conversions","title":"Неявные преобразования и сужение","stage":1,"tier":"junior-required","difficulty":1,"what":"Компилятор может преобразовать значение при присваивании, вызове функции или вычислении выражения.","know":"Продвижение целых, преобразования signed/unsigned, потеря дробной части, сужение, инициализация {} и предупреждения компилятора.","why":"Помогает находить ошибки, которые компилируются и дают правдоподобный, но неверный результат.","practice":"Исследуйте преобразования double в int и большого целого в меньший тип; добавьте проверки диапазона.","prereq":["types-integers","types-floating"]},{"id":"types-casts","title":"Явные преобразования: static_cast и другие","stage":2,"tier":"junior-required","difficulty":1,"what":"Именованные cast-операторы делают намерение преобразования явным.","know":"static_cast для допустимых преобразований; назначение dynamic_cast, const_cast, reinterpret_cast и ограничения каждого; C-style cast скрывает выбор.","why":"Позволяет отделять обычные преобразования значений от опасных операций с представлением объектов.","practice":"Замените C-style cast в примере на именованные преобразования и объясните, какие из них лучше удалить.","prereq":["types-conversions"]},{"id":"types-auto","title":"Вывод типа через auto","stage":1,"tier":"junior-required","difficulty":1,"what":"auto выводит тип из инициализатора и сокращает повторение сложных типов.","know":"auto, auto&, const auto&, копирование при auto из ссылки, списковая инициализация, роль явного типа на границе API.","why":"Упрощает работу с итераторами и сложными типами, сохраняя контроль над копированием.","practice":"Напишите три цикла с auto, auto& и const auto& и покажите, в каком случае меняются исходные элементы.","prereq":["types-fundamental","core-loops"]},{"id":"types-enum","title":"Перечисления enum class","stage":1,"tier":"junior-required","difficulty":0,"what":"Перечисление задаёт ограниченный набор именованных значений.","know":"enum class, квалифицированные имена, базовый целый тип, отсутствие неявного преобразования в int, обработка вариантов.","why":"Помогает сделать состояния и режимы понятными и уменьшить число ошибочных комбинаций.","practice":"Представьте состояния задачи через enum class и напишите отображение состояния в текст.","prereq":["core-switch","types-fundamental"]},{"id":"types-aggregate","title":"Структуры и агрегатная инициализация","stage":1,"tier":"junior-required","difficulty":0,"what":"struct объединяет несколько связанных значений в новый тип.","know":"Поля, доступ через точку, значения по умолчанию у полей, инициализация {}, передача структуры в функцию.","why":"Позволяет моделировать предметные данные вместо параллельных несвязанных переменных.","practice":"Создайте структуру Book с названием, автором и годом; реализуйте проверку её данных.","prereq":["core-functions","types-fundamental"]},{"id":"types-aliases","title":"Псевдонимы и предметные типы","stage":2,"tier":"junior-plus","difficulty":1,"what":"using создаёт псевдоним существующего типа; отдельная структура создаёт действительно новый тип.","know":"using и typedef, отсутствие защиты у псевдонима, небольшие обёртки для единиц измерения и идентификаторов.","why":"Помогает не путать метры с секундами и различать удобное имя от гарантии системы типов.","practice":"Сначала создайте using UserId = int, затем обёртку struct UserId и сравните возможность перепутать идентификаторы.","prereq":["types-aggregate"]},{"id":"types-decltype","title":"decltype и сохранение категории выражения","stage":4,"tier":"middle-required","difficulty":2,"what":"decltype получает тип по выражению; decltype(auto) может сохранять ссылочность результата.","know":"Разница decltype(x) и decltype((x)), decltype(auto), влияние скобок, риск возврата ссылки на локальный объект.","why":"Нужно для обобщённых обёрток, возвращающих результат без непреднамеренного копирования.","practice":"Сопоставьте типы нескольких выражений через static_assert и найдите функцию с висячим результатом decltype(auto).","prereq":["types-auto","pointers-references"]},{"id":"types-limits","title":"Свойства типов: std::numeric_limits","stage":2,"tier":"junior-plus","difficulty":1,"what":"std::numeric_limits предоставляет свойства числового типа независимо от конкретных числовых литералов.","know":"min, lowest, max, epsilon; различие min и lowest для вещественных типов, проверка платформенных предположений.","why":"Позволяет писать переносимые проверки границ и не зашивать размеры типов в код.","practice":"Постройте таблицу диапазонов int и double и исправьте поиск максимума, неверно начатый с min для double.","prereq":["types-integers","types-floating"]}]},{"id":"pointers","title":"Указатели, ссылки и время жизни","summary":"Научитесь различать объект, его адрес, владельца ресурса и временное представление данных. Эта ветка соединяет основы языка, контейнеры и RAII.","stage":1,"track":"language","prereq":["core","types"],"mini":["Чем адрес объекта отличается от самого объекта и что означает разыменование?","Чем отличаются const T*, T* const и const T&?","Когда ссылка или std::string_view становятся висячими?","В каких пределах допустима арифметика указателей и почему нельзя разыменовать указатель за концом массива?","Когда параметр лучше передать по значению, по ссылке или через std::span?"],"practice":["Напишите swap через ссылки и объясните передачу параметров.","Найдите и исправьте возврат указателя на локальную переменную.","Реализуйте поиск максимума в std::span\u003cconst int>.","Напишите функцию разбора строки через std::string_view, явно задокументировав время жизни результата."],"skills":[{"id":"pointers-lifetime","title":"Объект, область видимости и время жизни","stage":1,"tier":"junior-required","difficulty":1,"what":"У объекта есть время жизни, которое не всегда совпадает с областью видимости имени.","know":"Начало и конец жизни объекта, локальные и временные объекты, разрушение при выходе из блока, отличие хранения от жизни объекта.","why":"Даёт основу для понимания утечек, висячих ссылок и правил владения.","practice":"Проследите порядок создания и уничтожения трёх локальных объектов во вложенных блоках.","prereq":["core-scope","types-aggregate"]},{"id":"pointers-addresses","title":"Адреса и указатели","stage":1,"tier":"junior-required","difficulty":1,"what":"Указатель хранит значение адреса или специальное нулевое значение; разыменование обращается к объекту.","know":"T*, & для получения адреса, * для разыменования, адрес самого указателя, совместимость типов.","why":"Позволяет понимать многие C++ API и объяснять доступ к данным без копирования.","practice":"Покажите, как изменение *p меняет исходную переменную, и отдельно выведите адрес переменной и адрес указателя.","prereq":["pointers-lifetime"]},{"id":"pointers-references","title":"Ссылки и отсутствие копирования","stage":1,"tier":"junior-required","difficulty":1,"what":"Ссылка обозначает уже существующий объект и должна быть связана с ним при инициализации.","know":"T&, const T&, невозможность обычного перепривязывания ссылки, ссылки на временные значения и локальное продление их жизни.","why":"Нужна для эффективной передачи объектов и понятного изменения данных через функцию.","practice":"Напишите функцию нормализации структуры через ссылку и функцию чтения через const-ссылку.","prereq":["pointers-lifetime","core-functions"]},{"id":"pointers-const","title":"const correctness","stage":1,"tier":"junior-required","difficulty":1,"what":"const фиксирует невозможность изменения объекта через конкретный путь доступа.","know":"const-переменная, const-ссылка, поверхностная константность, ограничения const_cast, const в публичном контракте.","why":"Делает намерения API яснее и помогает компилятору обнаруживать нежелательные изменения.","practice":"Добавьте const в функции, которые только читают данные, и убедитесь, что попытка изменения не компилируется.","prereq":["pointers-references"]},{"id":"pointers-pointerconst","title":"Указатель на const и константный указатель","stage":2,"tier":"junior-required","difficulty":1,"what":"const может относиться к объекту по адресу, к самому указателю или к обоим.","know":"const T*, T* const, const T* const, чтение объявления, допустимые преобразования, опасность многоуровневых указателей.","why":"Помогает корректно читать сигнатуры библиотек и не обещать больше прав на изменение, чем требуется.","practice":"Для трёх вариантов объявления отметьте, можно ли менять адрес и можно ли менять значение по адресу.","prereq":["pointers-addresses","pointers-const"]},{"id":"pointers-arrays","title":"Встроенные массивы","stage":1,"tier":"junior-required","difficulty":0,"what":"Массив содержит фиксированное число элементов одного типа в непрерывном участке хранения.","know":"T[N], индексы от нуля, инициализация, sizeof массива, отсутствие автоматической проверки границ.","why":"Нужен для понимания низкоуровневых API и преимуществ std::array и std::vector.","practice":"Заполните массив, вычислите его длину в месте объявления и найдите ошибку выхода за границу.","prereq":["core-loops","types-fundamental"]},{"id":"pointers-arithmetic","title":"Арифметика указателей","stage":2,"tier":"junior-required","difficulty":1,"what":"Сдвиг указателя выражается в элементах и ограничен конкретным массивом и позицией сразу после него.","know":"p + n, разность указателей одного массива, указатель за концом, запрет разыменования за границей.","why":"Помогает понимать итераторы, буферы и частые причины повреждения памяти.","practice":"Пройдите один массив через два указателя и объясните, почему указатель end нельзя разыменовывать.","prereq":["pointers-addresses","pointers-arrays"]},{"id":"pointers-decay","title":"Преобразование массива в указатель","stage":2,"tier":"junior-plus","difficulty":1,"what":"В ряде выражений массив преобразуется в указатель на первый элемент и теряет информацию о длине.","know":"Параметр T a[] фактически задаёт указатель, sizeof параметра, передача размера отдельно, ссылка на массив, альтернатива std::span.","why":"Позволяет находить ошибки в функциях, которые принимают буфер и ошибочно вычисляют его длину.","practice":"Сравните sizeof массива в main и sizeof параметра функции; исправьте интерфейс передачи длины.","prereq":["pointers-arrays","pointers-arithmetic"]},{"id":"pointers-null","title":"nullptr и необязательное наличие объекта","stage":1,"tier":"junior-required","difficulty":0,"what":"nullptr обозначает отсутствие адреса; нулевой указатель нельзя разыменовывать.","know":"nullptr вместо 0 и NULL, проверка указателя, отличие отсутствующего объекта от пустой коллекции, контракт параметра.","why":"Нужен для безопасной работы с API, где отсутствие результата является допустимым состоянием.","practice":"Напишите поиск, возвращающий указатель или nullptr, и обработайте оба случая без разыменования пустого результата.","prereq":["pointers-addresses","core-condition"]},{"id":"pointers-dangling","title":"Висячие указатели и ссылки","stage":2,"tier":"junior-required","difficulty":1,"what":"Указатель или ссылка могут остаться после окончания жизни объекта, который они обозначали.","know":"Use-after-free, возврат адреса локального объекта, ссылки на временные значения, изменение контейнера, повторное использование адресов.","why":"Один из основных источников трудно воспроизводимых ошибок и уязвимостей C++.","practice":"Исправьте три примера: возврат ссылки на локальное значение, ссылка после удаления владельца и указатель после роста vector.","prereq":["pointers-lifetime","pointers-addresses","pointers-references"]},{"id":"pointers-passing","title":"Выбор способа передачи параметров","stage":2,"tier":"junior-required","difficulty":1,"what":"Способ передачи задаёт стоимость вызова, возможность изменения и обязательность наличия значения.","know":"Небольшие значения по значению; чтение больших объектов через const T&; изменение через T&; необязательный доступ через указатель; ясность владения.","why":"Помогает проектировать функции с предсказуемыми затратами и понятным контрактом.","practice":"Спроектируйте сигнатуры функций суммирования чисел, чтения документа и необязательного обновления объекта.","prereq":["pointers-const","pointers-null"]},{"id":"pointers-span","title":"Невладеющий диапазон: std::span","stage":3,"tier":"junior-plus","difficulty":1,"what":"std::span из C++20 хранит представление непрерывной последовательности без владения её элементами.","know":"Динамический и фиксированный размер, span\u003cconst T>, subspan, время жизни источника, отсутствие универсальной проверки границ при [].","why":"Позволяет передавать массивы и vector через единый интерфейс без копирования.","practice":"Напишите sum(std::span\u003cconst int>) и вызовите её для массива, std::array и std::vector.","prereq":["pointers-dangling","pointers-passing"]},{"id":"pointers-stringview","title":"Невладеющая строка: std::string_view","stage":3,"tier":"junior-plus","difficulty":1,"what":"std::string_view из C++17 представляет последовательность символов, не владея памятью.","know":"Время жизни исходной строки, substr без копирования, отсутствие гарантии нуль-терминации, опасность временного std::string.","why":"Полезен для чтения и разбора текста с меньшим числом выделений памяти.","practice":"Разбейте строку на представления отдельных слов и покажите, какие изменения исходной строки делают результаты недействительными.","prereq":["pointers-dangling","pointers-passing"]}]},{"id":"oop","title":"Классы и объектная модель","summary":"Проектируйте типы с корректными состояниями и ясным интерфейсом. Наследование и virtual изучайте как инструменты конкретных задач.","stage":2,"track":"language","prereq":["core","types"],"mini":["Как конструктор поддерживает инвариант класса?","Когда композиция проще и безопаснее наследования?","Почему полиморфному базовому классу часто нужен virtual-деструктор?","Что происходит при передаче производного объекта по значению как базового?"],"practice":["Создайте класс BankAccount с проверкой инварианта и закрытыми полями.","Соберите систему доставки из небольших компонентов через композицию.","Реализуйте интерфейс Shape с area() и двумя реализациями.","Удалите производный объект через std::unique_ptr\u003cBase> и проверьте правильный порядок разрушения."],"skills":[{"id":"oop-encapsulation","title":"Класс, инкапсуляция и инвариант","stage":2,"tier":"junior-required","difficulty":1,"what":"Класс связывает данные с операциями, которые поддерживают допустимое состояние объекта.","know":"class и struct, public/private, методы, инвариант, минимальный публичный интерфейс; различие class/struct по умолчаниям доступа.","why":"Позволяет сделать некорректные состояния менее доступными и менять реализацию без изменения пользователей.","practice":"Напишите класс Interval, который всегда сохраняет условие begin \u003c= end.","prereq":["types-aggregate","core-functions"]},{"id":"oop-constructors","title":"Конструкторы и список инициализации","stage":2,"tier":"junior-required","difficulty":1,"what":"Конструктор устанавливает начальное корректное состояние объекта до начала его использования.","know":"Конструктор по умолчанию, список инициализации, порядок по объявлению полей, explicit, делегирующие конструкторы.","why":"Предотвращает частично настроенные объекты и неожиданные неявные преобразования.","practice":"Создайте класс Temperature с explicit-конструктором и сравните порядок инициализации полей с порядком записи в списке.","prereq":["oop-encapsulation"]},{"id":"oop-destructors","title":"Деструкторы и порядок разрушения","stage":2,"tier":"junior-required","difficulty":1,"what":"Деструктор завершает жизнь объекта и освобождает ресурсы, которыми он владеет.","know":"~T, обратный порядок разрушения полей и баз, вызов при выходе из области видимости, опасность исключений из деструктора.","why":"Это основа автоматического освобождения ресурсов и устойчивого к ошибкам кода.","practice":"Добавьте сообщения в конструкторы и деструкторы составного объекта и объясните наблюдаемый порядок.","prereq":["oop-constructors","pointers-lifetime"]},{"id":"oop-constmethods","title":"const-методы и логическая константность","stage":2,"tier":"junior-required","difficulty":1,"what":"const-метод обещает не менять обычное состояние объекта через this.","know":"Квалификатор const у метода, перегрузки const/не-const, возвращаемые ссылки, mutable и его осторожное применение.","why":"Позволяет использовать тип через const-ссылку и контролировать доступ к внутренним данным.","practice":"Сделайте доступ к элементу класса в const- и изменяемом вариантах, не позволяя менять объект через const-ссылку.","prereq":["oop-encapsulation","pointers-const"]},{"id":"oop-composition","title":"Композиция объектов","stage":2,"tier":"junior-required","difficulty":1,"what":"Один объект содержит другие объекты и делегирует им часть работы.","know":"Отношение «содержит», ответственность компонента, передача зависимостей через конструктор, порядок жизни полей.","why":"Часто позволяет расширять поведение с меньшей связностью, чем иерархия наследования.","practice":"Соберите сервис отчётов из хранилища данных и форматтера, заменяя форматтер без изменения сервиса.","prereq":["oop-constructors"]},{"id":"oop-inheritance","title":"Наследование и отношение подтипов","stage":2,"tier":"junior-required","difficulty":1,"what":"Наследование определяет базовую часть объекта; public-наследование выражает возможность использовать производный объект как базовый.","know":"public/protected/private-наследование, доступ к членам, инициализация базы, отношение «является», ограничения замещения.","why":"Нужно для существующих иерархий и интерфейсов; помогает не использовать наследование только ради повторения кода.","practice":"Смоделируйте интерфейс источника данных и объясните, какие классы действительно являются его подтипами.","prereq":["oop-composition"]},{"id":"oop-virtual","title":"virtual и динамический выбор метода","stage":2,"tier":"junior-required","difficulty":1,"what":"При виртуальном вызове через базовую ссылку или указатель выбирается реализация фактического типа объекта.","know":"virtual, вызов через Base&, отличие от обычного вызова, стоимость косвенного перехода; vtable — распространённый механизм, не требование стандарта.","why":"Позволяет подставлять разные реализации интерфейса и понимать поведение полиморфного кода.","practice":"Обработайте набор разных фигур через ссылки на базовый тип и проследите выбранные методы.","prereq":["oop-inheritance","pointers-references"]},{"id":"oop-interfaces","title":"Абстрактные классы и интерфейсы","stage":2,"tier":"junior-required","difficulty":1,"what":"Абстрактный класс задаёт набор операций, оставляя часть поведения производным классам.","know":"Чисто виртуальные функции = 0, запрет создания абстрактного объекта, малые интерфейсы, управление временем жизни реализации.","why":"Нужен для заменяемых реализаций, тестовых подстановок и границ между компонентами.","practice":"Определите интерфейс Printer и реализации для консоли и памяти, не меняя код клиента.","prereq":["oop-virtual"]},{"id":"oop-slicing","title":"Срезка объектов","stage":2,"tier":"junior-required","difficulty":1,"what":"При копировании производного объекта в объект базового типа производная часть не сохраняется.","know":"Передача Base по значению, хранение vector\u003cBase>, потеря полиморфизма, передача по ссылке и владение через указатели.","why":"Помогает исправлять тихие ошибки, при которых код компилируется, но вызывает не то поведение.","practice":"Получите срезку в функции print(Base), затем исправьте её через const Base&.","prereq":["oop-virtual","pointers-passing"]},{"id":"oop-virtualdtor","title":"Виртуальный деструктор","stage":2,"tier":"junior-required","difficulty":1,"what":"Удаление производного объекта через базовый указатель требует подходящего контракта разрушения; обычный путь — public virtual-деструктор.","know":"virtual ~Base() = default, разрушение через базовый указатель, альтернатива protected non-virtual при запрете такого удаления, опасность UB.","why":"Необходим для безопасного владения полиморфными объектами.","practice":"Добавьте ресурсы в производный класс и проверьте, что удаление через Base* вызывает оба деструктора.","prereq":["oop-virtual","oop-destructors"]},{"id":"oop-override","title":"override, final и сокрытие имён","stage":3,"tier":"junior-plus","difficulty":1,"what":"override проверяет намерение переопределить виртуальную функцию; final ограничивает дальнейшее переопределение или наследование.","know":"Точное совпадение сигнатуры, const-квалификаторы, сокрытие перегрузок в производном классе, using Base::method.","why":"Предотвращает ошибки в поддерживаемых иерархиях при изменении интерфейсов.","practice":"Создайте ошибку с пропущенным const, обнаружьте её через override и восстановите видимость перегрузок.","prereq":["oop-virtual","oop-constmethods"]},{"id":"oop-rtti","title":"RTTI и dynamic_cast","stage":4,"tier":"middle-required","difficulty":2,"what":"RTTI позволяет в некоторых случаях узнать фактический тип полиморфного объекта во время выполнения.","know":"dynamic_cast для указателей и ссылок, nullptr или std::bad_cast при неудаче, typeid, ограничения сборок без RTTI, альтернатива виртуальной операции.","why":"Нужно для анализа существующего кода и обоснованного выбора между проверкой типа и расширением интерфейса.","practice":"Реализуйте безопасную проверку производного типа, затем предложите интерфейс, которому такая проверка не нужна.","prereq":["oop-interfaces","types-casts"]}]},{"id":"raii","title":"Память, владение и RAII","summary":"Автоматически управляйте ресурсами, ясно назначайте владельцев и различайте копирование с передачей владения. Использование std::unique_ptr доступно раньше глубокого изучения move semantics.","stage":2,"track":"language","prereq":["pointers","oop"],"mini":["Почему RAII освобождает ресурс и при раннем return, и при исключении?","Чем единоличное владение отличается от совместного, а владелец — от наблюдателя?","Почему std::move сам по себе ничего не перемещает?","Когда достаточно правила нуля и когда нужны собственные специальные методы?","Почему цикл из shared_ptr может удерживать объекты навсегда?"],"practice":["Сделайте небольшое хранилище объектов через std::unique_ptr.","Создайте RAII-обёртку файлового дескриптора с запретом копирования и поддержкой перемещения.","Продемонстрируйте цикл shared_ptr и разорвите его через weak_ptr.","Проверьте поведение владельца ресурса при раннем выходе и искусственном исключении.","Посчитайте копирования и перемещения объекта при росте vector и объясните роль noexcept."],"skills":[{"id":"raii-storage","title":"Время хранения: автоматическое, динамическое, статическое","stage":2,"tier":"junior-required","difficulty":1,"what":"Время хранения определяет, как долго доступна память; его следует отличать от времени жизни объекта.","know":"Автоматическое, статическое, thread_local и динамическое хранение; стек и куча как обычная модель реализации, не универсальное требование стандарта.","why":"Позволяет понимать стоимость и жизненный цикл данных без ошибочного правила «всё локальное всегда на стеке».","practice":"Классифицируйте локальную переменную, static-поле, выделенный объект и thread_local-переменную.","prereq":["pointers-lifetime"]},{"id":"raii-newdelete","title":"new, delete и ручное управление памятью","stage":2,"tier":"junior-required","difficulty":1,"what":"new выделяет память и создаёт объект; delete разрушает объект и освобождает выделение.","know":"Парность new/delete и new[]/delete[], утечки, повторное удаление, nullptr, предпочтение контейнеров и RAII в прикладном коде.","why":"Нужно для чтения существующего кода и понимания того, какие ошибки устраняют владельцы ресурсов.","practice":"Найдите утечку и несовпадающие формы удаления в небольшом примере, затем замените ручное владение.","prereq":["raii-storage","pointers-addresses","oop-destructors"]},{"id":"raii-ownership","title":"Владелец и невладеющий доступ","stage":2,"tier":"junior-required","difficulty":1,"what":"Владелец отвечает за завершение жизни ресурса; указатель или ссылка сами по себе обычно не выражают владение.","know":"Единоличное и совместное владение, заимствование, передача владения, граф жизни объектов, документация сырого указателя.","why":"Позволяет проектировать API, где понятно, кто освобождает данные и сколько они доступны.","practice":"Нарисуйте граф владения для приложения с документом, редактором и временным представлением текста.","prereq":["pointers-dangling","pointers-passing"]},{"id":"raii-basic","title":"RAII: ресурс связан с жизнью объекта","stage":2,"tier":"junior-required","difficulty":1,"what":"Объект получает ресурс при создании и автоматически освобождает его при разрушении.","know":"Ресурсы бывают памятью, файлами, блокировками и соединениями; деструктор, ранний выход, раскрутка стека, отсутствие ручного cleanup во всех ветках.","why":"Сокращает утечки и делает освобождение ресурса обязательной частью структуры программы.","practice":"Используйте std::ifstream в функции с несколькими ранними return и объясните, кто закрывает файл.","prereq":["oop-destructors","raii-ownership"]},{"id":"raii-unique","title":"Единоличное владение: std::unique_ptr","stage":2,"tier":"junior-required","difficulty":1,"what":"std::unique_ptr автоматически удаляет объект, у которого один владелец.","know":"std::make_unique, * и ->, get, reset, запрет копирования, передача владения через std::move; глубокая теория перемещений изучается позже.","why":"Позволяет безопасно владеть динамическими и полиморфными объектами уже на уровне Junior.","practice":"Создайте фабрику, возвращающую unique_ptr\u003cShape>, и передайте результат в хранилище владельцев.","prereq":["raii-basic","oop-virtualdtor"]},{"id":"raii-shared","title":"Совместное владение: std::shared_ptr","stage":3,"tier":"junior-plus","difficulty":1,"what":"std::shared_ptr разделяет владение объектом между несколькими владельцами через управляющий блок.","know":"std::make_shared, счётчик владельцев, цена копирования, отдельная жизнь управляющего блока, отсутствие автоматической потокобезопасности самого объекта.","why":"Нужен, когда время жизни действительно определяется несколькими независимыми владельцами.","practice":"Смоделируйте общий объект конфигурации и объясните, почему shared_ptr не защищает одновременное изменение его полей.","prereq":["raii-ownership","raii-basic"]},{"id":"raii-weak","title":"Наблюдение за общим объектом: std::weak_ptr","stage":3,"tier":"junior-plus","difficulty":1,"what":"std::weak_ptr наблюдает за объектом shared_ptr, не продлевая его жизнь.","know":"lock, expired, проверка через результат lock, циклы владения, отделение навигационной связи от владения.","why":"Помогает избежать утечек в графах объектов и безопасно обращаться к необязательному живому объекту.","practice":"Создайте связи родитель–ребёнок и используйте weak_ptr для обратной ссылки на родителя.","prereq":["raii-shared"]},{"id":"raii-rulezero","title":"Правило нуля","stage":2,"tier":"junior-required","difficulty":1,"what":"Класс по возможности использует готовых владельцев ресурсов и не пишет специальные операции вручную.","know":"Поля std::string, vector, unique_ptr; автоматически созданные специальные функции; намеренный запрет копирования.","why":"Уменьшает объём опасного кода и делает поведение класса следствием поведения его полей.","practice":"Замените char* и ручной деструктор в учебном классе на std::string и удалите лишние специальные методы.","prereq":["raii-basic","oop-constructors"]},{"id":"raii-copy","title":"Копирование и семантика значения","stage":2,"tier":"junior-required","difficulty":1,"what":"Копия объекта должна соответствовать смыслу его типа: независимое значение или явно определённое совместное состояние.","know":"Копирующий конструктор и оператор присваивания, поверхностная и глубокая копия, самоприсваивание, стоимость копирования.","why":"Помогает замечать двойное удаление, случайное совместное состояние и дорогую передачу по значению.","practice":"Сравните копирование vector\u003cint> и класса с сырым владеющим указателем; объясните проблему второго.","prereq":["raii-newdelete","raii-rulezero"]},{"id":"raii-categories","title":"Категории выражений: lvalue и rvalue","stage":4,"tier":"middle-required","difficulty":2,"what":"Категория выражения описывает, как выражение обозначает объект или значение и какие ссылки могут с ним связываться.","know":"lvalue, xvalue, prvalue, T&&, именованная rvalue-ссылка как lvalue, материализация временного объекта на концептуальном уровне.","why":"Нужна для осмысленного чтения перегрузок по ссылкам и реализации перемещений.","practice":"Определите категории именованной переменной, литерала, вызова функции по значению и std::move(x).","prereq":["pointers-references","types-decltype"]},{"id":"raii-move","title":"Перемещающие операции","stage":4,"tier":"middle-required","difficulty":2,"what":"Перемещение позволяет передать ресурсы от объекта-источника новому владельцу по правилам конкретного типа.","know":"Move-конструктор, move-присваивание, допустимое состояние источника после перемещения, самоперемещение, правило пяти.","why":"Важно для владельцев ресурсов и эффективных контейнеров; не означает, что каждый пользовательский тип становится безопасен автоматически.","practice":"Реализуйте перемещение небольшого владельца буфера, оставляя источник в определённом вашем контрактом состоянии.","prereq":["raii-categories","raii-copy"]},{"id":"raii-stdmove","title":"std::move: разрешение выбрать перемещение","stage":3,"tier":"junior-plus","difficulty":1,"what":"std::move выполняет преобразование категории выражения; фактическое перемещение происходит только в подходящей операции.","know":"Применение к владельцу, отсутствие гарантии перемещения из const, чтение объекта после перемещения по контракту, лишний std::move в return.","why":"Предотвращает неверную мысль, что один вызов std::move уже передал или освободил ресурс.","practice":"Сравните создание объекта из x, std::move(x) и std::move(const_x), считая реальные копирования.","prereq":["raii-unique","raii-copy"]},{"id":"raii-noexcept","title":"noexcept, swap и устойчивое перемещение","stage":4,"tier":"middle-required","difficulty":2,"what":"noexcept сообщает, что операция не выпускает исключения; это влияет на стратегии контейнеров и обработку ошибок.","know":"noexcept у move, корректность обещания, noexcept(expr), swap, базовая идея std::move_if_noexcept, terminate при нарушении.","why":"Помогает создавать типы, которые эффективно и надёжно работают внутри стандартных контейнеров.","practice":"Сравните рост vector для типа с потенциально бросающим и noexcept move-конструктором, фиксируя вызовы.","prereq":["raii-move"]},{"id":"raii-wrappers","title":"Собственная RAII-обёртка и нестандартное освобождение","stage":4,"tier":"middle-required","difficulty":2,"what":"Обёртка превращает внешний ресурс с ручным закрытием в обычный C++ объект с ясным владением.","know":"Запрет копирования, передача владения, корректное пустое состояние, custom deleter у unique_ptr, невыбрасывающий деструктор.","why":"Нужна для файловых дескрипторов, системных handle и C-библиотек, которые возвращают собственные ресурсы.","practice":"Оберните ресурс внешнего API с функциями acquire/release и проверьте ровно одно освобождение на всех путях.","prereq":["raii-basic","raii-move","raii-noexcept"]},{"id":"raii-allocators","title":"Allocators и разделение памяти и объектов","stage":5,"tier":"specialization","difficulty":2,"what":"Настройка способа выделения памяти контейнеров независимо от конструирования элементов.","know":"allocate/deallocate и construct/destroy, allocator_traits, rebinding, propagation и ограничения совместимости.","why":"Нужно для контейнерных библиотек, контролируемой памяти и оптимизации измеренных аллокаций.","practice":"Создайте считающий allocator для std::vector и сопоставьте события с size, capacity и reserve.","prereq":["raii-move","templates-traits","stl-vector"]},{"id":"raii-pmr","title":"Полиморфные ресурсы памяти: std::pmr","stage":5,"tier":"specialization","difficulty":2,"what":"Механизм выбора источника памяти во время выполнения без смены типа pmr-контейнера.","know":"memory_resource, monotonic_buffer_resource, pool_resource; время жизни ресурса должно перекрывать жизнь использующих его контейнеров.","why":"Полезно для обработки запросов и пакетных операций с общим временем освобождения памяти.","practice":"Соберите строки одного запроса в pmr-контейнере, измерьте число аллокаций и безопасно освободите весь ресурс.","prereq":["raii-allocators","pointers-lifetime"]}]},{"id":"stl","title":"Стандартная библиотека: контейнеры и алгоритмы","summary":"Выбирайте контейнер по операциям, используйте готовые алгоритмы и отслеживайте инвалидирование. Библиотека экономит время только при понимании её контрактов.","stage":2,"track":"language","prereq":["core","types","pointers"],"mini":["Когда vector лучше list, несмотря на дорогую вставку в середину?","Чем отличаются упорядоченный map и unordered_map по гарантиям и типичным затратам?","Какие изменения контейнера делают ссылки или итераторы недействительными?","Какие свойства обязан соблюдать компаратор сортировки?","Владеет ли ranges-представление данными и когда вычисляется его результат?"],"practice":["Напишите каталог книг на vector с сортировкой по нескольким полям.","Постройте частотный словарь слов через unordered_map.","Реализуйте очередь задач через подходящий контейнерный адаптер.","Сравните несколько контейнеров на своих типичных операциях и объясните выбор.","Решите пять задач с find_if, sort, transform, accumulate и remove_if либо erase_if."],"skills":[{"id":"stl-string","title":"Строки: std::string","stage":1,"tier":"junior-required","difficulty":0,"what":"std::string владеет изменяемой последовательностью char и управляет памятью автоматически.","know":"size, empty, [], at, find, substr, append, c_str, строки с пробелами, различие байтов и символов Unicode.","why":"Базовый инструмент обработки текста, путей и простых форматов.","practice":"Напишите нормализацию пробелов и поиск слова в строке, обработав отсутствие результата.","prereq":["core-io","types-characters"]},{"id":"stl-vector","title":"Динамический массив: std::vector","stage":1,"tier":"junior-required","difficulty":1,"what":"std::vector хранит непрерывную последовательность элементов с изменяемым размером.","know":"size и capacity, push_back, emplace_back, reserve, resize, [], at, амортизированная стоимость добавления, перераспределение памяти.","why":"Основной контейнер общего назначения; обеспечивает удобный обход и хорошую локальность данных.","practice":"Считайте произвольное число измерений, зарезервируйте ожидаемый объём и найдите минимум и среднее.","prereq":["pointers-arrays","types-auto"]},{"id":"stl-array","title":"Фиксированный массив: std::array","stage":2,"tier":"junior-required","difficulty":0,"what":"std::array\u003cT, N> предоставляет интерфейс контейнера для фиксированного количества элементов.","know":"Размер является частью типа, aggregate-инициализация, begin/end, передача по значению, сравнение с C-массивом.","why":"Удобен для небольших наборов фиксированной формы с известным размером.","practice":"Представьте координаты или таблицу дней недели через std::array и передайте в функцию без потери размера.","prereq":["pointers-arrays","types-aggregate"]},{"id":"stl-deque","title":"Двусторонняя очередь: std::deque","stage":2,"tier":"junior-plus","difficulty":1,"what":"std::deque поддерживает эффективное добавление и удаление с обоих концов и индексный доступ.","know":"push_front/back, pop_front/back, отсутствие гарантии единого непрерывного блока, стоимость операций, собственные правила инвалидирования.","why":"Нужен для очередей и скользящих наборов данных, когда операций с обоих концов много.","practice":"Напишите ограниченную историю событий с добавлением новых и удалением самых старых элементов.","prereq":["stl-vector"]},{"id":"stl-list","title":"Связные контейнеры: std::list и std::forward_list","stage":3,"tier":"junior-plus","difficulty":1,"what":"Узловые списки хранят элементы отдельно и связывают их указателями.","know":"Дву- и односвязная структура, splice, вставка по известной позиции, линейный поиск, выделения памяти и слабая локальность.","why":"Помогает обоснованно выбрать редкий случай для списка и не считать его автоматически быстрее vector.","practice":"Сравните обход list и vector и продемонстрируйте перенос узлов через splice без копирования элементов.","prereq":["pointers-addresses","stl-vector"]},{"id":"stl-map","title":"Упорядоченный словарь: std::map","stage":2,"tier":"junior-required","difficulty":1,"what":"std::map хранит уникальные ключи в порядке компаратора и связывает их со значениями.","know":"find, contains с C++20, lower_bound, insert, try_emplace, логарифмические операции; operator[] может вставлять элемент.","why":"Полезен, когда нужны отсортированные ключи, диапазонные запросы и предсказуемые гарантии поиска.","practice":"Создайте расписание по времени, найдите первое событие не раньше указанного и избегайте лишних вставок при проверке.","prereq":["stl-vector","pointers-const"]},{"id":"stl-set","title":"Упорядоченные множества: std::set","stage":2,"tier":"junior-required","difficulty":1,"what":"std::set хранит уникальные ключи в порядке сравнения; multiset допускает повторения.","know":"insert, find, erase, lower_bound, уникальность через эквивалентность компаратора, неизменяемость ключей через итератор.","why":"Удобен для дедупликации с порядком и запросов по диапазону.","practice":"Найдите уникальные отсортированные значения и ближайшее допустимое значение через lower_bound.","prereq":["stl-map"]},{"id":"stl-unordered","title":"Хеш-контейнеры: std::unordered_map и std::unordered_set","stage":2,"tier":"junior-required","difficulty":1,"what":"Хеш-контейнеры распределяют ключи по корзинам для быстрого поиска без упорядоченного обхода.","know":"hash и equality должны согласовываться, средняя сложность и худший случай, reserve, rehash, load_factor, отсутствие стабильного порядка.","why":"Нужны для индексов, частотных таблиц и проверки принадлежности.","practice":"Подсчитайте частоты слов и добавьте собственный ключ из двух полей с корректными hash и equality.","prereq":["stl-map","types-aggregate"]},{"id":"stl-adaptors","title":"Адаптеры: stack, queue и priority_queue","stage":2,"tier":"junior-required","difficulty":1,"what":"Адаптер задаёт ограниченный интерфейс поверх контейнера для определённого порядка извлечения.","know":"LIFO, FIFO, top/front, push/pop, priority_queue по умолчанию возвращает наибольший элемент, настройка сравнения.","why":"Помогает выразить стек обработки, очередь работ и выбор задачи с приоритетом.","practice":"Сделайте планировщик, который сначала выдаёт задачи с ближайшим сроком, и объясните компаратор.","prereq":["stl-vector"]},{"id":"stl-iterators","title":"Итераторы и полуоткрытые диапазоны","stage":2,"tier":"junior-required","difficulty":1,"what":"Итератор обозначает позицию в последовательности, а пара [begin, end) задаёт диапазон.","know":"Разыменование, инкремент, end как неэлемент, категории итераторов, const_iterator, std::distance, ограниченность операций по категории.","why":"Соединяет контейнеры со стандартными алгоритмами и позволяет писать переносимый обход.","practice":"Обойдите vector и list через итераторы; объясните, почему выражение it + 3 допустимо не для обоих.","prereq":["pointers-arithmetic","stl-vector"]},{"id":"stl-invalidation","title":"Инвалидирование итераторов и ссылок","stage":2,"tier":"junior-required","difficulty":1,"what":"Изменение контейнера может лишить сохранённые итераторы, указатели и ссылки действительности.","know":"Перераспределение vector, erase, rehash unordered-контейнеров, различия гарантий ссылок и итераторов, проверка конкретного контракта.","why":"Предотвращает use-after-free и ошибки циклов удаления.","practice":"Исправьте цикл удаления элементов из vector, используя возвращаемый итератор либо erase_if при доступном стандарте.","prereq":["stl-iterators","pointers-dangling"]},{"id":"stl-algorithms","title":"Стандартные алгоритмы","stage":2,"tier":"junior-required","difficulty":1,"what":"Алгоритмы реализуют типовые операции над диапазонами независимо от конкретного контейнера.","know":"find, find_if, count_if, sort, lower_bound для отсортированных данных, transform, remove_if; удаление значений и уменьшение контейнера — разные действия.","why":"Позволяет писать короткий проверяемый код и не повторять сложные детали типовых операций.","practice":"Обработайте каталог через find_if, sort и remove_if с erase, затем объясните требования каждого алгоритма.","prereq":["stl-iterators"]},{"id":"stl-lambdas","title":"Лямбда-выражения и захваты","stage":2,"tier":"junior-required","difficulty":1,"what":"Лямбда создаёт небольшой вызываемый объект прямо в месте использования.","know":"[] и параметры, захват по значению и ссылке, явные захваты, mutable, время жизни захваченных объектов, захват this.","why":"Нужна для алгоритмов, обратных вызовов и локального поведения; неверный захват создаёт висячие ссылки.","practice":"Отсортируйте элементы по внешнему порогу и исправьте callback, который переживает захваченную по ссылке переменную.","prereq":["core-functions","pointers-dangling"]},{"id":"stl-comparators","title":"Компараторы и строгий слабый порядок","stage":3,"tier":"junior-plus","difficulty":2,"what":"Компаратор упорядочения должен задавать согласованное отношение, требуемое контейнером или алгоритмом.","know":"Строгий слабый порядок, comp(x,x) == false, согласованность и транзитивность, лексикографическое сравнение, опасность \u003c=.","why":"Неверный компаратор нарушает предусловия sort и упорядоченных контейнеров.","practice":"Напишите сравнение по фамилии и имени, затем продемонстрируйте нарушение контракта при использовании \u003c=.","prereq":["stl-lambdas","stl-algorithms"]},{"id":"stl-numeric","title":"Числовые алгоритмы: accumulate и iota","stage":2,"tier":"junior-required","difficulty":1,"what":"Числовые алгоритмы выполняют свёртки и генерацию последовательностей.","know":"std::accumulate, тип начального значения, std::iota, inner_product по необходимости; порядок и перегруппировка операций у reduce отличаются.","why":"Помогает выразить расчёты без ручных циклов и контролировать тип результата.","practice":"Посчитайте сумму double-значений с начальными 0 и 0.0 и объясните различие результата.","prereq":["stl-algorithms","types-conversions"]},{"id":"stl-optional","title":"Необязательное значение: std::optional","stage":2,"tier":"junior-required","difficulty":1,"what":"std::optional\u003cT> из C++17 хранит либо значение T, либо отсутствие значения.","know":"nullopt, has_value, value, value_or, разыменование только при наличии, отсутствие как часть контракта.","why":"Позволяет не кодировать отсутствие результата магическим числом или ненужным выделением памяти.","practice":"Верните optional\u003cint> из функции разбора простой команды и обработайте оба состояния.","prereq":["types-aggregate","core-condition"]},{"id":"stl-variant","title":"Один из вариантов: std::variant","stage":3,"tier":"junior-plus","difficulty":1,"what":"std::variant из C++17 хранит значение одного из заранее известных типов.","know":"std::visit, get_if, index, безопасная обработка всех альтернатив, отличие от наследования; состояние valueless_by_exception возможно при некоторых операциях.","why":"Подходит для сообщений, синтаксических узлов и типов, где варианты известны при компиляции.","practice":"Опишите событие как variant из трёх структур и обработайте каждый вид через std::visit.","prereq":["stl-lambdas","types-aggregate"]},{"id":"stl-tuples","title":"Пары, кортежи и structured bindings","stage":2,"tier":"junior-plus","difficulty":1,"what":"std::pair и std::tuple объединяют несколько значений; structured bindings из C++17 дают им локальные имена.","know":"std::get, make_pair, structured bindings по значению и по ссылке, выбор именованной структуры для устойчивого публичного API.","why":"Полезны для результатов алгоритмов и обхода словарей без лишнего вспомогательного кода.","practice":"Обойдите map через const auto& [key, value] и верните два результата из вспомогательной функции.","prereq":["types-auto","types-aggregate","stl-map"]},{"id":"stl-ranges","title":"Диапазоны и views: std::ranges","stage":4,"tier":"middle-required","difficulty":2,"what":"C++20 ranges связывают алгоритмы с диапазонами, а views позволяют составлять ленивые преобразования.","know":"ranges::sort, проекции, views::filter и transform, ленивое вычисление, владеющие и невладеющие диапазоны, время жизни источника.","why":"Позволяет собирать читаемые цепочки обработки, сохраняя контроль над вычислениями и памятью.","practice":"Создайте цепочку фильтрации и преобразования, подсчитайте реальные вызовы предиката и проверьте время жизни источника.","prereq":["stl-algorithms","stl-lambdas","pointers-stringview"]}]},{"id":"templates","title":"Шаблоны и обобщённое программирование","summary":"Начните с чтения типовых шаблонных интерфейсов. Затем изучайте ограничения, вывод типов и точное сохранение свойств аргументов; метапрограммирование нужно по задаче.","stage":3,"track":"language","prereq":["core","types","pointers"],"mini":["Почему определение обычного шаблона обычно доступно в заголовке?","Чем вывод T для параметров T, T& и T&& отличается?","Когда T&& является forwarding reference, а когда обычной rvalue-ссылкой?","Как concept делает требования к типу понятнее, чем длинная ошибка подстановки?","Как отличить нужную обобщённость от усложнения API ради одного частного случая?"],"practice":["Напишите max_value\u003cT> и проверьте вызовы с разными типами.","Создайте небольшой шаблонный контейнер фиксированного размера.","Ограничьте шаблон с помощью concept и проверьте понятность ошибки для неподходящего типа.","Напишите обёртку вызова с perfect forwarding и проверьте ссылки, move-only аргументы и возвращаемый тип.","Сравните старое ограничение через enable_if с вариантом requires."],"skills":[{"id":"templates-functions","title":"Шаблоны функций","stage":3,"tier":"junior-plus","difficulty":1,"what":"Шаблон функции описывает семейство функций, создаваемых для подходящих аргументов шаблона.","know":"template\u003ctypename T>, явные и выводимые параметры, создание специализации при использовании, доступность определения.","why":"Позволяет читать и писать небольшие операции, работающие с несколькими типами без копирования исходного кода.","practice":"Напишите функцию поиска большего из двух значений и разберите ошибку вызова с int и double.","prereq":["core-overloads","types-auto"]},{"id":"templates-classes","title":"Шаблоны классов","stage":3,"tier":"junior-plus","difficulty":1,"what":"Шаблон класса создаёт семейство типов с параметризованными данными или поведением.","know":"Параметры типов, нетиповые параметры, значения по умолчанию, разные специализации как разные типы, определения методов.","why":"Необходим для понимания vector\u003cT>, array\u003cT,N> и простых собственных обобщённых типов.","practice":"Создайте FixedBuffer\u003cT, N> с проверяемым доступом и используйте с двумя типами элементов.","prereq":["templates-functions","oop-encapsulation"]},{"id":"templates-deduction","title":"Вывод аргументов шаблона","stage":4,"tier":"middle-required","difficulty":2,"what":"Компилятор выводит параметры шаблона из контекста по правилам, зависящим от формы параметра.","know":"Параметры T, T&, const T&, массивы и ссылки, CTAD с C++17, ограничения вывода, нежелательные копии.","why":"Позволяет объяснять реальные ошибки вызовов обобщённых функций и выбирать корректную сигнатуру.","practice":"Составьте таблицу выводимых T для const-объекта, ссылки, массива и временного значения.","prereq":["templates-functions","pointers-references","types-auto"]},{"id":"templates-specialization","title":"Специализация и перегрузка шаблонов","stage":4,"tier":"middle-required","difficulty":2,"what":"Специализация задаёт особый вариант шаблона для выбранных аргументов; перегрузка добавляет кандидата для функции.","know":"Полная специализация, частичная специализация классов, отсутствие частичной специализации функций, выбор перегрузки как альтернатива.","why":"Помогает читать библиотечный код и локализовать различия поведения без цепочки проверок во время выполнения.","practice":"Напишите специализацию класса для указателей и объясните, почему аналогичную функцию удобнее перегрузить.","prereq":["templates-classes","core-overloads"]},{"id":"templates-dependent","title":"Зависимые имена и поиск в шаблонах","stage":4,"tier":"middle-required","difficulty":2,"what":"Смысл некоторых имён в шаблоне определяется только после подстановки параметров.","know":"typename, template как уточнитель, this-> для зависимой базы, двухфазный поиск на концептуальном уровне, ADL и его влияние.","why":"Позволяет исправлять частые ошибки шаблонных библиотек, которые кажутся непоследовательными.","practice":"Исправьте обращение к вложенному типу T::value_type и методу зависимого базового класса.","prereq":["templates-classes","core-scope"]},{"id":"templates-variadic","title":"Пакеты параметров и fold expressions","stage":4,"tier":"middle-required","difficulty":2,"what":"Variadic templates принимают переменное число параметров на этапе компиляции.","know":"typename... Ts, Ts... args, раскрытие пакета, sizeof..., fold expressions с C++17, пустые пакеты и порядок вычисления.","why":"Нужны для обобщённых конструкторов, наборов аргументов и небольших библиотечных адаптеров.","practice":"Напишите функцию проверки, что все аргументы положительны, и явно обработайте случай пустого пакета.","prereq":["templates-functions"]},{"id":"templates-traits","title":"Свойства типов и type traits","stage":4,"tier":"middle-required","difficulty":2,"what":"Type traits сообщают свойства типа или строят новый тип на этапе компиляции.","know":"std::is_same_v, is_integral_v, remove_reference_t, remove_cvref_t с C++20, static_assert, отличие признака от гарантии семантики.","why":"Позволяет задавать ограничения обобщённого кода и выбирать реализацию без проверок во время выполнения.","practice":"Создайте compile-time проверки ссылочности и константности и нормализуйте тип через remove_cvref_t.","prereq":["templates-classes","types-decltype"]},{"id":"templates-sfinae","title":"SFINAE и std::enable_if","stage":4,"tier":"specialization","difficulty":2,"what":"Некоторые ошибки подстановки убирают шаблон из кандидатов вместо немедленного завершения компиляции.","know":"Контекст подстановки, enable_if_t, void_t, detection idiom на уровне чтения; не вся ошибка тела функции является SFINAE.","why":"Нужно прежде всего для сопровождения библиотек до C++20; для нового кода часто яснее concepts.","practice":"Разберите два кандидата с enable_if и перепишите ограничение понятным requires при C++20.","prereq":["templates-traits","templates-deduction"]},{"id":"templates-concepts","title":"Concepts и requires","stage":4,"tier":"middle-required","difficulty":2,"what":"Concepts из C++20 задают именованные требования к шаблонным параметрам.","know":"concept, requires-clause, requires-expression, простые и составные требования, стандартные concepts, ограничения синтаксиса и семантики.","why":"Делают публичные шаблонные интерфейсы понятнее и улучшают диагностику неподходящих типов.","practice":"Опишите concept для типа с size() и begin(), затем объясните, какие смысловые свойства он не проверяет.","prereq":["templates-traits","templates-deduction"]},{"id":"templates-forwarding","title":"Perfect forwarding и std::forward","stage":4,"tier":"middle-required","difficulty":2,"what":"Perfect forwarding сохраняет категорию переданного аргумента при пересылке в другую функцию.","know":"Forwarding reference T&& при выводе T, схлопывание ссылок, std::forward\u003cT>, отличие от безусловного std::move, опасность универсальных конструкторов.","why":"Нужно для фабрик и тонких обёрток, которые не должны случайно копировать или перемещать аргументы.","practice":"Напишите фабрику с Args&&... и std::forward, протестируйте lvalue, временный объект и unique_ptr.","prereq":["templates-deduction","templates-variadic","raii-categories","raii-stdmove"]},{"id":"templates-ifconstexpr","title":"if constexpr и выбор ветви по типу","stage":4,"tier":"middle-required","difficulty":1,"what":"if constexpr из C++17 позволяет отбросить неподходящую ветвь шаблонного кода при создании специализации.","know":"Константное условие, зависимый код в отброшенной ветке, отличие от обычного if, static_assert для недопустимых вариантов.","why":"Упрощает небольшие различия алгоритма по свойствам типа без множества перегрузок.","practice":"Напишите форматирование числа или диапазона, выбирая реализацию через if constexpr и свойства типа.","prereq":["templates-traits"]},{"id":"templates-instantiation","title":"Создание специализаций и стоимость шаблонов","stage":5,"tier":"specialization","difficulty":2,"what":"Использование шаблона создаёт конкретные специализации, влияя на время сборки и размер бинарного файла.","know":"Неявная и явная инстанциация, extern template, повторные специализации, размер кода, границы выноса реализации из заголовка.","why":"Важно для крупных библиотек и проектов с медленной сборкой; требует измерений, а не запрета шаблонов.","practice":"Измерьте время сборки небольшого проекта до и после явной инстанциации часто используемого шаблона.","prereq":["templates-classes","core-files"]}]},{"id":"modern","title":"Современный C++: версии и осознанное применение","summary":"Изучайте возможности стандарта через реальные задачи и поддержку целевых компиляторов. C++17/20 — удобные учебные основы; отдельные возможности C++23 и сложные механизмы добавляйте по необходимости.","stage":3,"track":"language","prereq":["core","types"],"mini":["Какие возможности вашего проекта требуют именно C++17, C++20 или C++23?","Чем constexpr отличается от consteval и constinit?","Почему выбор флага стандарта не гарантирует полной поддержки стандартной библиотеки?","Какую проблему решают modules и что при этом остаётся задачей системы сборки?"],"practice":["Соберите один небольшой проект в режимах C++17 и C++20 и составьте список требуемых возможностей.","Перепишите ручное управление ресурсом с использованием возможностей C++11/14.","Добавьте feature-test macro для необязательной возможности библиотеки.","Вычислите небольшую таблицу при компиляции и сравните читаемость с вариантом времени выполнения.","Сделайте учебный пример modules или coroutine отдельно от основного проекта."],"skills":[{"id":"modern-cpp11","title":"C++11: основа современного стиля","stage":2,"tier":"junior-plus","difficulty":1,"what":"C++11 ввёл многие механизмы, на которых строится современный повседневный код.","know":"auto, nullptr, range-for, lambdas, enum class, = default/= delete, RAII-владельцы; глубокую теорию move изучайте отдельной темой.","why":"Помогает распознавать современный стиль и постепенно обновлять устаревшие примеры.","practice":"Перепишите небольшой код с NULL, индексным обходом и ручным освобождением на современный безопасный стиль.","prereq":["types-auto","types-enum","raii-basic"]},{"id":"modern-cpp14","title":"C++14: удобные фабрики и обобщённые лямбды","stage":3,"tier":"junior-plus","difficulty":1,"what":"C++14 развил повседневные возможности C++11 без полной смены модели языка.","know":"std::make_unique, generic lambdas с auto-параметрами, init-capture, вывод return auto, более свободные constexpr-функции.","why":"Позволяет писать компактные обработчики и передавать move-only объекты в лямбды.","practice":"Создайте unique_ptr через make_unique и передайте его во владеющий init-capture лямбды.","prereq":["modern-cpp11","stl-lambdas","raii-unique"]},{"id":"modern-cpp17","title":"C++17: значения, варианты и компактные интерфейсы","stage":2,"tier":"junior-plus","difficulty":1,"what":"C++17 добавил удобные средства выражения результатов и локальных переменных в условиях.","know":"Structured bindings, if с инициализатором, optional, string_view; узнавать variant и if constexpr, глубину изучать по соответствующим узлам.","why":"Полезен как практическая база множества существующих проектов и учебных задач.","practice":"Обновите поиск в словаре через if с инициализатором и замените магическое число результата на optional.","prereq":["stl-optional","stl-tuples"]},{"id":"modern-cpp20","title":"C++20: ограничения и диапазоны","stage":4,"tier":"middle-required","difficulty":2,"what":"C++20 расширил средства описания требований к типам и обработки последовательностей.","know":"Concepts, ranges, span, designated initializers в рамках правил C++, feature-test macros; modules и coroutines имеют отдельные траектории.","why":"Позволяет улучшать интерфейсы и обработку данных с учётом зрелости поддержки выбранного инструментария.","practice":"Выберите две возможности C++20, улучшите ими небольшой компонент и зафиксируйте требования к компилятору и библиотеке.","prereq":["templates-concepts","stl-ranges","pointers-span"]},{"id":"modern-cpp23","title":"C++23: выбор полезных возможностей","stage":4,"tier":"specialization","difficulty":2,"what":"C++23 развивает язык и библиотеку; внедрение конкретной возможности зависит от поддержки целевой платформы.","know":"std::expected, std::print, ranges::to, новые views, explicit object parameter; проверка feature-test macros и доступности библиотеки.","why":"Помогает применять актуальные средства по реальной потребности, не превращая знание всей версии в требование к грейду.","practice":"Проверьте поддержку expected и print, внедрите одну подходящую возможность и оставьте понятный путь сборки на целевой платформе.","prereq":["modern-cpp20","errors-expected"]},{"id":"modern-constexpr","title":"constexpr и вычисления при компиляции","stage":3,"tier":"junior-plus","difficulty":1,"what":"constexpr разрешает использовать подходящее вычисление в константном контексте, но не всегда заставляет вычислять его при компиляции.","know":"Константное выражение, constexpr-функция и переменная, static_assert, ограничения выбранного стандарта, различие const и constexpr.","why":"Позволяет проверять таблицы и параметры заранее и устранять лишнюю работу без макросов.","practice":"Напишите constexpr-функцию для размера таблицы и проверьте несколько значений через static_assert.","prereq":["core-functions","pointers-const"]},{"id":"modern-consteval","title":"consteval и немедленные функции","stage":4,"tier":"specialization","difficulty":2,"what":"consteval из C++20 требует, чтобы вызов немедленной функции в соответствующем контексте давал константное выражение.","know":"Отличие от constexpr, диагностика неконстантного входа, использование для проверки конфигурации и построения compile-time данных.","why":"Полезно для библиотек, где некорректные параметры должны быть отвергнуты при сборке.","practice":"Создайте consteval-преобразование строкового литерала в проверяемую конфигурацию и получите ошибку для недопустимого значения.","prereq":["modern-constexpr"]},{"id":"modern-constinit","title":"constinit и статическая инициализация","stage":4,"tier":"middle-required","difficulty":2,"what":"constinit из C++20 требует статической инициализации объекта со статическим или thread-local временем хранения.","know":"Отличие от const и constexpr, возможность последующего изменения, порядок динамической инициализации разных единиц трансляции.","why":"Помогает уменьшить риск ошибок старта программы, связанных с зависимостями между глобальными объектами.","practice":"Пометьте глобальный счётчик constinit и покажите пример инициализатора, который не удовлетворяет требованию.","prereq":["raii-storage","modern-constexpr","core-files"]},{"id":"modern-modules","title":"Модули C++20","stage":5,"tier":"specialization","difficulty":2,"what":"Modules описывают импортируемые интерфейсы языка с иной моделью распространения объявлений, чем текстовое включение заголовков.","know":"export module, import, интерфейс и реализация, отличие от header units, зависимости сборки, совместимость инструментария.","why":"Могут улучшать изоляцию и время сборки, но требуют оценки поддержки и миграционных затрат.","practice":"Создайте минимальный модуль с экспортируемой функцией и сравните сборку с вариантом через заголовок.","prereq":["core-files","modern-cpp20"]},{"id":"modern-coroutines","title":"Корутины C++20","stage":5,"tier":"specialization","difficulty":3,"what":"Корутина может приостановить выполнение и позже продолжить его, сохранив состояние.","know":"co_await, co_yield, co_return, coroutine frame, promise_type, время жизни; корутины сами по себе не создают потоки и не задают планировщик.","why":"Полезны для генераторов и асинхронных библиотек после понимания владения и управления выполнением.","practice":"Используйте готовый безопасный генератор или учебную библиотеку, затем исследуйте жизнь локальных объектов при приостановке.","prereq":["raii-wrappers","templates-classes","modern-cpp20"]}]},{"id":"errors","title":"Ошибки, исключения и контракты","summary":"Различайте ошибку пользователя, отказ внешней системы и дефект программы. Выбирайте механизм сообщения об ошибке вместе с контрактом API и правилами освобождения ресурсов.","stage":2,"track":"language","prereq":["core","types","raii"],"mini":["Какие ошибки являются частью нормального контракта, а какие означают дефект программы?","Почему assert не заменяет проверку пользовательского ввода?","Как RAII сохраняет ресурсы при раскрутке стека?","Что означают базовая и строгая гарантии исключений?","Когда optional недостаточно и нужен результат с причиной ошибки?"],"practice":["Напишите парсер, возвращающий значение либо понятную причину ошибки.","Внедрите искусственный отказ между двумя изменениями состояния и проверьте гарантию операции.","Проверьте, что ресурсы освобождаются при исключении.","Спроектируйте единый договор обработки ошибок для небольшой библиотеки.","Добавьте контекст к ошибке чтения файла, сохранив исходную причину."],"skills":[{"id":"errors-classification","title":"Виды ошибок и выбор реакции","stage":2,"tier":"junior-required","difficulty":1,"what":"Ошибки различаются происхождением и ожидаемостью: неверный ввод, отказ окружения, нарушение контракта, дефект логики.","know":"Ошибки компиляции и выполнения, восстановимые состояния, невозможные состояния, действие вызывающего кода, различие ошибки и пустого результата.","why":"Помогает не скрывать дефекты и не завершать приложение из-за обычной пользовательской ошибки.","practice":"Классифицируйте десять ситуаций калькулятора и файлового приложения и укажите ожидаемую реакцию.","prereq":["core-condition","core-functions"]},{"id":"errors-contracts","title":"Предусловия, постусловия и инварианты","stage":2,"tier":"junior-required","difficulty":1,"what":"Контракт описывает, что требуется от входа, что гарантирует результат и какие состояния остаются допустимыми.","know":"Проверяемые границы, документированные требования, доверенные и внешние данные, инвариант класса, отсутствие предположения о специальных языковых контрактах в C++23.","why":"Помогает распределить ответственность между функцией и вызывающим кодом.","practice":"Опишите контракт функции деления и класса диапазона, затем проверьте все внешние входы.","prereq":["errors-classification","oop-encapsulation"]},{"id":"errors-assert","title":"assert и static_assert","stage":2,"tier":"junior-required","difficulty":1,"what":"assert проверяет предположение при выполнении в конфигурациях, где включён; static_assert проверяет константное условие при компиляции.","know":"NDEBUG, отсутствие побочных эффектов в assert, отличие внутренней проверки от обработки внешнего ввода, сообщения static_assert.","why":"Позволяет быстро обнаруживать дефекты, не строя обязательную логику программы на отключаемых проверках.","practice":"Замените assert(read_input()) на корректный ввод с отдельной проверкой и добавьте static_assert для свойства типа.","prereq":["errors-contracts"]},{"id":"errors-exceptions","title":"Исключения: throw, try и catch","stage":2,"tier":"junior-required","difficulty":1,"what":"Исключение передаёт управление ближайшему подходящему обработчику с разрушением локальных объектов на пути.","know":"throw, try/catch, std::exception, ловля по const-ссылке, порядок catch, повторный throw;, отсутствие пустого catch как обычной стратегии.","why":"Нужно для корректного использования библиотек, даже если проект редко создаёт собственные исключения.","practice":"Перехватите ошибку открытия и разбора файла на границе программы и покажите понятное сообщение.","prereq":["raii-basic","errors-classification"]},{"id":"errors-propagation","title":"Распространение ошибки и границы обработки","stage":3,"tier":"junior-plus","difficulty":1,"what":"Ошибка должна обрабатываться там, где известна полезная реакция, либо передаваться выше с сохранением причины.","know":"Раскрутка стека, локальный контекст, catch(...), повторный выброс, деструкторы при ошибке, границы потоков и внешних API.","why":"Помогает избегать дублирующихся сообщений, скрытых отказов и разрушенного состояния после формального «успеха».","practice":"Проведите ошибку из функции чтения через парсер до интерфейса и добавьте имя файла ровно на подходящей границе.","prereq":["errors-exceptions","oop-destructors"]},{"id":"errors-guarantees","title":"Гарантии безопасности исключений","stage":4,"tier":"middle-required","difficulty":2,"what":"Операция может гарантировать отсутствие исключений, сохранение корректности или полный откат при отказе.","know":"Базовая гарантия, строгая гарантия, no-throw, транзакционное изменение, подготовка до commit, swap и RAII.","why":"Необходимо для контейнеров, владельцев ресурсов и библиотек, которые нельзя оставить в частично изменённом состоянии.","practice":"Реализуйте обновление конфигурации через временный объект и commit; проверьте отказ на каждом шаге подготовки.","prereq":["errors-propagation","raii-noexcept","raii-wrappers"]},{"id":"errors-errorcode","title":"Коды ошибок и std::error_code","stage":3,"tier":"junior-plus","difficulty":1,"what":"Код ошибки представляет отказ как обычное значение; std::error_code связывает код с категорией ошибок.","know":"Проверка результата, message, системная категория, сохранение кода, отличие от логического bool, API с перегрузками без исключений.","why":"Подходит для взаимодействия с системными API и проектами с явным управлением ошибками.","practice":"Вызовите операцию файловой системы с error_code и выведите осмысленную причину без потери исходного кода.","prereq":["errors-classification","types-enum"]},{"id":"errors-expected","title":"Результат или ошибка: std::expected","stage":4,"tier":"specialization","difficulty":2,"what":"std::expected\u003cT,E> из C++23 хранит успешное значение либо ошибку заданного типа.","know":"has_value, value/error, std::unexpected, expected\u003cvoid,E>, отличие от optional, явное распространение; проверка поддержки стандартной библиотеки.","why":"Позволяет выразить ожидаемый отказ прямо в сигнатуре без магических значений и отдельного выходного параметра.","practice":"Напишите parse_port, возвращающий expected\u003cPort, ParseError>, с разными причинами некорректного ввода.","prereq":["stl-optional","errors-errorcode"]},{"id":"errors-diagnostics","title":"Контекст ошибки и полезная диагностика","stage":2,"tier":"junior-plus","difficulty":1,"what":"Сообщение об ошибке должно помогать понять, какая операция и над какими данными не удалась.","know":"Операция, ресурс, причина, сохранение исходной ошибки, отсутствие секретов в сообщении, std::source_location с C++20 при необходимости.","why":"Снижает время поиска причин и делает библиотеку удобной для пользователей и сопровождения.","practice":"Перепишите сообщение «Ошибка 5» в диагностику с операцией и контекстом; не выводите содержимое приватных данных.","prereq":["errors-classification"]},{"id":"errors-policy","title":"Единая политика ошибок в API","stage":4,"tier":"middle-required","difficulty":2,"what":"Политика API определяет, какие отказы возвращаются, какие выбрасываются и кто отвечает за обработку.","know":"Последовательность контрактов, optional против expected, исключения на границах, noexcept, [[nodiscard]], отсутствие исключений через несовместимую внешнюю границу.","why":"Позволяет разным компонентам согласованн
