о работать с отказами и сохранять предсказуемость поведения.","practice":"Спроектируйте обработку ошибок библиотеки чтения конфигурации и докажите, что вызывающий код получает все нужные причины.","prereq":["errors-guarantees","errors-diagnostics","errors-errorcode"]}]},{"id":"structures","title":"Структуры данных","summary":"Как хранить данные, выбирать контейнер по операциям и учитывать память. Реализация сложных деревьев — дополнительный путь, а не обязательный барьер для Junior.","stage":2,"track":"algorithms","prereq":["core","types","stl"],"mini":["Чем отличаются массив и связный список по доступу, памяти и локальности?","Почему поиск в hash table в среднем O(1), а не гарантированно O(1)?","Как выбрать между std::vector, std::map и std::unordered_map?","Какие операции нужны, чтобы представить очередь задач или граф?"],"practice":["Сравни std::vector и std::list на последовательном обходе 100 000 элементов.","Создай словарь частот слов с std::unordered_map и тестами пустого ввода.","Реализуй очередь обработки заявок и проверь порядок извлечения.","Представь маршруты метро списком смежности."],"skills":[{"id":"structures-arrays","title":"Массивы и непрерывная память","stage":1,"tier":"junior-required","difficulty":0,"what":"Элементы одинакового типа расположены подряд и доступны по индексу.","know":"Размер, границы, индексация; различия встроенного массива, std::array и std::vector.","why":"Это основа буферов и наиболее частого контейнера std::vector.","practice":"Найди минимум, максимум и среднее массива; добавь тесты для пустого vector.","prereq":["pointers-arrays"]},{"id":"structures-list","title":"Связный список","stage":2,"tier":"junior-plus","difficulty":1,"what":"Цепочка узлов со ссылками на соседей; память узлов обычно не непрерывна.","know":"Односвязный и двусвязный варианты, стоимость обхода, вставка при известной позиции, накладные расходы.","why":"Позволяет понимать trade-offs, не выбирая list автоматически ради быстрых вставок.","practice":"Нарисуй удаление среднего узла и сравни 10 000 вставок с vector.","prereq":["structures-arrays","pointers-addresses"]},{"id":"structures-stack","title":"Стек LIFO","stage":2,"tier":"junior-required","difficulty":0,"what":"Последним добавлен — первым извлечён; структура данных не тождественна стеку вызовов.","know":"push, pop, top, проверка empty и адаптер std::stack.","why":"Нужен для истории операций и вложенных конструкций.","practice":"Проверь правильность круглых, квадратных и фигурных скобок.","prereq":["structures-arrays"]},{"id":"structures-queue","title":"Очередь FIFO","stage":2,"tier":"junior-required","difficulty":0,"what":"Первым добавлен — первым обработан.","know":"push, pop, front, empty; адаптер std::queue и однопоточная очередь.","why":"Моделирует заявки, события и обход в ширину.","practice":"Смоделируй кассу: добавляй посетителей, обрабатывай по одному, считай ожидание.","prereq":["structures-arrays"]},{"id":"structures-deque","title":"Двусторонняя очередь deque","stage":2,"tier":"junior-plus","difficulty":1,"what":"Контейнер с добавлением и удалением с обоих концов.","know":"std::deque, индексный доступ, сегментированное хранение и отличия от непрерывного vector.","why":"Полезна для окон данных и базовых очередей.","practice":"Реализуй историю последних 100 измерений с добавлением и удалением с разных концов.","prereq":["structures-queue"]},{"id":"structures-hash","title":"Hash table и коллизии","stage":2,"tier":"junior-required","difficulty":1,"what":"Таблица сопоставляет ключу bucket по hash; коллизии означают совпадение bucket, а не ключей.","know":"Hash, равенство ключей, load factor, rehash, средняя и худшая сложность.","why":"Помогает правильно применять std::unordered_map и диагностировать деградацию.","practice":"Посчитай частоты слов и выведи число buckets и load factor до и после reserve.","prereq":["structures-arrays"]},{"id":"structures-trees","title":"Деревья и обходы","stage":2,"tier":"junior-plus","difficulty":1,"what":"Иерархия узлов без циклов с корнем, детьми и листьями.","know":"Высота, глубина, поддерево, обходы pre-order и post-order; владение дочерними узлами.","why":"Нужны для каталогов, синтаксиса и иерархических моделей.","practice":"Собери дерево каталогов в памяти и выведи его с отступами.","prereq":["structures-list"]},{"id":"structures-bst","title":"Двоичное дерево поиска BST","stage":3,"tier":"interview","difficulty":1,"what":"Упорядоченное дерево, в котором поиск выбирает левое или правое поддерево.","know":"Инвариант порядка, вставка, поиск, удаление; вырожденное дерево даёт O(n).","why":"Развивает понимание упорядоченных контейнеров; писать BST вручную требуется не в каждой работе.","practice":"Реализуй BST для int и проверь вставки по возрастанию и в случайном порядке.","prereq":["structures-trees"]},{"id":"structures-balanced","title":"Балансировка деревьев","stage":4,"tier":"interview","difficulty":2,"what":"Балансировка ограничивает высоту дерева и поддерживает эффективный поиск.","know":"Идея AVL и red-black tree, повороты, гарантии O(log n); стандарт не требует конкретного вида дерева у map.","why":"Помогает понимать гарантии std::map и задачи собеседований.","practice":"Покажи одинарный и двойной поворот на рисунках и проверь сохранение порядка.","prereq":["structures-bst"]},{"id":"structures-heap","title":"Двоичная куча heap","stage":3,"tier":"junior-plus","difficulty":1,"what":"Почти полное дерево с экстремальным элементом в корне, часто хранящееся в массиве.","know":"Индексы родителя и детей, просеивание, std::make_heap, push_heap и pop_heap.","why":"Нужна для выбора лучших элементов без полной сортировки.","practice":"Построй max-heap в vector и после каждого извлечения проверь инвариант.","prereq":["structures-arrays","structures-trees"]},{"id":"structures-priority","title":"Очередь с приоритетом","stage":3,"tier":"junior-plus","difficulty":1,"what":"Возвращает элемент с наибольшим приоритетом, а не с самым ранним временем добавления.","know":"std::priority_queue, max/min порядок, comparator; изменение приоритета требует отдельного решения.","why":"Применяется в планировщиках и алгоритмах поиска пути.","practice":"Сделай очередь задач по сроку исполнения и отдельный стабильный номер для одинаковых сроков.","prereq":["structures-heap"]},{"id":"structures-graphs","title":"Графы: вершины и рёбра","stage":3,"tier":"junior-plus","difficulty":1,"what":"Модель связей между объектами; граф может быть ориентированным, взвешенным и циклическим.","know":"Список смежности и матрица, плотность, направленность, веса, петли и компоненты.","why":"Помогает моделировать зависимости сборки, маршруты и связи объектов.","practice":"Создай граф зависимостей пяти модулей и выведи прямые зависимости каждого.","prereq":["structures-arrays","structures-hash"]},{"id":"structures-trie","title":"Префиксное дерево trie","stage":4,"tier":"interview","difficulty":2,"what":"Дерево, в котором пути кодируют префиксы строк.","know":"Стоимость поиска O(длина ключа), представление переходов и затраты памяти.","why":"Полезно для автодополнения, но редко является общим требованием к Junior.","practice":"Реализуй подсказки по префиксу для 1 000 слов и сравни память с hash set.","prereq":["structures-trees","structures-hash"]},{"id":"structures-ring","title":"Кольцевой буфер","stage":4,"tier":"specialization","difficulty":2,"what":"Ограниченный буфер повторно использует массив по кругу.","know":"Head/tail, различение full и empty, переполнение, однопоточные инварианты.","why":"Нужен для потоковых данных; многопоточность добавляется отдельным дизайном.","practice":"Создай кольцевой буфер на 8 элементов с явным отказом записи при заполнении.","prereq":["structures-arrays","structures-queue"]},{"id":"structures-choice","title":"Выбор структуры под задачу","stage":4,"tier":"middle-required","difficulty":1,"what":"Решение опирается на реальные операции, объём данных и гарантии ссылок.","know":"Стоимость чтения и изменений, память, локальность, стабильность адресов, упорядоченность.","why":"Предотвращает усложнение кода контейнером, не подходящим нагрузке.","practice":"Для каталога товаров обоснуй контейнеры поиска по ID, сортировки по цене и очереди обновлений.","prereq":["structures-hash","structures-list","structures-priority","structures-graphs"]}]},{"id":"algorithms","title":"Алгоритмы и оценка сложности","summary":"Практическая основа Junior — оценивать простые операции и применять стандартные алгоритмы. Продвинутые графы, DP и backtracking выделены в траекторию собеседований.","stage":2,"track":"algorithms","prereq":["core","structures","stl"],"mini":["Чем O(n), O(log n) и O(n²) отличаются при росте входа?","Как сформулировать инвариант binary search и не выйти за границы?","Когда можно заменить вложенные циклы hash table или сортировкой?","Почему Dijkstra не подходит для произвольных отрицательных рёбер?"],"practice":["Сравни линейный поиск и binary search на отсортированном vector.","Реши задачу двух сумм двумя способами и оцени память.","Напиши BFS кратчайшего пути в невзвешенном лабиринте.","Для алгоритма добавь тесты пустого, минимального и большого входов."],"skills":[{"id":"algorithms-big-o","title":"Сложность Big O","stage":2,"tier":"junior-required","difficulty":1,"what":"Оценка роста времени или памяти с размером входа, а не точное число миллисекунд.","know":"O(1), O(log n), O(n), O(n log n), O(n²); худший, средний и амортизированный случаи.","why":"Позволяет заметить случайный квадратичный проход до запуска на больших данных.","practice":"Оцени пять фрагментов с циклами, затем измерь рост времени при удвоении n.","prereq":["structures-arrays"]},{"id":"algorithms-linear","title":"Линейный поиск и накопление","stage":1,"tier":"junior-required","difficulty":0,"what":"Однократный проход находит элемент или собирает результат.","know":"std::find, count_if, accumulate; начальное значение и тип суммы.","why":"Покрывает ежедневные задачи обработки контейнеров.","practice":"Найди первый отрицательный элемент, число чётных и сумму значений длинным целым.","prereq":["structures-arrays","core-loops"]},{"id":"algorithms-sorting","title":"Сортировка и comparator","stage":2,"tier":"junior-required","difficulty":1,"what":"Упорядочивание данных по строгому отношению порядка.","know":"std::sort, stable_sort, строгий слабый порядок; компаратор не использует \u003c=.","why":"Нужна для отчётов, дедупликации и ускорения последующего поиска.","practice":"Отсортируй студентов по баллу, затем имени; проверь одинаковые и пустые записи.","prereq":["algorithms-big-o","stl-algorithms","stl-lambdas"]},{"id":"algorithms-binary","title":"Двоичный поиск Binary Search","stage":2,"tier":"junior-required","difficulty":1,"what":"На каждом шаге исключает половину упорядоченного диапазона.","know":"lower_bound, upper_bound, полуинтервалы [l,r), предусловие упорядоченности.","why":"Часто полезен в рабочих задачах и учит точным инвариантам.","practice":"Найди диапазон равных значений с lower_bound/upper_bound; проверь отсутствие ключа.","prereq":["algorithms-sorting"]},{"id":"algorithms-recursion","title":"Рекурсия и базовый случай","stage":2,"tier":"junior-required","difficulty":1,"what":"Функция решает задачу через меньший экземпляр той же задачи.","know":"Условие остановки, прогресс, стек вызовов и опасность глубокой рекурсии.","why":"Нужна для деревьев и разбора вложенных данных.","practice":"Подсчитай число узлов дерева рекурсивно и перепиши обход с явным stack.","prereq":["structures-trees","structures-stack"]},{"id":"algorithms-two-pointers","title":"Два указателя Two Pointers","stage":3,"tier":"interview","difficulty":1,"what":"Две позиции перемещаются по массиву по заранее заданному инварианту.","know":"Встречные и однонаправленные указатели, линейность суммарных перемещений.","why":"Полезная техника оптимизации; не обязательный отдельный навык любого Junior.","practice":"Найди пару с заданной суммой в отсортированном vector за O(n).","prereq":["algorithms-sorting","algorithms-big-o"]},{"id":"algorithms-window","title":"Скользящее окно Sliding Window","stage":3,"tier":"interview","difficulty":1,"what":"Поддерживает агрегат на подотрезке при движении его границ.","know":"Фиксированная и переменная длина, добавление/удаление элемента, ограничения метода.","why":"Упрощает анализ последовательностей и задачи собеседований.","practice":"Найди максимальную сумму k подряд и самую длинную подстроку без повторений.","prereq":["algorithms-two-pointers","structures-hash"]},{"id":"algorithms-prefix","title":"Префиксные суммы Prefix Sum","stage":3,"tier":"junior-plus","difficulty":1,"what":"Предварительные накопленные суммы отвечают на запросы к диапазонам.","know":"Массив длины n+1, sum[l,r)=prefix[r]-prefix[l], переполнение.","why":"Ускоряет повторные агрегатные запросы и обработку измерений.","practice":"Ответь на 10 000 запросов суммы диапазона и сравни с прямым проходом.","prereq":["algorithms-linear"]},{"id":"algorithms-dfs","title":"Обход в глубину DFS","stage":3,"tier":"junior-plus","difficulty":1,"what":"Исследует путь до конца перед возвратом к другим соседям.","know":"Visited, рекурсивный и итеративный варианты, O(V+E), циклы.","why":"Нужен для обхода зависимостей и поиска связных частей.","practice":"Найди компоненты неориентированного графа; проверь изолированные вершины.","prereq":["structures-graphs","algorithms-recursion"]},{"id":"algorithms-bfs","title":"Обход в ширину BFS","stage":3,"tier":"junior-plus","difficulty":1,"what":"Исследует вершины слоями с помощью очереди.","know":"Visited отмечается при постановке в очередь; кратчайший путь по числу рёбер.","why":"Подходит для невзвешенных маршрутов и поиска ближайшего состояния.","practice":"Найди кратчайший путь в лабиринте и восстанови маршрут через массив родителей.","prereq":["structures-graphs","structures-queue"]},{"id":"algorithms-dijkstra","title":"Алгоритм Dijkstra","stage":4,"tier":"interview","difficulty":2,"what":"Находит кратчайшие расстояния при неотрицательных весах рёбер.","know":"Релаксация, priority_queue, устаревшие записи, недостижимые вершины, переполнение.","why":"Полезен в маршрутизации и собеседованиях по графам.","practice":"Рассчитай дешёвые маршруты между городами и проверь нулевые веса и недостижимые узлы.","prereq":["algorithms-bfs","structures-priority"]},{"id":"algorithms-union-find","title":"Непересекающиеся множества Union Find","stage":4,"tier":"interview","difficulty":2,"what":"Отслеживает объединение групп и принадлежность элементов общей компоненте.","know":"find/union, сжатие пути, объединение по размеру; почти постоянная амортизированная стоимость.","why":"Используется в задачах связности и минимального остовного дерева.","practice":"Обрабатывай добавление рёбер и запросы «связаны ли вершины» без повторного DFS.","prereq":["structures-graphs","algorithms-big-o"]},{"id":"algorithms-dp","title":"Динамическое программирование","stage":4,"tier":"interview","difficulty":2,"what":"Повторно использует результаты перекрывающихся подзадач.","know":"Состояние, переход, базовые значения, порядок вычисления, memoization, оценка памяти.","why":"Нужно для определённых оптимизационных задач; объём требований зависит от роли.","practice":"Реши минимальное число монет и рюкзак; запиши смысл каждого элемента таблицы.","prereq":["algorithms-recursion","algorithms-big-o"]},{"id":"algorithms-greedy","title":"Жадные алгоритмы Greedy","stage":3,"tier":"interview","difficulty":1,"what":"Выбирают локально лучший шаг, когда можно доказать глобальную корректность.","know":"Доказательство обменом, сортировка, контрпримеры; локальная выгода не всегда оптимальна.","why":"Учит отличать верную оптимизацию от правдоподобной эвристики.","practice":"Выбери максимум непересекающихся интервалов и найди контрпример жадному размену монет.","prereq":["algorithms-sorting"]},{"id":"algorithms-backtracking","title":"Перебор с возвратом Backtracking","stage":4,"tier":"interview","difficulty":2,"what":"Строит решение по частям, откатывая выбор при нарушении ограничений.","know":"Пространство состояний, отсечения, восстановление состояния, экспоненциальная сложность.","why":"Подходит для небольших комбинаторных задач и интервью.","practice":"Сгенерируй корректные скобочные последовательности и реши задачу N queens для n≤10.","prereq":["algorithms-recursion"]},{"id":"algorithms-topological","title":"Топологическая сортировка","stage":4,"tier":"junior-plus","difficulty":2,"what":"Упорядочивает вершины направленного ациклического графа по зависимостям.","know":"Алгоритм Kahn, входящие степени, обнаружение цикла, неоднозначность результата.","why":"Практична для зависимостей сборки, задач и миграций.","practice":"Выдай порядок сборки модулей и понятную ошибку, если зависимости образуют цикл.","prereq":["algorithms-bfs","structures-graphs"]},{"id":"algorithms-invariants","title":"Инварианты и доказательство корректности","stage":4,"tier":"middle-required","difficulty":1,"what":"Утверждение остаётся истинным до и после каждого шага алгоритма.","know":"Предусловия, постусловия, начальное состояние, сохранение и завершение.","why":"Позволяет проверять алгоритмы системно и объяснять решение на review.","practice":"Для binary search письменно укажи инвариант и обоснуй оба изменения границ.","prereq":["algorithms-binary","algorithms-recursion"]},{"id":"algorithms-tradeoffs","title":"Выбор алгоритма под ограничения","stage":4,"tier":"middle-required","difficulty":2,"what":"Выбор учитывает размер входа, потоковую обработку, память и точность.","know":"Худший случай, предварительная обработка, онлайн/офлайн подход, измерения.","why":"Связывает теорию с решением реальной инженерной задачи.","practice":"Выбери способ получить top-100 из миллиона записей: sort, partial_sort или heap; измерь.","prereq":["algorithms-big-o","algorithms-sorting","structures-priority"]}]},{"id":"os","title":"Операционные системы и Linux","summary":"Среда, в которой живёт C++ программа: файлы, процессы, потоки, память и системные вызовы. Глубина платформенных API зависит от выбранной специализации.","stage":2,"track":"systems","prereq":["core","pointers","build"],"mini":["Чем процесс отличается от потока и какие ресурсы они разделяют?","Что означает файловый дескриптор и кто обязан его закрыть?","Почему виртуальный адрес не является физическим адресом RAM?","Как найти PID процесса, код завершения и открытые соединения в Linux?"],"practice":["Собери и запусти приложение в Linux, передай аргументы и переменные окружения.","Создай программу, которая копирует файл, проверяя ошибки чтения и записи.","Посмотри процесс через ps/top и изучи его память в /proc.","Запусти дочерний процесс и корректно дождись завершения."],"skills":[{"id":"os-linux","title":"Навигация и команды Linux","stage":2,"tier":"junior-plus","difficulty":0,"what":"Работа в терминале с каталогами, файлами и командами разработки.","know":"pwd, cd, ls, cp, mv, mkdir, paths, quoting и безопасное обращение с именами файлов.","why":"Позволяет работать с Linux средой разработки и CI.","practice":"Создай каталог проекта, скопируй входные данные и запусти программу с путём, содержащим пробел.","prereq":["git-linux"]},{"id":"os-streams","title":"Стандартные потоки и окружение","stage":2,"tier":"junior-required","difficulty":0,"what":"Процесс получает аргументы и окружение, читает stdin и пишет stdout/stderr.","know":"argc/argv, код завершения, перенаправление, pipe, различие сообщений и данных.","why":"Нужны для удобных консольных утилит и автоматизации.","practice":"Напиши фильтр строк: данные через stdin, ошибки через stderr, неверные аргументы дают ненулевой код.","prereq":["core-io"]},{"id":"os-permissions","title":"Права доступа и пути","stage":3,"tier":"junior-plus","difficulty":1,"what":"ОС ограничивает операции пользователя над файлами и каталогами.","know":"rwx, пользователь/группа, абсолютные и относительные пути, symbolic links.","why":"Объясняет ошибки запуска и чтения вне локальной машины.","practice":"В тестовом каталоге сравни поведение чтения файла без прав и перехода по symbolic link.","prereq":["os-linux"]},{"id":"os-process","title":"Процессы и жизненный цикл","stage":3,"tier":"junior-plus","difficulty":1,"what":"Процесс — отдельный выполняемый экземпляр программы со своим адресным пространством.","know":"PID, parent, exit status, запуск, ожидание; fork/exec/wait на POSIX на уровне концепций.","why":"Нужен для инструментов, сервисов и управления дочерними программами.","practice":"Запусти дочернюю утилиту, сохрани её вывод и код завершения.","prereq":["os-streams"]},{"id":"os-thread","title":"Потоки и планирование","stage":3,"tier":"junior-plus","difficulty":1,"what":"Потоки разделяют память процесса, но имеют свои стеки и контекст исполнения.","know":"Планировщик, переключение контекста, блокировка, parallelism и concurrency.","why":"Основа понимания многопоточных программ и их стоимости.","practice":"Нарисуй, какие переменные двух потоков общие, а какие принадлежат отдельным стекам.","prereq":["os-process"]},{"id":"os-vm","title":"Виртуальная память","stage":4,"tier":"middle-required","difficulty":2,"what":"ОС отображает виртуальные страницы процесса на физическую память и другие источники.","know":"Страницы, page fault, доступы, stack/heap mappings, RSS и виртуальный размер.","why":"Помогает анализировать потребление памяти и падения по адресам.","practice":"Выдели большой буфер, коснись его страниц и сравни виртуальную память и RSS до/после.","prereq":["os-process"]},{"id":"os-syscalls","title":"Системные вызовы и ошибки","stage":4,"tier":"middle-required","difficulty":1,"what":"Граница обращения программы к службам ядра ОС.","know":"Пользовательский/привилегированный режим, возвращаемые коды, errno, частичные операции.","why":"Позволяет корректно обрабатывать реальные отказы низкоуровневых API.","practice":"Проследи файловые операции через strace и сопоставь их с кодом программы.","prereq":["os-process","os-linux"]},{"id":"os-descriptors","title":"Файловые дескрипторы и RAII","stage":4,"tier":"middle-required","difficulty":1,"what":"Небольшое число представляет открытый ресурс ядра в процессе POSIX.","know":"open/read/write/close, владение, утечки, проверка ошибок; различия Windows handles.","why":"Нужно для безопасной работы с файлами, pipes и sockets.","practice":"Напиши move-only wrapper файлового дескриптора и проверь отсутствие утечек при раннем выходе.","prereq":["os-syscalls","raii-basic"]},{"id":"os-signals","title":"Сигналы и завершение","stage":4,"tier":"specialization","difficulty":2,"what":"Асинхронное уведомление процесса об ОС-событиях или запросе остановки.","know":"SIGINT/SIGTERM, async-signal-safe операции, self-pipe/signalfd как платформенные подходы.","why":"Позволяет останавливать сервисы без повреждения состояния.","practice":"Обработай SIGTERM через безопасный механизм уведомления основного цикла и допиши очередь на диск.","prereq":["os-process","os-syscalls"]},{"id":"os-mmap","title":"Отображение файлов в память mmap","stage":5,"tier":"specialization","difficulty":2,"what":"Содержимое файла отображается в виртуальное адресное пространство.","know":"mmap/munmap, mapping lifetime, page faults, shared/private, ошибки и синхронизация.","why":"Полезно для больших файлов и специализированных систем хранения.","practice":"Посчитай строки в файле через mmap и обычный поток, сравни время и память.","prereq":["os-vm","os-descriptors"]},{"id":"os-ipc","title":"Межпроцессное взаимодействие IPC","stage":5,"tier":"specialization","difficulty":2,"what":"Процессы обмениваются данными через механизмы ОС.","know":"Pipes, Unix domain sockets, shared memory, границы сообщений и владение ресурсами.","why":"Нужно для разделения компонентов по процессам и интеграции инструментов.","practice":"Соедини два процесса pipe, передай сообщения с длиной и обработай закрытие писателя.","prereq":["os-descriptors","os-process"]},{"id":"os-observability","title":"Диагностика процесса в Linux","stage":4,"tier":"middle-required","difficulty":1,"what":"Наблюдение за состоянием процесса и использованием ресурсов.","know":"ps, top/htop, /proc, lsof, ss, strace; CPU time против wall time.","why":"Сокращает поиск причины зависания, утечки файлов и высокой нагрузки.","practice":"Для намеренно зависшего процесса установи, ждёт ли он ввод, блокировку или активно расходует CPU.","prereq":["os-linux","os-process","os-syscalls"]}]},{"id":"concurrency","title":"Многопоточность и конкурентность","summary":"Управление параллельной работой, общими данными и завершением. Для общего Middle важны безопасные базовые решения; lock-free и сложная модель памяти — специализация.","stage":4,"track":"systems","prereq":["os","raii","modern","errors"],"mini":["Почему отсутствие падений не доказывает отсутствие data race?","Какие данные защищает mutex и как виден этот контракт в коде?","Почему condition_variable всегда проверяет предикат в цикле ожидания?","Как завершить все потоки, если одна задача завершилась исключением?","Чем deadlock отличается от медленного выполнения?"],"practice":["Найди гонку в счётчике и исправь её с mutex, затем atomic.","Создай ограниченную блокирующую очередь с закрытием и пробуждением ожидающих потоков.","Запусти несколько задач, собери результаты и обработай исключение одной из них.","Проверь свою очередь под ThreadSanitizer на поддерживаемой платформе."],"skills":[{"id":"concurrency-concepts","title":"Конкурентность и параллелизм","stage":3,"tier":"junior-plus","difficulty":1,"what":"Конкурентные задачи продвигаются независимо; параллельные исполняются одновременно.","know":"CPU-bound и I/O-bound работа, общее состояние, цена потоков, координация.","why":"Помогает понять, когда многопоточность вообще оправданна.","practice":"Раздели задачи архиватора на последовательные, CPU-bound и ожидающие I/O.","prereq":["os-thread"]},{"id":"concurrency-threads","title":"std::thread и жизненный цикл","stage":4,"tier":"middle-required","difficulty":1,"what":"Управление отдельным потоком стандартной библиотеки.","know":"Запуск, передача аргументов, joinable, join; риски detach и std::terminate у незавершённого владельца.","why":"Предотвращает выход из области видимости при работающем потоке и висячие ссылки.","practice":"Запусти два вычисления и гарантируй join на всех путях завершения.","prereq":["concurrency-concepts","raii-basic","stl-lambdas"]},{"id":"concurrency-races","title":"Гонки данных и общий доступ","stage":4,"tier":"middle-required","difficulty":2,"what":"Конфликтующие несинхронизированные обращения к общей памяти могут давать undefined behavior.","know":"Data race против логической race condition, чтение/запись, happens-before на базовом уровне.","why":"Это центральный риск многопоточного C++.","practice":"Объясни ошибку в параллельном push_back в общий vector и предложи два способа исправления.","prereq":["concurrency-threads"]},{"id":"concurrency-mutex","title":"std::mutex и защита инвариантов","stage":4,"tier":"middle-required","difficulty":1,"what":"Взаимное исключение сохраняет согласованность связанных общих данных.","know":"lock/unlock, critical section, владение mutex, запрет долгих внешних вызовов под блокировкой.","why":"Защищает модель данных, а не только отдельные строки кода.","practice":"Защити баланс и историю банковского счёта одной согласованной блокировкой.","prereq":["concurrency-races"]},{"id":"concurrency-locks","title":"lock_guard, unique_lock, scoped_lock","stage":4,"tier":"middle-required","difficulty":1,"what":"RAII-объекты управляют временем удержания блокировки.","know":"lock_guard для простого блока, unique_lock для управления ожиданием, scoped_lock для нескольких mutex.","why":"Убирают ручной unlock и ошибки при исключениях.","practice":"Переведи ручные lock/unlock на RAII и безопасно заблокируй пару счетов.","prereq":["concurrency-mutex","raii-basic"]},{"id":"concurrency-cv","title":"std::condition_variable","stage":4,"tier":"middle-required","difficulty":2,"what":"Ожидание изменения состояния без активного опроса.","know":"Предикат под mutex, unique_lock, spurious wakeup, notify_one/all, завершение ожидания.","why":"Нужна для очередей producer-consumer и координации работы.","practice":"Реализуй очередь с pop, который ждёт данные или сигнал закрытия.","prereq":["concurrency-locks","structures-queue"]},{"id":"concurrency-future","title":"std::future и std::promise","stage":4,"tier":"middle-required","difficulty":1,"what":"Передача результата или исключения от отложенного вычисления.","know":"get один раз, ожидание, promise::set_value/set_exception, broken promise, shared_future.","why":"Связывает асинхронную операцию и обработку её результата.","practice":"Выполни чтение файла в потоке, передай длину через promise и ошибку через exception_ptr.","prereq":["concurrency-threads","errors-exceptions"]},{"id":"concurrency-async","title":"std::async и политика запуска","stage":4,"tier":"middle-required","difficulty":1,"what":"Упрощённый запуск вычисления с результатом future.","know":"launch::async, launch::deferred, политика по умолчанию; возможное ожидание в деструкторе future.","why":"Помогает избежать ошибочного ожидания «async всегда создаёт отдельный поток».","practice":"Сравни явно заданные async и deferred, записывая ID потока и момент выполнения.","prereq":["concurrency-future"]},{"id":"concurrency-jthread","title":"std::jthread и кооперативная отмена","stage":4,"tier":"middle-required","difficulty":2,"what":"C++20 связывает владение потоком с автоматическим join и stop_token.","know":"request_stop, stop_requested, кооперативность остановки; отмена не прерывает произвольный блокирующий вызов.","why":"Упрощает безопасное завершение фоновых задач.","practice":"Создай jthread периодического вычисления, который останавливается по stop_token и освобождает ресурсы.","prereq":["concurrency-threads","concurrency-cv"]},{"id":"concurrency-deadlock","title":"Deadlock, livelock и starvation","stage":4,"tier":"middle-required","difficulty":2,"what":"Разные причины отсутствия полезного продвижения конкурентных задач.","know":"Порядок блокировок, циклическое ожидание, повторные попытки, справедливость и время удержания.","why":"Нужны для разбора зависаний и ревью многопоточного кода.","practice":"Воспроизведи deadlock двух mutex, зафиксируй стеки, исправь единым порядком захвата.","prereq":["concurrency-locks"]},{"id":"concurrency-atomic","title":"std::atomic: базовые операции","stage":4,"tier":"middle-required","difficulty":2,"what":"Атомарный объект обеспечивает неделимые операции и определённые правила синхронизации.","know":"load/store/fetch_add, compare_exchange на уровне применения; atomic не делает весь алгоритм безопасным.","why":"Подходит для простых счётчиков и флагов с явным протоколом.","practice":"Замени mutex счётчика на atomic с порядком по умолчанию и объясни границы такой замены.","prereq":["concurrency-races"]},{"id":"concurrency-memory-model","title":"Модель памяти и memory_order","stage":5,"tier":"specialization","difficulty":3,"what":"Правила определяют видимость операций и допустимые наблюдения между потоками.","know":"Sequenced-before, synchronizes-with, happens-before, relaxed, acquire/release и seq_cst.","why":"Нужна для разработки собственных протоколов синхронизации и глубокого review.","practice":"Разбери публикацию неизменяемого объекта через release/acquire и докажи видимость его полей.","prereq":["concurrency-atomic","concurrency-mutex"]},{"id":"concurrency-pool","title":"Пул потоков и очередь задач","stage":5,"tier":"specialization","difficulty":2,"what":"Ограниченный набор рабочих потоков обслуживает множество задач.","know":"Размер пула, bounded queue, backpressure, исключения, shutdown и отмена ожидающих задач.","why":"Нужен для сервисов и параллельных библиотек; готовая реализация часто предпочтительнее самописной.","practice":"Собери учебный пул из четырёх потоков с очередью на 64 задачи и двумя режимами остановки.","prereq":["concurrency-cv","concurrency-future","concurrency-jthread"]},{"id":"concurrency-lockfree","title":"Lock-free, ABA и освобождение памяти","stage":6,"tier":"specialization","difficulty":3,"what":"Специализированные алгоритмы дают гарантии прогресса без обычных mutex.","know":"Lock-free против wait-free, CAS loops, ABA, reclamation, hazard pointers на уровне концепций.","why":"Применяется при доказанной необходимости, а не как универсальный признак Senior.","practice":"Проанализируй готовую lock-free очередь: опиши гарантии прогресса и схему reclamation; не подменяй её наивным CAS.","prereq":["concurrency-memory-model","structures-queue"]},{"id":"concurrency-design","title":"Проектирование конкурентного компонента","stage":6,"tier":"senior-required","difficulty":2,"what":"Выбор модели владения и координации с проверяемым завершением и нагрузкой.","know":"Минимизация общего состояния, message passing, контракты потокобезопасности, backpressure, воспроизводимые тесты.","why":"Senior должен объяснять риски и выбирать наиболее простую достаточную модель.","practice":"Напиши design note загрузчика: границы потоков, владельцы данных, отмена, ошибки, лимиты очередей и сценарии отказа.","prereq":["concurrency-jthread","concurrency-deadlock","concurrency-cv","architecture-concurrency"]}]},{"id":"networking","title":"Сети, sockets и протоколы","summary":"Практический путь к клиентам и сервисам: передача байтов, формат сообщений, таймауты и отказы. Backend и системное программирование изучают эту ветку глубже.","stage":3,"track":"systems","prereq":["os","raii","errors"],"mini":["Почему один send не соответствует одному recv в TCP?","Что происходит при частичном чтении, таймауте и закрытии соединения?","Где проходит граница между транспортом, framing и прикладным протоколом?","Почему повтор запроса может выполнить операцию дважды?"],"practice":["Создай echo-клиент и сервер с обработкой частичного чтения.","Добавь протокол с длиной сообщения и пределом размера.","Проверь разрыв соединения в середине сообщения и медленного клиента.","Добавь таймаут и безопасное завершение сервера."],"skills":[{"id":"networking-basics","title":"IP, порты, DNS и транспорт","stage":3,"tier":"junior-plus","difficulty":1,"what":"Базовые понятия адресации и обмена данными между узлами.","know":"IPv4/IPv6, endpoint, порт, DNS lookup, TCP и UDP; localhost и внешние интерфейсы.","why":"Помогают читать ошибки подключения и конфигурацию сетевых программ.","practice":"Разреши имя хоста, выведи адреса и объясни, чем DNS-ошибка отличается от connection refused.","prereq":["os-process"]},{"id":"networking-sockets","title":"Sockets и жизненный цикл соединения","stage":4,"tier":"specialization","difficulty":1,"what":"Socket представляет сетевую конечную точку через API ОС или библиотеку.","know":"socket, bind, listen, accept, connect, shutdown, close; RAII и ошибки.","why":"Это фундамент сетевого программирования на C++.","practice":"Напиши TCP echo-сервер на localhost и клиент с RAII-владением socket.","prereq":["networking-basics","os-descriptors"]},{"id":"networking-tcp","title":"TCP — поток байтов","stage":4,"tier":"specialization","difficulty":2,"what":"TCP передаёт упорядоченный поток без сохранения границ прикладных сообщений.","know":"Частичные read/write, EOF, накопительный буфер, повторные отправки внутри транспорта.","why":"Предотвращает протоколы, работающие лишь при маленьких локальных тестах.","practice":"Передай сообщение частями по 1–3 байта и добейся правильной сборки на принимающей стороне.","prereq":["networking-sockets"]},{"id":"networking-framing","title":"Границы сообщений и framing","stage":4,"tier":"specialization","difficulty":2,"what":"Прикладной протокол задаёт, где начинается и заканчивается сообщение.","know":"Length prefix, delimiter, byte order, максимальный размер, неполный заголовок.","why":"Без framing невозможно надёжно разделить сообщения в потоке TCP.","practice":"Реализуй 4-байтовую длину в network byte order и отклоняй сообщения больше 1 MiB.","prereq":["networking-tcp"]},{"id":"networking-udp","title":"UDP и датаграммы","stage":4,"tier":"specialization","difficulty":2,"what":"Транспорт передаёт отдельные датаграммы без гарантии доставки и порядка.","know":"Потери, дубликаты, перестановки, размер датаграммы, MTU и fragmentation на уровне рисков.","why":"Используется в телеметрии, играх и протоколах с собственными гарантиями.","practice":"Добавь номера к UDP-пакетам и подсчитай пропуски, повторы и перестановки.","prereq":["networking-basics"]},{"id":"networking-timeouts","title":"Таймауты, deadlines и отмена","stage":4,"tier":"specialization","difficulty":2,"what":"Ограничение времени операции предотвращает бесконечное удержание ресурсов.","know":"Connect/read/write timeout, общий deadline, monotonic clock, отмена и освобождение socket.","why":"Нужно для отказоустойчивых клиентов и серверов.","practice":"Обеспечь общий deadline запроса 2 секунды, включая подключение и чтение ответа.","prereq":["networking-tcp","concurrency-jthread"]},{"id":"networking-http","title":"HTTP и клиентские запросы","stage":3,"tier":"junior-plus","difficulty":1,"what":"Прикладной протокол с методами, статусами, заголовками и телом.","know":"GET/POST, коды 2xx/4xx/5xx, content type, redirects; использование готовой библиотеки.","why":"Позволяет интегрироваться с API без написания собственного HTTP parser.","practice":"Получай JSON через HTTP-библиотеку, проверяй статус, размер и тип ответа.","prereq":["networking-basics"]},{"id":"networking-tls","title":"TLS и проверка сертификатов","stage":4,"tier":"specialization","difficulty":2,"what":"TLS защищает транспорт и позволяет проверить подлинность сервера.","know":"Проверка цепочки и имени хоста, доверенное хранилище, срок сертификата; готовая библиотека.","why":"Защищает от подмены сервера и перехвата данных.","practice":"Подключись к тестовому HTTPS endpoint и убедись, что неверное имя сертификата вызывает отказ.","prereq":["networking-http"]},{"id":"networking-nonblocking","title":"Неблокирующий I/O и event loop","stage":5,"tier":"specialization","difficulty":2,"what":"Один цикл координирует множество операций без отдельного потока на каждое ожидание.","know":"Readiness/completion, epoll/kqueue/IOCP на уровне различий, callbacks, lifetime буферов.","why":"Нужно для серверов с большим числом соединений.","practice":"На готовой I/O-библиотеке обслужи 100 клиентов и измерь число потоков и память.","prereq":["networking-tcp","concurrency-concepts"]},{"id":"networking-async-lifetime","title":"Время жизни асинхронных операций","stage":5,"tier":"specialization","difficulty":2,"what":"Объекты и буферы должны жить до завершения или подтверждённой отмены операции.","know":"Ownership callback/coroutine, захват this, последовательность shutdown, обработка позднего callback.","why":"Предотвращает use-after-free в сетевом коде.","practice":"Отмени запрос при закрытии клиента и проверь, что callback не обращается к уничтоженному владельцу.","prereq":["networking-nonblocking","networking-timeouts","raii-shared","pointers-lifetime"]},{"id":"networking-backpressure","title":"Нагрузка и backpressure","stage":5,"tier":"specialization","difficulty":2,"what":"Производитель ограничивает поток данных, если потребитель не успевает.","know":"Bounded buffers, лимиты клиентов, очереди записи, admission control, перегрузка.","why":"Предотвращает исчерпание памяти и деградацию сервиса при медленных клиентах.","practice":"Ограничь очередь ответа 4 MiB на клиента и задай наблюдаемую политику отказа.","prereq":["networking-nonblocking","concurrency-cv"]},{"id":"networking-retries","title":"Повторы, идемпотентность и частичный отказ","stage":5,"tier":"specialization","difficulty":2,"what":"Ошибка связи не доказывает, что сервер не выполнил запрос.","know":"Retry budget, exponential backoff с jitter, idempotency key, неизвестный результат операции.","why":"Предотвращает дублирование действий и лавину повторных запросов.","practice":"Сымитируй потерю ответа после записи и обеспечь единственное выполнение по idempotency key.","prereq":["networking-timeouts","networking-http"]}]},{"id":"databases","title":"Базы данных и SQL для C++","summary":"Хранение данных с запросами, транзакциями и обработкой ошибок. Для Junior это полезная проектная ветка; глубокая работа зависит от роли и используемой СУБД.","stage":3,"track":"systems","prereq":["core","raii","errors"],"mini":["Почему значения пользователя нужно передавать параметрами SQL?","Что происходит при сбое между двумя изменениями внутри транзакции?","Почему индекс ускоряет одни запросы, но увеличивает стоимость записи?","Кто владеет соединением и можно ли использовать его одновременно из разных потоков?"],"practice":["Создай SQLite хранилище задач с CRUD и параметризованными запросами.","Сделай перевод средств в одной транзакции с проверкой rollback.","Добавь индекс для поиска задач по статусу и сравни план запроса.","Проверь миграцию схемы на копии базы с существующими данными."],"skills":[{"id":"databases-model","title":"Таблицы, ключи и ограничения","stage":3,"tier":"junior-plus","difficulty":1,"what":"Реляционная модель хранит строки с явными связями и инвариантами.","know":"Типы столбцов, PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL; нормализация на базовом уровне.","why":"Позволяет предотвращать некорректные данные средствами базы.","practice":"Спроектируй users и tasks с внешним ключом и запретом пустого названия.","prereq":[]},{"id":"databases-sql","title":"SQL: SELECT, INSERT, UPDATE, DELETE","stage":3,"tier":"junior-plus","difficulty":1,"what":"Декларативный язык запросов и изменения данных.","know":"WHERE, ORDER BY, LIMIT, NULL, агрегаты, GROUP BY; порядок результатов без ORDER BY не гарантирован.","why":"Нужен для большинства приложений с локальной или серверной базой.","practice":"Выведи 10 последних незавершённых задач и число задач для каждого пользователя.","prereq":["databases-model"]},{"id":"databases-joins","title":"JOIN и запросы по связям","stage":3,"tier":"junior-plus","difficulty":1,"what":"JOIN сочетает строки связанных таблиц по условию.","know":"INNER/LEFT JOIN, дублирование строк, NULL в отсутствующей правой части, агрегирование.","why":"Помогает получать данные без цепочки запросов по одному объекту.","practice":"Выведи всех пользователей с количеством задач, включая пользователей без задач.","prereq":["databases-sql"]},{"id":"databases-prepared","title":"Параметры и prepared statements","stage":3,"tier":"junior-plus","difficulty":1,"what":"SQL-структура отделяется от передаваемых значений.","know":"Bind параметров, типы, повторное выполнение, очистка statement; имена таблиц не подставляются обычными параметрами.","why":"Предотвращает SQL injection и ошибки экранирования.","practice":"Сохрани имя O'Reilly и строку с SQL-символами через bind, затем проверь точное чтение.","prereq":["databases-sql"]},{"id":"databases-transactions","title":"Транзакции и ACID","stage":4,"tier":"specialization","difficulty":2,"what":"Группа изменений либо фиксируется целиком, либо откатывается.","know":"BEGIN/COMMIT/ROLLBACK, атомарность, согласованность, изоляция, долговечность; RAII rollback.","why":"Нужны для сохранения инвариантов при сбоях и исключениях.","practice":"Переведи сумму между счетами и вызови искусственную ошибку перед второй записью.","prereq":["databases-prepared"]},{"id":"databases-indexes","title":"Индексы и план запроса","stage":4,"tier":"specialization","difficulty":2,"what":"Дополнительные структуры ускоряют некоторые способы поиска ценой памяти и записи.","know":"Составные индексы, селективность, EXPLAIN, full scan, влияние фильтра и сортировки.","why":"Помогают решать проблемы скорости на уровне базы, а не случайных C++ оптимизаций.","practice":"На 100 000 задач сравни запрос по user_id/status до и после подходящего индекса.","prereq":["databases-joins","algorithms-big-o"]},{"id":"databases-cpp","title":"C++ API базы и владение ресурсами","stage":3,"tier":"junior-plus","difficulty":1,"what":"C++ получает соединения, statements и результаты через библиотеку СУБД.","know":"RAII, коды ошибок/исключения, lifetime строк результата, освобождение ресурсов и документация thread safety.","why":"Позволяет безопасно интегрировать SQLite или серверный driver.","practice":"Сделай RAII wrapper SQLite connection и statement, проверь невалидный запрос без утечки.","prereq":["databases-prepared","raii-basic"]},{"id":"databases-isolation","title":"Изоляция и конкурентные изменения","stage":5,"tier":"specialization","difficulty":2,"what":"Параллельные транзакции могут видеть данные по различным правилам.","know":"Lost update, non-repeatable read, snapshot, блокировки, deadlock retry; гарантии конкретной СУБД.","why":"Нужно для корректности многопользовательских приложений.","practice":"Запусти два конкурентных обновления счётчика и устрани потерю изменений средствами базы.","prereq":["databases-transactions","concurrency-races"]},{"id":"databases-migrations","title":"Миграции, pooling и эксплуатация","stage":5,"tier":"specialization","difficulty":2,"what":"Схема и соединения требуют управляемого жизненного цикла в работающем приложении.","know":"Версии миграций, обратная совместимость, backup/restore, ограниченный connection pool, timeouts.","why":"Нужно для обновлений приложения без потери данных и исчерпания соединений.","practice":"Добавь поле со значением по умолчанию, проверь старую базу и восстановление из backup.","prereq":["databases-transactions","databases-cpp","databases-indexes"]}]},{"id":"performance","title":"Производительность, CPU и cache","summary":"Оптимизация начинается с требования и измерения. Senior выбирает компромиссы и проверяет результат; SIMD, NUMA и тонкая настройка CPU нужны отдельным специализациям.","stage":4,"track":"systems","prereq":["algorithms","stl","raii","debugging","testing"],"mini":["Чем latency отличается от throughput и зачем смотреть percentiles?","Почему быстрый микробенчмарк может не улучшить приложение?","Как отличить время ожидания I/O от активной работы CPU?","Почему последовательный обход vector часто быстрее list?","Как доказать, что оптимизация сохранила корректность?"],"practice":["Запиши базовую скорость обработки реального набора данных в Release.","Найди горячую функцию sampling profiler и сформулируй проверяемую гипотезу.","Уменьши одну лишнюю аллокацию или копирование и сравни несколько прогонов.","Проверь правильность результата и ограничения памяти после оптимизации."],"skills":[{"id":"performance-metrics","title":"Метрики и бюджет производительности","stage":4,"tier":"middle-required","difficulty":1,"what":"Конкретное требование задаёт, что и насколько нужно ускорить.","know":"Latency, throughput, p50/p95/p99, память, CPU, размер входа и бюджет ресурсов.","why":"Не позволяет подменять задачу случайным уменьшением времени одной функции.","practice":"Для парсера задай лимит времени на 1 GiB данных и предел дополнительной памяти.","prereq":[]},{"id":"performance-benchmark","title":"Достоверные измерения и benchmark","stage":4,"tier":"middle-required","difficulty":2,"what":"Эксперимент сравнивает реализации в сопоставимых условиях.","know":"Release, прогрев, несколько повторов, шум, типичные данные, защита от удаления вычисления оптимизатором.","why":"Не даёт принять шум или ошибку измерения за ускорение.","practice":"Измерь три способа подсчёта частот, сохрани вход, версию сборки и распределение результатов.","prereq":["performance-metrics","algorithms-big-o"]},{"id":"performance-profiler","title":"Profiling: где уходит время","stage":4,"tier":"middle-required","difficulty":2,"what":"Profiler связывает расход CPU или ожидания с участками программы.","know":"Sampling, call tree, self/total time, symbols, perf/Visual Studio Profiler; overhead.","why":"Помогает найти действительное узкое место до изменения кода.","practice":"Собери профиль загрузки CSV и определи долю разбора, аллокаций и файлового I/O.","prereq":["performance-benchmark","os-observability"]},{"id":"performance-cpu","title":"CPU: выполнение и предсказание переходов","stage":4,"tier":"middle-required","difficulty":2,"what":"Процессор выполняет инструкции с конвейером, зависимостями и предположениями.","know":"Instruction throughput/latency на уровне идеи, branch prediction, out-of-order; детали зависят от CPU.","why":"Объясняет, почему число строк кода не определяет скорость.","practice":"Сравни фильтрацию упорядоченных и перемешанных данных, сохрани одинаковое число совпадений.","prereq":["performance-benchmark"]},{"id":"performance-cache","title":"Cache и локальность памяти","stage":4,"tier":"middle-required","difficulty":2,"what":"Небольшая быстрая память CPU сохраняет недавно используемые линии данных.","know":"L1/L2/L3, cache line, временная и пространственная локальность, cache miss.","why":"Позволяет оценивать стоимость обходов и указателей.","practice":"Сравни последовательный и случайный обход большого массива индексов.","prereq":["os-vm","performance-cpu"]},{"id":"performance-layout","title":"Размещение данных: AoS и SoA","stage":5,"tier":"specialization","difficulty":2,"what":"Структура памяти выбирается под операции, которые обращаются к данным.","know":"Array of Structures, Structure of Arrays, hot/cold поля, размер рабочего набора.","why":"Полезно для численных, игровых и потоковых систем с большим количеством объектов.","practice":"Для миллиона частиц сравни обновление координат в AoS и SoA, измерь память и время.","prereq":["performance-cache","structures-arrays"]},{"id":"performance-allocations","title":"Аллокации, копии и повторное использование","stage":4,"tier":"middle-required","difficulty":2,"what":"Частые выделения и лишние копии могут доминировать в работе программы.","know":"reserve, повторное использование буфера, ownership, move; размер и число аллокаций.","why":"Часто даёт простое ускорение без сложных алгоритмов.","practice":"Посчитай аллокации при формировании 100 000 строк и сократи их предварительным резервированием.","prereq":["performance-profiler","structures-arrays","raii-move","stl-vector"]},{"id":"performance-complexity","title":"Алгоритм раньше микрооптимизаций","stage":4,"tier":"middle-required","difficulty":1,"what":"Улучшение зависимости времени от n обычно важнее локального уменьшения констант.","know":"Избыточные проходы, O(n²), предварительный индекс, стоимость памяти и подготовки.","why":"Позволяет устранить масштабную причину медленной работы.","practice":"Замени поиск каждого ID линейным проходом на индекс и сравни при 1 000 и 1 000 000 записей.","prereq":["algorithms-tradeoffs","performance-profiler"]},{"id":"performance-vectorization","title":"Автовекторизация и SIMD","stage":5,"tier":"specialization","difficulty":3,"what":"Одна инструкция может обрабатывать несколько элементов данных.","know":"Зависимости цикла, aliasing, alignment, отчёт компилятора; intrinsics зависят от архитектуры.","why":"Полезно в численных и мультимедийных ядрах после подтверждённого bottleneck.","practice":"Добейся автовекторизации сложения массивов и сравни с исходным циклом на разных размерах.","prereq":["performance-cpu","performance-cache"]},{"id":"performance-sharing","title":"False sharing и NUMA","stage":6,"tier":"specialization","difficulty":3,"what":"Независимые потоки могут мешать друг другу через cache lines и удалённую память.","know":"Coherence, false sharing, размещение счётчиков, affinity и NUMA topology на уровне концепций.","why":"Нужно для масштабирования специализированных многопоточных вычислений.","practice":"Сравни соседние и разнесённые счётчики потоков; объясни связь результата с cache lines.","prereq":["performance-cache","concurrency-atomic"]},{"id":"performance-memory","title":"Профиль памяти и удержание объектов","stage":4,"tier":"middle-required","difficulty":2,"what":"Рост памяти бывает следствием утечки, живых ненужных объектов или выбранной стратегии хранения.","know":"Peak RSS, allocation profile, retained objects, fragmentation, leaks; память ОС и логические объекты.","why":"Помогает устранять рост памяти с понятной причиной.","practice":"Сними профиль повторной обработки файлов и отличи утечку от буфера, сохраняющего capacity.","prereq":["performance-allocations","os-vm","raii-shared"]},{"id":"performance-strategy","title":"Стратегия оптимизации и компромиссы","stage":6,"tier":"senior-required","difficulty":2,"what":"Изменение принимается по измеримому эффекту, корректности и стоимости сопровождения.","know":"Гипотеза → профиль → эксперимент → регрессионная проверка; latency против throughput и памяти.","why":"Senior выбирает необходимую степень сложности и может обосновать отказ от опасной оптимизации.","practice":"Подготовь отчёт: исходный профиль, две альтернативы, цифры, ограничения, тесты и план отката.","prereq":["performance-profiler","performance-complexity","performance-memory"]}]},{"id":"internals","title":"C++ internals: от исходника до программы","summary":"Компиляция, линковка, устройство объектов и границы гарантий стандарта. Базовые ошибки сборки нужны Junior; ABI и детали двоичного формата изучаются по мере работы с библиотеками.","stage":3,"track":"systems","prereq":["types","pointers","oop","build"],"mini":["Чем ошибка компиляции отличается от undefined reference на этапе линковки?","Зачем нужны объявления, определения и One Definition Rule?","Почему sizeof структуры может превышать сумму размеров её полей?","Что гарантирует стандарт о virtual dispatch, а что является деталью ABI?","Почему программа с undefined behavior не обязана падать сразу?"],"practice":["Останови сборку на этапах preprocessing, assembly и object file и сравни результаты.","Разбей проект на два .cpp, намеренно создай missing symbol и multiple definition, затем исправь.","Посмотри symbols object file и сопоставь имена C++ с demangled выводом.","Измерь sizeof/alignof нескольких структур и объясни padding.","Найди выход за границы через sanitizer и исправь причину."],"skills":[{"id":"internals-pipeline","title":"Этапы сборки C++","stage":2,"tier":"junior-required","difficulty":1,"what":"Исходники преобразуются через preprocessing и compilation в object files, затем связываются в программу.","know":"Preprocessing, compilation, assembly, linking; диагностика этапа ошибки.","why":"Позволяет осмысленно читать вывод компилятора и сборочной системы.","practice":"Получи preprocessed source, assembly и object file для одной маленькой программы.","prereq":["build-pipeline","core-files"]},{"id":"internals-preprocessor","title":"Preprocessor: include, define и условия","stage":2,"tier":"junior-required","difficulty":1,"what":"Обработка директив происходит до основной компиляции C++.","know":"#include, include guards, #pragma once как распространённое расширение, #if; опасность макросов.","why":"Нужен для заголовков и платформенного кода; обычные значения лучше выражать средствами языка.","practice":"Создай два заголовка с повторным включением и исправь redefinition без макросов для вычислений.","prereq":["internals-pipeline"]},{"id":"internals-translation","title":"Translation unit и границы заголовков","stage":2,"tier":"junior-required","difficulty":1,"what":"Каждый .cpp с включёнными заголовками образует отдельно компилируемую единицу трансляции.","know":"Declaration/definition, header/source split, forward declaration, зависимости include.","why":"Помогает разделять программу и избегать циклических включений.","practice":"Вынеси объявления класса в .h, определения в .cpp и убери лишний include через forward declaration.","prereq":["internals-preprocessor"]},{"id":"internals-objects","title":"Object files, sections и symbols","stage":3,"tier":"junior-plus","difficulty":2,"what":"Промежуточный двоичный файл содержит код, данные, symbols и relocation records.","know":"Text/data/bss на уровне идеи, определённые и неопределённые symbols, nm/objdump или аналоги.","why":"Даёт способ исследовать неизвестный symbol и устройство результата компиляции.","practice":"Посмотри symbols двух object files и найди определение и использование одной функции.","prereq":["internals-translation"]},{"id":"internals-linker","title":"Linker и разрешение символов","stage":2,"tier":"junior-required","difficulty":1,"what":"Линковщик связывает ссылки на функции и данные с их определениями.","know":"Undefined reference/unresolved external, multiple definition, входные библиотеки и порядок на некоторых toolchains.","why":"Большинство многомодульных проектов требуют умения читать ошибки линковки.","practice":"Удали один .cpp из сборки, определи причину unresolved symbol и верни корректную зависимость.","prereq":["internals-translation"]},{"id":"internals-odr","title":"One Definition Rule и linkage","stage":3,"tier":"junior-plus","difficulty":2,"what":"Правила определяют, где определения могут повторяться и как имена видны между единицами трансляции.","know":"External/internal linkage, inline, anonymous namespace; не каждое нарушение ODR обязано диагностироваться.","why":"Предотвращает ошибки, проявляющиеся лишь в определённых конфигурациях сборки.","practice":"Исправь глобальную переменную в header тремя подходами: extern, C++17 inline и скрытое состояние .cpp.","prereq":["internals-linker"]},{"id":"internals-static","title":"Статические библиотеки","stage":3,"tier":"junior-plus","difficulty":1,"what":"Архив object files участвует в линковке выполняемой программы.","know":".a/.lib, статическая линковка, транзитивные зависимости, размер и пересборка.","why":"Помогает выделять повторно используемые модули проекта.","practice":"Собери математическую библиотеку статически и подключи её к двум приложениям.","prereq":["internals-linker","internals-objects"]},{"id":"internals-dynamic","title":"Динамические библиотеки и загрузка","stage":4,"tier":"middle-required","difficulty":2,"what":"Часть кода подключается из shared library/DLL при загрузке или во время работы.","know":".so/.dll/.dylib, экспорт symbols, search paths, зависимости, runtime ошибки загрузки.","why":"Нужно для развёртывания приложений и интеграции сторонних библиотек.","practice":"Собери shared library, перенеси приложение в чистый каталог и проверь поиск зависимости.","prereq":["internals-static"]},{"id":"internals-abi","title":"ABI и двоичная совместимость","stage":5,"tier":"specialization","difficulty":3,"what":"ABI определяет взаимодействие скомпилированных компонентов на конкретной платформе.","know":"Calling convention, layout, exception/runtime boundaries, версии compiler/toolchain, совместимость библиотек.","why":"Критично при поставке SDK, plugins и долгоживущих двоичных интерфейсов.","practice":"Составь список ABI-рисков добавления поля в публичный class и предложи стабильный C API или pImpl.","prereq":["internals-dynamic","internals-layout"]},{"id":"internals-mangling","title":"Name mangling и extern \"C\"","stage":4,"tier":"middle-required","difficulty":2,"what":"C++ кодирует информацию о сущностях в linker symbols по правилам реализации.","know":"Перегрузка, namespaces, demangling; extern \"C\" задаёт language linkage, но не универсальную ABI-совместимость типов.","why":"Нужно для чтения диагностик и интеграции с C библиотеками.","practice":"Сравни symbol перегруженной функции и функции с extern \"C\"; вызови последнюю из C.","prereq":["internals-objects","internals-linker"]},{"id":"internals-layout","title":"Представление объектов в памяти","stage":4,"tier":"middle-required","difficulty":2,"what":"Объекты имеют размер, выравнивание, время жизни и правила доступа к представлению.","know":"sizeof, alignof, standard-layout/trivially copyable на базовом уровне; байты объекта не равны переносимому формату файла.","why":"Предотвращает ошибочную сериализацию через запись сырых bytes структуры.","practice":"Сравни sizeof простых структур и объясни, почему их raw dump нельзя считать стабильным сетевым форматом.","prereq":["structures-arrays","types-aggregate","pointers-lifetime"]},{"id":"internals-vtable","title":"Virtual dispatch и vtable","stage":4,"tier":"middle-required","difficulty":2,"what":"Virtual вызов выбирает реализацию по динамическому типу; vtable/vptr — распространённая реализация, не требование стандарта.","know":"Статический/динамический тип, indirection, devirtualization, object slicing; устройство зависит от ABI.","why":"Помогает оценивать полиморфизм без мифов о его стоимости и layout.","practice":"Сравни assembly прямого и virtual вызова в Release, затем проверь влияние final.","prereq":["internals-layout","internals-pipeline","oop-virtual"]},{"id":"internals-alignment","title":"Alignment и padding","stage":4,"tier":"middle-required","difficulty":2,"what":"Выравнивание ограничивает адрес размещения объекта; padding добавляет промежутки между данными.","know":"alignof, alignas, padding, стоимость packed structs, корректность выровненного доступа.","why":"Нужно для двоичных интерфейсов, буферов и интерпретации sizeof.","practice":"Переставь char/int/double поля, измерь sizeof/alignof и объясни изменения без предположений о другой платформе.","prereq":["internals-layout"]},{"id":"internals-ub","title":"Undefined Behavior и границы языка","stage":2,"tier":"junior-required","difficulty":1,"what":"Для программы с UB стандарт не задаёт требований к дальнейшему поведению.","know":"Выход за границы, use-after-free, signed overflow, неинициализированное чтение; отличия от unspecified и implementation-defined.","why":"Позволяет понимать, почему «на моей машине работает» не подтверждает корректность.","practice":"Исправь три примера: выход за конец vector, возврат ссылки на локальную переменную и переполнение signed int.","prereq":["structures-arrays","pointers-dangling","types-integers"]},{"id":"internals-templates","title":"Компиляция templates и время сборки","stage":4,"tier":"middle-required","difficulty":2,"what":"Шаблоны порождают специализации при instantiation, что влияет на видимость определений и сборку.","know":"Определения в headers, explicit instantiation, ошибки instantiation, code bloat, стоимость include.","why":"Помогает проектировать библиотеки и объяснять ошибки шаблонной линковки.","practice":"Вынеси template в .cpp, изучи ошибку использования, затем исправь header или explicit instantiation.","prereq":["internals-translation","internals-odr","templates-classes"]}]},{"id":"build","title":"Сборка и зависимости","summary":"От первой команды компилятора до воспроизводимой сборки нескольких библиотек и приложений.","stage":0,"track":"tools","prereq":["core"],"mini":["На каком этапе обнаруживается undefined reference и чем это отличается от syntax error?","Как PUBLIC, PRIVATE и INTERFACE влияют на потребителей CMake target?","Почему успешная сборка в IDE не доказывает воспроизводимость проекта?","Какие данные нужно закрепить кроме версий прямых зависимостей?"],"practice":["Собери библиотеку, CLI и тесты из чистого checkout одной документированной последовательностью команд.","Добавь Debug, Release и sanitizer configurations без абсолютных путей к своему компьютеру.","Обнови зависимость и покажи проверки поведения, совместимости и возможность отката.","Измерь полную и инкрементальную сборку; обоснуй одно улучшение числами."],"skills":[{"id":"build-pipeline","title":"Путь от исходника до программы","stage":0,"tier":"junior-required","difficulty":0,"what":"Разобрать этапы preprocessing, compilation, assembly и linking.","know":"Чем исходный файл отличается от object file; когда возникают compile error и linker error.","why":"Позволяет искать ошибку на нужном этапе, а не менять код наугад.","practice":"Собери программу из двух .cpp и одного .hpp; намеренно получи и объясни ошибку компиляции и undefined reference.","prereq":[]},{"id":"build-commands","title":"Сборка из командной строки","stage":0,"tier":"junior-required","difficulty":0,"what":"Собирать небольшую программу компилятором GCC, Clang или MSVC без кнопки IDE.","know":"Основные параметры выбора стандарта C++, include path, output file и подключения object files.","why":"Сделает процесс сборки воспроизводимым и поможет понимать действия IDE.","practice":"Собери один проект командами для Debug и Release; сохрани команды в README.","prereq":["build-pipeline","git-terminal"]},{"id":"build-warnings","title":"Предупреждения и режим языка","stage":1,"tier":"junior-required","difficulty":1,"what":"Настроить строгие предупреждения и явно выбрать стандарт C++.","know":"Что проверяют -Wall, -Wextra и /W4; почему наборы предупреждений компиляторов различаются; зачем нужен -std или /std.","why":"Предупреждения помогают найти ошибки типов, преобразований и управления потоком до запуска.","practice":"Устрани предупреждения о signed/unsigned, затенении и неиспользуемом результате; включи warnings-as-errors для своего кода.","prereq":["build-commands"]},{"id":"build-headers","title":"Заголовки и единицы трансляции","stage":1,"tier":"junior-required","difficulty":1,"what":"Разделять объявления и определения между .hpp и .cpp.","know":"Include guards, #pragma once, forward declaration, self-contained header и One Definition Rule на практических примерах.","why":"Уменьшает связанность и объясняет типовые ошибки повторного определения.","practice":"Создай библиотеку из трех единиц трансляции; каждый публичный заголовок отдельно проверь на компиляцию.","prereq":["build-pipeline"]},{"id":"build-cmake","title":"Современная модель CMake","stage":2,"tier":"junior-required","difficulty":1,"what":"Описывать сборку через targets и их свойства.","know":"add_library, add_executable, target_link_libraries, target_include_directories и target_compile_features; смысл PRIVATE, PUBLIC и INTERFACE.","why":"Target-based модель передает нужные свойства потребителям и избегает глобальных настроек.","practice":"Создай библиотеку, CLI и тестовый target; докажи, что CLI получает нужные include paths через зависимость.","prereq":["build-headers","build-commands","core-files"]},{"id":"build-configurations","title":"Debug, Release и CMake Presets","stage":2,"tier":"junior-required","difficulty":1,"what":"Разделять конфигурации сборки и хранить воспроизводимые настройки.","know":"Отладочные символы, optimization level, assertions, single-config и multi-config generators; назначение CMakePresets.json.","why":"Ошибки и скорость могут отличаться между Debug и Release, поэтому нужны обе конфигурации.","practice":"Настрой отдельные presets для Debug, Release и sanitizers; собери проект из чистого каталога.","prereq":["build-cmake"]},{"id":"build-libraries","title":"Статические и динамические библиотеки","stage":3,"tier":"junior-plus","difficulty":2,"what":"Понимать границы static library и shared library.","know":"Link time и load time, visibility/export, runtime library paths, базовое отличие API от ABI.","why":"Помогает доставлять приложение и разбирать ошибки загрузки библиотек.","practice":"Собери одну библиотеку в static и shared вариантах; проверь запуск приложения вне каталога сборки.","prereq":["build-cmake"]},{"id":"build-packages","title":"Подключение пакетов","stage":2,"tier":"junior-required","difficulty":1,"what":"Подключать внешние библиотеки через CMake package targets.","know":"find_package, CONFIG packages, imported targets; почему ручное копирование заголовков и .lib не равно управлению зависимостями.","why":"Чужая библиотека должна подключаться одинаково на машине разработчика и в CI.","practice":"Подключи fmt и GoogleTest; README должен позволять повторить сборку без ручной правки абсолютных путей.","prereq":["build-cmake"]},{"id":"build-vcpkg","title":"Зависимости через vcpkg","stage":3,"tier":"junior-plus","difficulty":1,"what":"Использовать manifest mode и закреплять конфигурацию зависимостей.","know":"vcpkg.json, baseline, triplet, toolchain file; отличие host dependencies от target dependencies на уровне назначения.","why":"Снижает вероятность случайно собрать разные версии библиотек у разных разработчиков.","practice":"Собери проект через manifest; закрепи baseline и задокументируй команду восстановления зависимостей.","prereq":["build-packages"]},{"id":"build-conan","title":"Зависимости через Conan","stage":3,"tier":"specialization","difficulty":2,"what":"Освоить Conan как альтернативный менеджер C++ пакетов.","know":"Profiles, settings, options, lockfiles, CMakeToolchain и CMakeDeps; последствия различий compiler и runtime.","why":"Полезно для команд со своим registry и сложной матрицей бинарных пакетов.","practice":"Создай conanfile для проекта и lockfile; объясни, какие настройки делают бинарные пакеты несовместимыми.","prereq":["build-packages"]},{"id":"build-reproducibility","title":"Воспроизводимость и обновление зависимостей","stage":4,"tier":"middle-required","difficulty":2,"what":"Контролировать версии toolchain, библиотек и генераторов сборки.","know":"Закрепление версий, transitive dependencies, обновление lockfiles, проверка источников и стратегия регулярных обновлений.","why":"Одинаковый исходный код не гарантирует одинаковое поведение при разных инструментах и зависимостях.","practice":"В чистом окружении восстанови сборку по документации; обнови одну зависимость отдельным изменением с тестами и планом отката.","prereq":["build-configurations","build-packages"]},{"id":"build-scale","title":"Сборка большого C++ проекта","stage":5,"tier":"senior-required","difficulty":3,"what":"Измерять и сокращать стоимость инкрементальной и полной сборки.","know":"Граф зависимостей, PCH, unity builds, compilation cache, parallelism, LTO и их ограничения; ABI-совместимость изменений.","why":"В большой команде время сборки и устойчивость бинарных границ влияют на скорость всей разработки.","practice":"Измерь cold и incremental build; найди тяжелые заголовки, измени одну границу зависимости и сравни время и потребление памяти.","prereq":["build-reproducibility","build-libraries"]}]},{"id":"debugging","title":"Отладка и поиск ошибок","summary":"Системный поиск причин: воспроизведение, debugger, sanitizers, дампы, гонки и производственные инциденты.","stage":1,"track":"tools","prereq":["core","pointers","errors"],"mini":["Почему исчезновение crash после добавления cout не означает исправление?","Что именно показывает стек ASan и чего он не доказывает?","Чем data race отличается от логической гонки без UB?","Как доказать, что исправлена причина ошибки, а не замаскирован симптом?"],"practice":["Оформи воспроизводимый bug report и минимальный пример.","Найди по одной ошибке с breakpoint, watchpoint, ASan и UBSan.","Разбери зависший процесс по стекам потоков и состоянию ожиданий.","Проведи разбор crash в Release с символами и добавь тест на регрессию."],"skills":[{"id":"debugging-reproduce","title":"Воспроизводимый отчет об ошибке","stage":1,"tier":"junior-required","difficulty":0,"what":"Начинать расследование с наблюдаемого симптома и минимального сценария.","know":"Expected и actual behavior, входные данные, версия программы, окружение, частота ошибки; отличие наблюдения от гипотезы.","why":"Точное воспроизведение экономит время и позволяет проверить исправление.","practice":"Сократи падающий пример до минимального; напиши отчет, по которому другой человек повторит сбой.","prereq":[]},{"id":"debugging-debugger","title":"Пошаговая отладка","stage":1,"tier":"junior-required","difficulty":1,"what":"Управлять выполнением программы в GDB или Visual Studio Debugger.","know":"Breakpoints, step into/over/out, call stack, locals, watches и условная остановка.","why":"Помогает понять реальный порядок вызовов и значения переменных.","practice":"Найди ошибку индекса через условный breakpoint; объясни каждый кадр стека в месте сбоя.","prereq":["debugging-reproduce","core-condition"]},{"id":"debugging-gdb","title":"Практика GDB","stage":2,"tier":"specialization","difficulty":1,"what":"Отлаживать программу из терминала и получать отчет о состоянии процесса.","know":"run, break, next, step, finish, backtrace, frame, print, watch; сборка с символами; базовая работа с core dump.","why":"При удаленной разработке графический отладчик доступен не всегда.","practice":"Найди повреждение переменной с watchpoint и изучи core dump; сохрани краткую хронологию расследования.","prereq":["debugging-debugger"]},{"id":"debugging-visual-studio","title":"Visual Studio Debugger","stage":2,"tier":"specialization","difficulty":1,"what":"Использовать отладчик Visual Studio для Windows-приложений.","know":"Call Stack, Watch, Exception Settings, conditional breakpoints, data breakpoints и подключение к процессу в поддерживаемых сценариях.","why":"Ускоряет диагностику Windows-проектов и ошибок на границе с системными библиотеками.","practice":"Настрой остановку на выбрасывании исключения; найди первое место изменения ошибочного значения.","prereq":["debugging-debugger"]},{"id":"debugging-undefined","title":"Неопределенное поведение","stage":2,"tier":"junior-required","difficulty":2,"what":"Отличать undefined behavior от обычной логической ошибки.","know":"Выход за границы, dangling pointer, use-after-free, signed overflow, чтение неинициализированной памяти; отсутствие гарантированного симптома.","why":"Программа с UB может работать в Debug и ломаться после безобидного изменения Release-сборки.","practice":"Исправь пять небольших примеров UB и объясни нарушенный контракт языка, а не только наблюдаемый crash.","prereq":["debugging-reproduce","pointers-dangling"]},{"id":"debugging-sanitizers","title":"ASan и UBSan","stage":2,"tier":"junior-required","difficulty":1,"what":"Использовать инструментированные сборки для поиска ошибок памяти и UB.","know":"Возможности и ограничения AddressSanitizer и UndefinedBehaviorSanitizer, символизация отчетов, воспроизводящий ввод.","why":"Дает адрес и стек ошибки, которую сложно поймать обычным debugger.","practice":"Запусти тесты под ASan и UBSan; исправь use-after-free и overflow, затем добавь регрессионные проверки.","prereq":["debugging-undefined"]},{"id":"debugging-leaks","title":"Утечки и владение ресурсами","stage":3,"tier":"junior-plus","difficulty":2,"what":"Находить утечки памяти и системных ресурсов.","know":"Отличие утечки от удерживаемого cache; RAII, циклы shared_ptr, lifetime analysis и платформенные инструменты проверки утечек.","why":"Долгоживущее приложение должно сохранять ограниченное потребление ресурсов.","practice":"Создай нагрузочный повтор операции; измерь память и число открытых файлов, найди и устрани утечку.","prereq":["debugging-sanitizers","raii-ownership"]},{"id":"debugging-logic","title":"Отладка гипотезами","stage":3,"tier":"middle-required","difficulty":2,"what":"Проверять причины ошибки последовательными экспериментами.","know":"Инварианты, assertions, контрольные данные, бинарное сужение области ошибки, исключение альтернативных объяснений.","why":"Предотвращает случайные исправления, которые прячут симптом и создают новый дефект.","practice":"Для сложной ошибки выпиши три гипотезы и эксперимент для каждой; приложи доказательство корневой причины.","prereq":["debugging-debugger","debugging-reproduce"]},{"id":"debugging-races","title":"Гонки данных и ThreadSanitizer","stage":4,"tier":"middle-required","difficulty":2,"what":"Расследовать ошибки совместного доступа в многопоточном коде.","know":"Data race и race condition, synchronization, happens-before на практическом уровне, ограничения ThreadSanitizer.","why":"Редкие сбои часто зависят от порядка выполнения и не воспроизводятся при пошаговой отладке.","practice":"Запусти поддерживаемую конфигурацию под TSan; исправь гонку, объясни используемую синхронизацию и проверь нагрузкой.","prereq":["debugging-sanitizers","concurrency-races"]},{"id":"debugging-deadlock","title":"Зависания и взаимные блокировки","stage":4,"tier":"middle-required","difficulty":2,"what":"Отличать deadlock от медленного ожидания или бесконечного цикла.","know":"Стеки всех потоков, lock ordering, lock contention, timeout, блокирующий I/O и состояние очередей.","why":"Приложение может быть недоступно без crash, поэтому нужен отдельный подход к зависаниям.","practice":"Воспроизведи deadlock из двух mutex; собери стеки, построй цикл ожидания и исправь порядок захвата.","prereq":["debugging-races","debugging-debugger","concurrency-deadlock"]},{"id":"debugging-release","title":"Ошибки только в Release и crash dumps","stage":5,"tier":"senior-required","difficulty":3,"what":"Диагностировать сбои оптимизированной программы по ограниченным данным.","know":"Символы и соответствие build ID, оптимизированные переменные, inlining, minidumps/core dumps, отличие первичного повреждения от места падения.","why":"В эксплуатации воспроизведение и полный исходный контекст часто отсутствуют.","practice":"Расследуй crash оптимизированной сборки по dump и логам; проверь версию символов и укажи границы уверенности выводов.","prereq":["debugging-logic","debugging-debugger"]},{"id":"debugging-incidents","title":"Сложные производственные инциденты","stage":6,"tier":"senior-required","difficulty":3,"what":"Руководить диагностикой редкого сбоя через данные и проверяемые гипотезы.","know":"Снижение ущерба, безопасное добавление диагностики, rollback, временная шкала, root cause analysis и устранение системных причин.","why":"Senior отвечает за восстановление сервиса и предотвращение повторения, а не только за локальную правку.","practice":"Проведи учебный инцидент: ограничь ущерб, собери доказательства, исправь причину и напиши разбор с конкретными профилактическими действиями.","prereq":["debugging-release","debugging-deadlock"]}]},{"id":"testing","title":"Тестирование и доказательство корректности","summary":"От граничных случаев и GoogleTest до fuzzing, многопоточных проверок и стратегии качества.","stage":1,"track":"tools","prereq":["core","errors"],"mini":["Какой дефект ловит каждый тест и почему он важен пользователю?","Когда fake проще и надежнее mock?","Почему высокий coverage не доказывает качество тестов?","Как проверить конкурентный сценарий без произвольных sleep?"],"practice":["Составь таблицу граничных входов и автоматизируй ее в GoogleTest.","Добавь интеграционный сценарий с частичным отказом внешней зависимости.","Запусти fuzzing парсера с sanitizers и сохрани найденные контрпримеры.","Оцени набор тестов по рискам, времени обратной связи и частоте ложных срабатываний."],"skills":[{"id":"testing-cases","title":"Тестовые случаи и границы","stage":1,"tier":"junior-required","difficulty":0,"what":"Выводить проверки из требований, а не из строк реализации.","know":"Нормальный случай, пустой ввод, границы диапазона, недопустимые данные, эквивалентные классы.","why":"Большая часть ошибок проявляется на забытых границах и исключениях из обычного сценария.","practice":"Для функции разбора числа составь таблицу случаев до написания кода, включая overflow и лишние символы.","prereq":["core-functions"]},{"id":"testing-unit","title":"Модульные тесты","stage":2,"tier":"junior-required","difficulty":1,"what":"Проверять небольшую единицу поведения изолированно и детерминированно.","know":"Arrange–Act–Assert, читаемые названия, независимость тестов, observable behavior и причины flaky tests.","why":"Позволяет безопасно менять реализацию и быстро локализовать регрессию.","practice":"Покрой модуль расчета стоимости тестами на результат и ошибки; тесты не должны зависеть от порядка запуска.","prereq":["testing-cases"]},{"id":"testing-googletest","title":"GoogleTest на практике","stage":2,"tier":"junior-required","difficulty":1,"what":"Подключить и использовать GoogleTest в C++ проекте.","know":"TEST, TEST_F, EXPECT и ASSERT, fixtures, parameterized tests; запуск через CTest.","why":"Дает стандартный способ запускать, диагностировать и интегрировать тесты в сборку.","practice":"Добавь GoogleTest target и CTest; параметризуй тесты парсера минимум десятью значимыми наборами данных.","prereq":["testing-unit","build-cmake"]},{"id":"testing-integration","title":"Интеграционные тесты","stage":3,"tier":"junior-plus","difficulty":1,"what":"Проверять взаимодействие нескольких компонентов через реальные границы.","know":"Файловая система, сеть, database fixture, временные каталоги, изоляция ресурсов и очистка состояния.","why":"Отдельные модули могут быть корректны, но неправильно договориться о формате или последовательности действий.","practice":"Проверь сохранение и повторное чтение данных из файла, поврежденный файл и отказ записи.","prereq":["testing-unit"]},{"
