id":"testing-errors","title":"Проверка ошибок и отказов","stage":3,"tier":"middle-required","difficulty":2,"what":"Считать обработку ошибок полноценным контрактом.","know":"Exception safety, return codes, timeouts, частичный результат, повтор операции и сохранение инвариантов после отказа.","why":"Основной сценарий обычно проще аварийного; надежность определяется поведением при сбоях.","practice":"Добавь инъекцию отказа файловой операции и выделения ресурса; проверь отсутствие утечек и согласованность состояния.","prereq":["testing-integration","errors-propagation"]},{"id":"testing-doubles","title":"Подмены зависимостей и gMock","stage":3,"tier":"junior-plus","difficulty":2,"what":"Применять fake, stub и mock там, где они помогают проверить контракт.","know":"Dependency injection, различия test doubles, проверка состояния против проверки взаимодействий, цена чрезмерного mocking.","why":"Тесты должны быстро выявлять дефект и переживать внутренний рефакторинг.","practice":"Подмени clock и внешний сервис; сравни тест через fake с тестом через gMock и обоснуй выбор.","prereq":["testing-unit"]},{"id":"testing-property","title":"Проверки свойств","stage":4,"tier":"middle-required","difficulty":2,"what":"Проверять общие свойства на множестве автоматически созданных входов.","know":"Инварианты, round-trip, идемпотентность, shrinking, фиксация seed и ограничения генераторов.","why":"Помогает обнаружить сочетания данных, которые трудно придумать вручную.","practice":"Проверь parse(serialize(x)) == x и сохранение порядка сортировки для случайных данных; сохрани минимальный контрпример.","prereq":["testing-cases","testing-unit"]},{"id":"testing-fuzzing","title":"Fuzzing парсеров и API","stage":4,"tier":"middle-required","difficulty":2,"what":"Передавать недоверенные входы инструменту fuzzing и воспроизводить найденные дефекты.","know":"Fuzz target, corpus, coverage-guided fuzzing, ограничения времени и памяти, libFuzzer в подходящем toolchain, сочетание с ASan.","why":"Особенно полезно для бинарных форматов, протоколов и сложных веток обработки ошибок.","practice":"Сделай fuzz target для парсера; минимизируй найденный crash и добавь его вход в регрессионный набор.","prereq":["testing-property","debugging-sanitizers"]},{"id":"testing-coverage","title":"Покрытие и качество тестов","stage":3,"tier":"junior-plus","difficulty":1,"what":"Использовать coverage как указатель непроверенных областей.","know":"Line и branch coverage, ограничения процента покрытия, важность assertions и риск проверки деталей реализации.","why":"Сто процентов выполненных строк не доказывают правильность поведения.","practice":"Построй отчет coverage; найди непроверенную ветку с реальным риском и добавь проверку, ловящую намеренную ошибку.","prereq":["testing-googletest"]},{"id":"testing-concurrent","title":"Тестирование многопоточного поведения","stage":4,"tier":"middle-required","difficulty":3,"what":"Проверять конкурентные операции без надежды на случайный sleep.","know":"Управляемая синхронизация теста, bounded waits, stress testing, TSan, инварианты очередей и завершения работы.","why":"Тест должен выявлять сбой и давать диагностику, а не зависать навсегда.","practice":"Проверь очередь при нескольких producer/consumer, закрытии и отмене; ограничь время и сравни число отправленных и обработанных элементов.","prereq":["testing-errors","debugging-races","concurrency-cv"]},{"id":"testing-benchmarks","title":"Корректные микробенчмарки","stage":4,"tier":"middle-required","difficulty":2,"what":"Измерять стоимость операции без очевидных искажений.","know":"Release-сборка, оптимизация неиспользуемой работы, warm-up, variance, размеры входа, allocations и Google Benchmark.","why":"Ненадежное измерение может привести к усложнению кода без реального ускорения.","practice":"Сравни две реализации поиска на нескольких размерах данных; покажи распределение измерений и поясни ограничения.","prereq":["testing-unit","build-configurations"]},{"id":"testing-strategy","title":"Стратегия качества большого проекта","stage":6,"tier":"senior-required","difficulty":3,"what":"Выбирать набор проверок исходя из вероятности и последствий отказов.","know":"Баланс unit, integration, end-to-end, fuzz, load и compatibility tests; стоимость flaky tests и время feedback loop.","why":"Важна измеримая защита пользовательского поведения при приемлемой стоимости поддержки.","practice":"Подготовь стратегию для сервиса с legacy-модулем: риски, обязательные проверки, бюджет времени CI и правила работы с нестабильными тестами.","prereq":["testing-integration","testing-fuzzing","testing-concurrent","testing-coverage"]}]},{"id":"git","title":"Git, Linux и работа в команде","summary":"Рабочее окружение, история изменений, code review и понятная техническая коммуникация.","stage":0,"track":"tools","prereq":["core"],"mini":["Чем staged diff отличается от diff рабочего дерева?","Почему merge без текстового конфликта все еще требует тестирования?","В каком случае revert безопаснее переписывания опубликованной истории?","Как сделать замечание в review проверяемым и полезным?"],"practice":["Создай учебный репозиторий с небольшими commits и чистым .gitignore.","Разреши конфликт API, проверив все места использования.","Автоматизируй поиск регрессии через git bisect.","Напиши PR с причиной изменения, новым поведением и результатом проверки."],"skills":[{"id":"git-terminal","title":"Терминал и работа с файлами","stage":0,"tier":"junior-required","difficulty":0,"what":"Работать с каталогами и командами без привязки к IDE.","know":"Current directory, относительные и абсолютные пути, quoting, exit code, stdin/stdout/stderr; базовые команды своей оболочки.","why":"Терминал нужен для сборки, запуска тестов и диагностики на чужом компьютере.","practice":"Создай каталог проекта, запусти сборку и перенаправь stdout и stderr в разные файлы; проверь код завершения.","prereq":[]},{"id":"git-linux","title":"Основы Linux для разработчика","stage":1,"tier":"junior-required","difficulty":1,"what":"Ориентироваться в Linux окружении разработки.","know":"Права файлов, executable bit, environment variables, PATH, процессы, сигналы, pipes, package manager и SSH по назначению.","why":"Большая часть серверной C++ разработки и CI использует Linux.","practice":"Найди процесс приложения, проверь открытые файлы доступным инструментом и корректно заверши его сигналом; объясни права каталога.","prereq":["git-terminal"]},{"id":"git-model","title":"Рабочее дерево, index и commit","stage":1,"tier":"junior-required","difficulty":0,"what":"Понимать три состояния изменения в Git.","know":"Working tree, staging area, repository, status, diff, add, commit и .gitignore.","why":"Позволяет сохранять осмысленные изменения и не коммитить случайные файлы.","practice":"Создай репозиторий, добавь .gitignore для сборки и сделай три небольших commit с понятными сообщениями.","prereq":["git-terminal"]},{"id":"git-branches","title":"Ветки и совместная работа","stage":1,"tier":"junior-required","difficulty":1,"what":"Работать с локальной и удаленной историей проекта.","know":"Branch, remote, fetch, pull, push, merge и tracking branch; чтение graph истории.","why":"Дает возможность изолировать задачи и согласовывать изменения в команде.","practice":"Создай ветку задачи, отправь ее в учебный remote и подготовь pull request с описанием поведения и проверки.","prereq":["git-model"]},{"id":"git-conflicts","title":"Разрешение конфликтов","stage":2,"tier":"junior-required","difficulty":1,"what":"Объединять конфликтующие изменения с пониманием смысла кода.","know":"Base, ours и theirs; конфликт текста и конфликт поведения; повторная сборка после merge.","why":"Простое удаление маркеров конфликта может оставить логически неверную программу.","practice":"Слей две ветки, меняющие один API; обнови все вызовы и тесты, затем объясни итоговое решение.","prereq":["git-branches"]},{"id":"git-history","title":"Управление локальной историей","stage":3,"tier":"junior-plus","difficulty":2,"what":"Различать merge, rebase, cherry-pick, revert, restore и reset.","know":"Когда операция меняет историю; как reflog помогает восстановить локальную работу; почему опубликованная история требует согласования.","why":"Снижает риск потери изменений и помогает поддерживать читаемую историю.","practice":"В учебном репозитории исправь ошибочный локальный commit, перенеси исправление в другую ветку и отмени уже опубликованное изменение через revert.","prereq":["git-conflicts"]},{"id":"git-bisect","title":"Поиск регрессии через Git","stage":3,"tier":"middle-required","difficulty":1,"what":"Использовать историю как инструмент диагностики.","know":"git log, blame как поиск контекста, git bisect, воспроизводимая автоматическая проверка и пропуск несобираемых revisions.","why":"Позволяет быстро сузить источник ошибки среди десятков изменений.","practice":"Создай историю с внесенной регрессией и найди первый плохой commit через bisect run.","prereq":["git-history","debugging-reproduce"]},{"id":"git-review","title":"Полезный code review","stage":3,"tier":"middle-required","difficulty":2,"what":"Проверять изменение по рискам, контрактам и поведению.","know":"Correctness, lifetime, concurrency, error paths, тесты и читаемость; различие блокирующего дефекта и предпочтения стиля.","why":"Review должен предотвращать дефекты и передавать знания, не превращаясь в спор о вкусе.","practice":"Отревьюй небольшой PR: укажи воспроизводимый сценарий для каждого замечания и отдели обязательные исправления от предложений.","prereq":["git-branches","testing-unit"]},{"id":"git-changes","title":"Небольшие и проверяемые изменения","stage":4,"tier":"middle-required","difficulty":2,"what":"Делить большую задачу на самостоятельные безопасные шаги.","know":"Отдельные behavior changes и mechanical changes, миграционные шаги, совместимость промежуточных состояний и rollback.","why":"Меньшие изменения легче проверить, интегрировать и отменить при регрессии.","practice":"Разбей замену файлового формата на несколько PR: чтение старого и нового, миграция, смена записи, удаление совместимости.","prereq":["git-review","git-history"]},{"id":"git-collaboration","title":"Техническая коммуникация и наставничество","stage":6,"tier":"senior-required","difficulty":3,"what":"Помогать команде принимать решения и развивать самостоятельность.","know":"Объяснение trade-offs, письменная фиксация решений, конструктивная обратная связь, onboarding и проверка понимания.","why":"Уровень Senior проявляется в устойчивом результате команды, а не только в скорости личного кодирования.","practice":"Подготовь onboarding для проекта, проведи review с объяснением причин и помоги коллеге самостоятельно завершить задачу; собери обратную связь.","prereq":["git-review","git-changes"]}]},{"id":"architecture","title":"Проектирование и архитектура","summary":"Ясные контракты, владение, безопасный рефакторинг, границы модулей и эволюция больших систем.","stage":1,"track":"design","prereq":["oop","raii","errors"],"mini":["Как по сигнатуре понять, кто владеет ресурсом и сколько он живет?","Какое конкретное изменение упрощает выбранная абстракция?","Чем совместимость исходного кода отличается от совместимости бинарного кода?","Как проверить главный риск архитектурного решения до полной реализации?"],"practice":["Опиши инварианты и lifetime каждого аргумента публичного API.","Выдели предметную логику из I/O и проверь ее независимо.","Выполни рефакторинг legacy-модуля маленькими шагами с защитными тестами.","Сравни две архитектуры по измеримым требованиям и оформи ADR с планом миграции."],"skills":[{"id":"architecture-readability","title":"Читаемость и ясные функции","stage":1,"tier":"junior-required","difficulty":0,"what":"Писать код, из которого понятны намерения и ограничения.","know":"Имена по смыслу, небольшие функции, ранний выход, const, отсутствие магических чисел; комментарий объясняет причину.","why":"Читаемый код проще проверить и безопаснее изменить.","practice":"Перепиши длинную функцию обработки команд на небольшие операции; сохрани поведение и объясни каждое имя.","prereq":[]},{"id":"architecture-invariants","title":"Инварианты и контракты","stage":2,"tier":"junior-required","difficulty":1,"what":"Формулировать допустимое состояние объекта и условия операций.","know":"Precondition, postcondition, class invariant, assert для внутренних предположений и проверка внешнего ввода во время выполнения.","why":"Контракт снижает число неявных допущений между вызывающим кодом и реализацией.","practice":"Спроектируй Range с инвариантом begin \u003c= end; проверь создание, изменение и отказ для недопустимых значений.","prereq":["architecture-readability","oop-encapsulation"]},{"id":"architecture-ownership","title":"Владение в API","stage":2,"tier":"junior-required","difficulty":2,"what":"Делать время жизни и передачу владения понятными из интерфейса.","know":"Value, reference, pointer, unique_ptr, shared_ptr, string_view и span; non-owning view не продлевает lifetime.","why":"Ошибки lifetime часто начинаются с неясного контракта функции.","practice":"Переработай API, возвращавший указатель на временный объект; явно обозначь borrowing и transfer of ownership в типах и документации.","prereq":["architecture-invariants","raii-ownership","pointers-passing"]},{"id":"architecture-encapsulation","title":"Инкапсуляция и зависимости","stage":2,"tier":"junior-required","difficulty":1,"what":"Скрывать представление и ограничивать связи между модулями.","know":"Public contract, private state, cohesion, coupling, composition; почему глобальное изменяемое состояние усложняет тесты.","why":"Изменение внутреннего представления не должно ломать всех потребителей.","practice":"Замени публичные поля класса на операции, сохраняющие инварианты; убери одну глобальную изменяемую зависимость.","prereq":["architecture-invariants","oop-composition"]},{"id":"architecture-refactoring","title":"Безопасный рефакторинг","stage":3,"tier":"middle-required","difficulty":2,"what":"Менять структуру кода с сохранением наблюдаемого поведения.","know":"Characterization tests, маленькие шаги, переименование, извлечение функции, устранение дублирования и контроль diff.","why":"Позволяет улучшать существующий код без одновременной незаметной смены требований.","practice":"Покрой legacy-функцию characterization tests, выдели вычисление из I/O и покажи неизменное поведение на контрольных данных.","prereq":["architecture-readability","testing-unit"]},{"id":"architecture-solid","title":"Принципы SOLID с ограничениями","stage":3,"tier":"junior-plus","difficulty":2,"what":"Понимать полезные цели SOLID и не превращать их в обязательную иерархию классов.","know":"Единая причина изменения, substitutability, узкие интерфейсы и направление зависимостей; цена избыточных абстракций.","why":"Помогает обсуждать конкретную проблему дизайна, а не следовать буквам без контекста.","practice":"Найди нарушение substitutability и слишком широкий интерфейс; исправь только наблюдаемую проблему и оцени рост сложности.","prereq":["architecture-encapsulation"]},{"id":"architecture-patterns","title":"Шаблоны проектирования по задаче","stage":3,"tier":"junior-plus","difficulty":2,"what":"Выбирать pattern по реальной повторяющейся проблеме.","know":"Strategy, Observer, Adapter, Factory, State и Command; lifetime callbacks, удаление подписок и возможность более простой функции.","why":"Знание названия полезно только вместе с пониманием последствий и альтернатив.","practice":"Добавь сменяемую политику сортировки через Strategy, затем сравни virtual interface, template и callable по требованиям проекта.","prereq":["architecture-solid","architecture-ownership"]},{"id":"architecture-api","title":"Проектирование библиотечного API","stage":4,"tier":"middle-required","difficulty":2,"what":"Создавать небольшой последовательный интерфейс с явными ошибками.","know":"Устойчивость контракта, сильные типы, overloads, исключения против result types, thread safety и документация lifetime.","why":"Публичный API дороже менять, чем внутреннюю реализацию.","practice":"Разработай API очереди задач: результат отправки, отмена, закрытие и гарантии lifetime; напиши примеры использования до реализации.","prereq":["architecture-ownership","architecture-invariants"]},{"id":"architecture-boundaries","title":"Границы модулей и направление зависимостей","stage":4,"tier":"middle-required","difficulty":2,"what":"Выделять доменную логику и внешние зависимости в понятные модули.","know":"Ports/adapters как прием, dependency inversion, отсутствие циклов, размер интерфейса и стоимость перехода границы.","why":"Хорошая граница позволяет тестировать и заменять часть системы независимо.","practice":"В приложении с CLI и файлами выдели независимую библиотеку предметной логики; нарисуй граф зависимостей и исключи цикл.","prereq":["architecture-api","architecture-refactoring"]},{"id":"architecture-tradeoffs","title":"Архитектурные компромиссы","stage":5,"tier":"senior-required","difficulty":3,"what":"Выбирать решение по измеримым требованиям и ограничениям.","know":"Latency, throughput, memory, complexity, portability, reliability, team expertise и стоимость миграции; обратимые и дорогие решения.","why":"Универсально лучшей архитектуры нет; решение должно отвечать конкретным нагрузкам и ограничениям.","practice":"Сравни два дизайна системы очередей по пяти критериям; сделай прототип самого рискованного предположения и зафиксируй решение в ADR.","prereq":["architecture-boundaries","testing-benchmarks"]},{"id":"architecture-compatibility","title":"Совместимость API, ABI и данных","stage":5,"tier":"senior-required","difficulty":3,"what":"Планировать изменения, когда потребители обновляются не одновременно.","know":"Source compatibility, binary compatibility, versioned data formats, schema evolution, deprecation и сроки поддержки.","why":"Неосторожное изменение может сломать чужой бинарный модуль или сделать старые данные нечитаемыми.","practice":"Подготовь совместимое изменение public library API и файлового формата; проверь старого потребителя и старые данные.","prereq":["architecture-api","build-libraries","internals-dynamic"]},{"id":"architecture-legacy","title":"Работа с большим legacy-проектом","stage":5,"tier":"senior-required","difficulty":3,"what":"Улучшать систему с неполной документацией и ограниченным покрытием.","know":"Карта зависимостей, исследование поведения, seams, characterization tests, постепенная замена и предотвращение массового переписывания.","why":"Большая часть инженерной работы происходит в уже существующих системах с реальными пользователями.","practice":"Исследуй незнакомый модуль, добавь защитные тесты и замени одну зависимость серией малых изменений с планом возврата.","prereq":["architecture-refactoring","architecture-boundaries","git-changes"]},{"id":"architecture-concurrency","title":"Архитектура конкурентной системы","stage":4,"tier":"middle-required","difficulty":3,"what":"Задавать правила владения и синхронизации на уровне компонентов.","know":"Thread confinement, message passing, bounded queues, backpressure, cancellation, graceful shutdown и lock ownership.","why":"Локально безопасные методы не гарантируют корректность общей последовательности операций.","practice":"Опиши и реализуй жизненный цикл worker pool с ограниченной очередью, отменой и завершением без потери принятых задач.","prereq":["architecture-ownership","architecture-boundaries","testing-concurrent","concurrency-mutex","concurrency-jthread"]},{"id":"architecture-evolution","title":"Техническое направление и эволюция системы","stage":6,"tier":"senior-required","difficulty":3,"what":"Превращать техническую проблему в согласованный поэтапный план улучшений.","know":"Приоритизация рисков, technical debt, оценка неопределенности, ADR, migration plan, observability и критерии завершения.","why":"Senior обеспечивает устойчивое развитие системы и помогает команде понимать цену решений.","practice":"Подготовь план развития большого модуля: измеримая проблема, варианты, риски, этапы миграции, владелец каждого шага и критерии успеха.","prereq":["architecture-tradeoffs","architecture-compatibility","architecture-legacy","git-collaboration"]}]},{"id":"delivery","title":"Автоматизация, CI и выпуск","summary":"Проверяемая доставка проекта: документация, автоматические проверки, релизы и эксплуатация.","stage":1,"track":"tools","prereq":["core","errors"],"mini":["Можно ли собрать и проверить проект из чистого checkout без подсказок автора?","Какие проверки нужны на каждый PR, а какие разумнее запускать реже?","Каких данных не хватает для расследования ошибки на машине пользователя?","Останется ли возможным откат после миграции данных?"],"practice":["Проверь README в чистом окружении и автоматизируй обязательные шаги.","Добавь CI со сборкой, тестами и обоснованной матрицей compiler configurations.","Собери релизный архив и проверь его вне каталога разработки.","Проведи учебное обновление с наблюдением, сигналом отказа и проверкой отката."],"skills":[{"id":"delivery-readme","title":"README и инструкции запуска","stage":1,"tier":"junior-required","difficulty":0,"what":"Описывать проект так, чтобы другой человек смог его собрать и проверить.","know":"Назначение, requirements, команды сборки, запуска и тестирования, пример входа и результата, известные ограничения.","why":"Работающий только на компьютере автора проект трудно оценить и сопровождать.","practice":"Попроси другого человека повторить README или проверь его в чистой среде; исправь все неявные зависимости.","prereq":[]},{"id":"delivery-automation","title":"Автоматизация повторяемых действий","stage":2,"tier":"junior-required","difficulty":1,"what":"Запускать сборку, проверки и упаковку документированными командами.","know":"CMake build, CTest, exit codes, корректная остановка при ошибке и отсутствие скрытых локальных настроек.","why":"Автоматизация уменьшает число ручных ошибок и делает проверку одинаковой для всех.","practice":"Создай единый проверяемый сценарий configure/build/test; намеренно сломай тест и убедись, что сценарий завершается ошибкой.","prereq":["delivery-readme","build-cmake"]},{"id":"delivery-formatting","title":"Автоформатирование и статический анализ","stage":2,"tier":"junior-required","difficulty":1,"what":"Подключить clang-format и выбранные проверки clang-tidy.","know":"Различие оформления и поиска дефектов, compilation database, целевые suppression и постепенное включение проверок.","why":"Снимает часть споров в review и помогает замечать повторяющиеся ошибки автоматически.","practice":"Добавь конфигурации clang-format и clang-tidy; исправь значимые предупреждения без массового подавления.","prereq":["build-warnings"]},{"id":"delivery-ci","title":"CI на GitHub Actions","stage":2,"tier":"junior-required","difficulty":1,"what":"Проверять каждое изменение в чистом автоматическом окружении.","know":"Workflow, jobs, steps, checkout, configure/build/test, artifacts и triggers; доступность secrets в разных контекстах.","why":"CI ловит отсутствие зависимостей и регрессии до интеграции изменения.","practice":"Добавь GitHub Actions workflow со сборкой и CTest; открой учебный PR с падающим тестом и убедись, что проверка блокирует принятие.","prereq":["delivery-automation","git-branches"]},{"id":"delivery-matrix","title":"Матрица платформ и компиляторов","stage":3,"tier":"junior-plus","difficulty":2,"what":"Проверять переносимость целевых конфигураций без лишнего дублирования.","know":"GCC, Clang и MSVC по необходимости; Linux/Windows, Debug/Release, sanitizer jobs и стоимость матрицы.","why":"Успех на одном compiler не доказывает переносимость или отсутствие UB.","practice":"Настрой минимум две обоснованные конфигурации CI; устрани зависимость от конкретного пути, типа long или поведения компилятора.","prereq":["delivery-ci","build-configurations"]},{"id":"delivery-releases","title":"Версии, релизы и артефакты","stage":3,"tier":"junior-plus","difficulty":1,"what":"Доставлять пользователю проверенный бинарный результат.","know":"Version tags, changelog, release assets, лицензии зависимостей, checksums и соответствие артефакта исходному commit.","why":"Пользователь должен понимать, что запускает и как вернуться к предыдущей версии.","practice":"Подготовь архив релиза с executable, нужными библиотеками и инструкцией; проверь запуск на чистой машине целевой платформы.","prereq":["delivery-ci","build-libraries"]},{"id":"delivery-observability","title":"Логи и наблюдаемость","stage":4,"tier":"middle-required","difficulty":2,"what":"Добавлять данные, по которым можно понять поведение работающей системы.","know":"Уровни логов, структурированные поля, correlation ID, latency histograms, ошибки, saturation и стоимость диагностики.","why":"Без наблюдаемости эксплуатационный сбой превращается в догадки.","practice":"Добавь счетчики запросов, ошибок и времени обработки; по логам восстанови путь одной операции, не записывая секреты.","prereq":["delivery-readme","debugging-logic"]},{"id":"delivery-configuration","title":"Конфигурация и корректное завершение","stage":4,"tier":"middle-required","difficulty":2,"what":"Проектировать предсказуемый запуск, остановку и настройки приложения.","know":"Порядок источников конфигурации, validation, defaults, signal handling, resource cleanup, draining и bounded shutdown.","why":"Надежность включает поведение до первого запроса и после команды остановки.","practice":"Проверь ошибочную конфигурацию, остановку под нагрузкой и повторный запуск; принятые данные не должны незаметно теряться.","prereq":["delivery-observability","testing-errors"]},{"id":"delivery-operations","title":"Выкладка, миграция и откат","stage":5,"tier":"senior-required","difficulty":3,"what":"Планировать изменение с учетом частичного обновления и отказа.","know":"Backward-compatible rollout, health checks, staged deployment, rollback constraints, миграция данных и проверка после запуска.","why":"Быстрый откат кода не помогает, если новый формат данных уже несовместим со старой версией.","practice":"Смоделируй обновление сервиса и данных двумя версиями; проверь совместимость, критерии остановки выкладки и восстановление.","prereq":["delivery-releases","delivery-observability","architecture-compatibility"]},{"id":"delivery-ownership","title":"Ответственность за жизненный цикл продукта","stage":6,"tier":"senior-required","difficulty":3,"what":"Связывать разработку, эксплуатацию и дальнейшую поддержку.","know":"Service objectives, risk ownership, capacity planning, runbooks, стоимость поддержки и обратная связь из инцидентов.","why":"Успех измеряется устойчивой работой и понятностью системы для команды.","practice":"Создай runbook для типового отказа, определи показатели надежности и проведи учебный запуск с проверкой восстановления.","prereq":["delivery-operations","debugging-incidents","architecture-evolution"]}]},{"id":"security","title":"Безопасность и устойчивость","summary":"Безопасная обработка ввода, владение ресурсами, зависимости, границы доверия и устранение уязвимостей.","stage":2,"track":"design","prereq":["pointers","raii","errors"],"mini":["Какие входы программы считаются недоверенными и какие у них ограничения?","Почему проверка пути до открытия файла может быть недостаточной?","Какие секреты могут попасть в логи, дампы или историю Git?","Как доказать, что найденная уязвимость действительно применима к проекту?"],"practice":["Добавь лимиты размера, вложенности и времени обработки внешних данных.","Проверь парсер под fuzzing и sanitizers.","Составь схему границ доверия и конкретные abuse cases.","Подготовь учебное исправление с регрессионным тестом и проверкой аналогичных мест."],"skills":[{"id":"security-input","title":"Недоверенный ввод и границы","stage":2,"tier":"junior-required","difficulty":1,"what":"Проверять данные на границе программы до выполнения опасной операции.","know":"Размеры, диапазоны, формат, encoding, допустимые символы и различие syntax validation от проверки смысла.","why":"Файл или сетевой ответ не обязан соответствовать ожиданиям автора программы.","practice":"Ограничь размер строки и число элементов при чтении; проверь пустой, слишком большой и поврежденный ввод.","prereq":["testing-cases"]},{"id":"security-memory","title":"Безопасность памяти как дисциплина","stage":2,"tier":"junior-required","difficulty":2,"what":"Снижать риск выхода за границы и неверного lifetime конструкцией кода.","know":"RAII, bounds checking, container invalidation, integer overflow при расчете буфера; smart pointer не решает все ошибки времени жизни.","why":"C++ допускает низкоуровневый доступ, поэтому корректность границ и владения требует явного внимания.","practice":"Перепиши ручное выделение буфера на контейнер с понятными границами; проверь переполнение расчета размера и прогон ASan.","prereq":["security-input","debugging-undefined","raii-basic","stl-invalidation"]},{"id":"security-parsers","title":"Устойчивые парсеры и протоколы","stage":4,"tier":"middle-required","difficulty":2,"what":"Обрабатывать частичный и некорректный ввод с ограничением затрат.","know":"Длины полей, вложенность, limits, endian, checked arithmetic, incremental parsing и сохранение состояния при ошибке.","why":"Парсер может отказать по памяти или времени даже без нарушения безопасности памяти.","practice":"Напиши парсер небольшого бинарного формата с лимитами; проверь обрезанные поля, огромные длины и избыточную вложенность через fuzzing.","prereq":["security-memory","testing-fuzzing"]},{"id":"security-paths","title":"Пути, файлы и опасные команды","stage":3,"tier":"middle-required","difficulty":2,"what":"Ограничивать файловые операции разрешенной областью и избегать shell injection.","know":"Path traversal, normalization limits, symbolic links, TOCTOU, разделение аргументов команды и данных пользователя.","why":"Проверка одной строки пути не всегда гарантирует безопасность последующей операции.","practice":"Разработай безопасную загрузку файлов в выделенный каталог; проверь ../, абсолютный путь и замену символической ссылки, документируя платформенные гарантии.","prereq":["security-input","git-linux"]},{"id":"security-secrets","title":"Секреты и чувствительные данные","stage":2,"tier":"junior-required","difficulty":1,"what":"Не помещать credentials в код, историю Git и диагностические сообщения.","know":"Environment/configuration providers по контексту, минимизация доступа, redaction, rotation после утечки и ограничение содержимого crash dumps.","why":"Удаление секрета из последнего commit не отменяет его компрометацию.","practice":"Добавь конфигурацию с примером без реальных credentials; проверь, что ошибки и логи маскируют чувствительные поля.","prereq":["git-model"]},{"id":"security-dependencies","title":"Риски зависимостей","stage":4,"tier":"middle-required","difficulty":2,"what":"Учитывать происхождение, обновления и уязвимости стороннего кода.","know":"Pinning, trusted sources, advisories, transitive dependencies, проверка применимости уязвимости и приоритет исправления.","why":"Уязвимость может появиться в библиотеке, которую проект напрямую не подключал.","practice":"Составь список прямых и косвенных библиотек; для учебного advisory определи достижимость опасного кода и план обновления.","prereq":["build-reproducibility"]},{"id":"security-privileges","title":"Минимальные права и изоляция","stage":4,"tier":"middle-required","difficulty":2,"what":"Снижать последствия ошибки ограничением возможностей процесса.","know":"Least privilege, отдельные учетные записи, доступ к каталогам и сети, sandboxing по платформе, resource limits.","why":"Исправный парсер полезен, но дополнительная граница ограничивает ущерб при неизвестном дефекте.","practice":"Запусти учебный обработчик файлов без прав администратора с ограниченным каталогом и лимитом ресурсов; проверь ожидаемые отказы.","prereq":["security-paths","git-linux"]},{"id":"security-crypto","title":"Применение готовой криптографии","stage":4,"tier":"specialization","difficulty":2,"what":"Использовать проверенные библиотеки и защищенные протоколы без самостоятельного создания алгоритмов.","know":"TLS verification, secure random, authenticated encryption по задаче, key management; hashing не равен encryption.","why":"Большая часть ошибок возникает в настройке и обращении с ключами, даже при правильном алгоритме.","practice":"Настрой TLS-клиент с проверкой сертификата и hostname; проверь отказ для недоверенного сертификата без отключения проверки.","prereq":["security-secrets","security-dependencies"]},{"id":"security-threats","title":"Модель угроз и secure design","stage":5,"tier":"senior-required","difficulty":3,"what":"Анализировать активы, входы, границы доверия и возможные злоупотребления.","know":"Attack surface, trust boundary, abuse cases, ограничения CPU/memory и защита от denial of service на уровне приложения.","why":"Позволяет направить защитные меры на реальные сценарии, а не на случайный список правил.","practice":"Нарисуй поток данных сервиса обработки файлов; для каждой границы укажи угрозу, защиту и проверяемый тест.","prereq":["security-parsers","security-privileges","architecture-tradeoffs"]},{"id":"security-response","title":"Исправление уязвимостей и профилактика","stage":6,"tier":"senior-required","difficulty":3,"what":"Организовывать проверяемое устранение класса опасных ошибок.","know":"Воспроизведение в изолированной среде, оценка затронутых версий, regression tests, безопасное обновление и анализ похожих мест.","why":"Одно исправление должно сопровождаться пониманием масштаба и защитой от повторения.","practice":"На учебном дефекте подготовь patch, тест, список затронутых версий и план выпуска; найди аналогичный риск в соседних модулях.","prereq":["security-threats","delivery-operations","testing-strategy"]}]},{"id":"projects","title":"Проекты и доказательства навыка","summary":"16 законченных работ: от первого CLI до миграции legacy-системы и сопровождения надежного сервиса. Проект засчитывается по критериям, а не по факту наличия кода. Проекты — варианты практики: выбирайте подходящие своему направлению, выполнять все подряд не требуется.","stage":0,"track":"design","prereq":["core"],"mini":["Может ли другой человек собрать, запустить и проверить проект по README?","Какие сбои и ограничения показаны тестами, а какие только заявлены?","Какой инженерный навык доказывает выбранный проект?","Какая независимая обратная связь привела к улучшению решения?"],"practice":["Выбери проект своего этапа и заранее запиши критерии приемки.","Сохраняй README, тесты, результаты измерений и принятые решения рядом с кодом.","Дай проект другому человеку для запуска и review; исправь обнаруженные проблемы.","Засчитывай навык после самостоятельного изменения требований и устранения нового дефекта."],"skills":[{"id":"projects-first-cli","title":"Проект 01 · Первая консольная программа","stage":0,"tier":"specialization","difficulty":0,"what":"Собрать и запустить программу, которая спрашивает имя и печатает персональное приветствие.","know":"main, cout/cin или getline, строка, команда запуска, отличия исходника и executable.","why":"Закрепляет полный цикл: написать → собрать → запустить → изменить → проверить.","practice":"Критерии готовности: программа собирается из чистого каталога; имя с пробелами читается целиком; пустая строка обрабатывается явно; README содержит точную команду.","prereq":["build-commands","core-io"]},{"id":"projects-calculator","title":"Проект 02 · Калькулятор с проверкой ввода","stage":1,"tier":"specialization","difficulty":0,"what":"Реализовать повторяющийся ввод арифметической операции и двух чисел.","know":"Условия, циклы, функции, числа, корректное завершение ввода и обработка деления на ноль.","why":"Проверяет понимание управления потоком и отделение вычисления от диалога с пользователем.","practice":"Критерии готовности: четыре операции, повторный ввод, неизвестная команда и некорректное число не ломают цикл; вычисления вынесены в функции; есть таблица минимум из 12 проверок.","prereq":["projects-first-cli","testing-cases","core-functions"]},{"id":"projects-text-stats","title":"Проект 03 · Анализатор текста","stage":1,"tier":"specialization","difficulty":1,"what":"Посчитать строки, слова и частоты выбранных символов в текстовом файле.","know":"string, vector, циклы, функции, file streams; четко выбранное определение слова и ограничение ASCII либо выбранной кодировки.","why":"Показывает умение преобразовать задачу в алгоритм с понятными правилами и краевыми случаями.","practice":"Критерии готовности: пустой файл, пробельные строки и ошибка открытия обработаны; правила подсчета описаны; результат для контрольного файла проверен вручную; большие файлы не читаются без необходимости целиком.","prereq":["projects-calculator","git-model","stl-string","stl-vector"]},{"id":"projects-tasks","title":"Проект 04 · Консольный список задач","stage":1,"tier":"specialization","difficulty":1,"what":"Создать приложение с добавлением, просмотром, завершением и удалением задач.","know":"Структуры, vector, стабильный идентификатор, поиск элемента, разделение UI и данных.","why":"Тренирует хранение состояния и изменения коллекции без запутывания логики ввода.","practice":"Критерии готовности: удаление не меняет идентификаторы оставшихся задач; неизвестный ID дает понятную ошибку; пустой список работает; операции вынесены из пользовательского меню.","prereq":["projects-calculator","architecture-readability","stl-vector","types-aggregate"]},{"id":"projects-contacts","title":"Проект 05 · Адресная книга с сохранением","stage":2,"tier":"specialization","difficulty":1,"what":"Развить CRUD-приложение с файлами и отдельной библиотекой логики.","know":"Классы, инварианты, standard containers, RAII, обработка ошибок чтения и записи, unit tests.","why":"Проверяет набор повседневных навыков начинающего C++ разработчика в одном законченном продукте.","practice":"Критерии готовности: поиск и изменение контактов; сохранение и загрузка; поврежденный файл не теряет исходные данные; библиотека и CLI собираются CMake; не менее 15 содержательных GoogleTest cases; CI зеленый.","prereq":["projects-tasks","build-cmake","testing-googletest","architecture-invariants","delivery-ci","serialization-streams","stl-algorithms"]},{"id":"projects-csv","title":"Проект 06 · Анализатор табличных данных","stage":2,"tier":"specialization","difficulty":2,"what":"Построить CLI для чтения CSV по явно заданному подмножеству формата, фильтрации и агрегирования.","know":"Парсинг, quoting по спецификации проекта, преобразование чисел, сортировка, map/unordered_map, сообщения об ошибках со строкой и столбцом.","why":"Учит обращаться с реальными неоднородными данными и формулировать границы поддержки.","practice":"Критерии готовности: фильтр и группировка работают; кавычки и разделители проверены; неверные строки диагностируются; ограничения формата документированы; тесты покрывают пустые поля и overflow.","prereq":["projects-text-stats","security-input","testing-googletest","serialization-model"]},{"id":"projects-library","title":"Проект 07 · Повторно используемая библиотека","stage":2,"tier":"specialization","difficulty":2,"what":"Выделить из предыдущего проекта небольшую библиотеку с публичным API и примером потребителя.","know":"Header/source separation, const-correctness, value semantics, lifetime, CMake target и external consumer.","why":"Проверяет, способен ли разработчик создавать код, которым сможет пользоваться другой человек.","practice":"Критерии готовности: публичные заголовки самодостаточны; нет путей к машине автора; API документирует ошибки и владение; отдельное приложение подключает библиотеку; Debug и Release проходят тесты.","prereq":["projects-contacts","architecture-ownership","build-packages","raii-rulezero"]},{"id":"projects-algolab","title":"Проект 08 · Лаборатория алгоритмов и контейнеров","stage":4,"tier":"specialization","difficulty":2,"what":"Сравнить несколько способов решения одной задачи и объяснить различия.","know":"Big O, locality, allocations, vector/list/map/unordered_map по задаче, корректный benchmark и распределение входов.","why":"Связывает теорию алгоритмов с реальными свойствами памяти и workload.","practice":"Критерии готовности: одинаковый результат всех реализаций; входы разных размеров и распределений; Release measurements повторяются; отчет отделяет выводы от предположений и не объявляет один контейнер лучшим всегда.","prereq":["testing-benchmarks","testing-property","algorithms-tradeoffs","structures-choice"]},{"id":"projects-indexer","title":"Проект 09 · Индексатор файлов","stage":3,"tier":"specialization","difficulty":2,"what":"Создать индекс содержимого каталога с поиском и обновлением измененных файлов.","know":"filesystem, ошибки доступа, hash/index, разделение чтения и обработки, лимиты ресурсов и диагностика.","why":"Добавляет реальные ограничения файловой системы и постепенное усложнение архитектуры.","practice":"Критерии готовности: недоступный файл не останавливает все задание; поведение symbolic links явно задано; повторный запуск корректно обновляет индекс; есть integration tests и измерение памяти на большом каталоге.","prereq":["projects-csv","testing-integration","security-paths","architecture-encapsulation","serialization-filesystem","stl-unordered"]},{"id":"projects-http-client","title":"Проект 10 · Надежный HTTP-клиент","stage":4,"tier":"specialization","difficulty":2,"what":"Написать клиент поверх готовой библиотеки с ограничениями времени и размера ответа.","know":"HTTP status, TLS verification, timeout, cancellation, retry policy, backoff, идемпотентность и управление ресурсами.","why":"Проверяет работу с ненадежной внешней системой без самописной криптографии и протокольных догадок.","practice":"Критерии готовности: проверка сертификата включена; различаются network error и HTTP error; retry ограничен и учитывает идемпотентность; тестовый сервер моделирует зависание, обрыв и большой ответ; секреты не попадают в логи.","prereq":["security-input","testing-doubles","testing-errors","delivery-observability","networking-http","networking-timeouts"]},{"id":"projects-queue","title":"Проект 11 · Worker pool с ограниченной очередью","stage":4,"tier":"specialization","difficulty":3,"what":"Реализовать несколько worker threads, принимающих и выполняющих задачи.","know":"mutex, condition_variable, atomic по необходимости, bounded queue, backpressure, cancellation и shutdown.","why":"Проверяет владение данными и полный жизненный цикл конкурентного компонента.","practice":"Критерии готовности: нет busy waiting; queue имеет лимит; закрытие явно определяет судьбу принятых задач; исключение одной задачи не убивает pool; тесты и TSan в поддерживаемой конфигурации не выявляют дефектов.","prereq":["architecture-concurrency","testing-concurrent","concurrency-cv","concurrency-jthread"]},{"id":"projects-kv-store","title":"Проект 12 · Локальное key-value хранилище","stage":4,"tier":"specialization","difficulty":3,"what":"Создать небольшое хранилище с восстановлением после прерывания записи.","know":"Формат данных, atomic replace по платформе, durability assumptions, журнал или snapshot, checksum и versioning.","why":"Показывает понимание отказов и границ гарантий, которые нельзя проверить только успешным запуском.","practice":"Критерии готовности: put/get/delete; явно заявленная модель durability; повреждение обнаруживается; набор fault-injection tests прерывает запись на разных этапах; восстановление не выдает поврежденные данные как корректные.","prereq":["testing-errors","security-parsers","architecture-api","serialization-schema","serialization-atomic-save"]},{"id":"projects-performance","title":"Проект 13 · Ускорение реальной горячей операции","stage":5,"tier":"specialization","difficulty":3,"what":"Найти bottleneck в существующем проекте и улучшить его без изменения результата.","know":"Representative workload, profiler, CPU/cache/allocations, latency percentiles, baseline и проверка корректности.","why":"Подтверждает способность оптимизировать измеренную проблему, а не переписывать код ради предполагаемой скорости.","practice":"Критерии готовности: зафиксирован baseline; profiler указывает bottleneck; одно изменение дает повторяемое улучшение на целевом workload; память и хвостовая latency не ухудшены незаметно; опубликованы ограничения результата.","prereq":["projects-algolab","testing-benchmarks","delivery-observability","performance-profiler","performance-complexity"]},{"id":"projects-plugins","title":"Проект 14 · Приложение с подключаемыми модулями","stage":5,"tier":"specialization","difficulty":3,"what":"Спроектировать систему plugins с управляемым жизненным циклом.","know":"Shared libraries, C-compatible boundary где уместно, ABI, version negotiation, ownership across boundary и безопасное завершение.","why":"Проверяет понимание бинарных границ и рисков расширяемой архитектуры.","practice":"Критерии готовности: несовместимый plugin отклоняется с объяснением; ресурсы освобождаются правильной стороной; callbacks не используются после завершения модуля; есть тест совместимости и документированные ограничения выгрузки.","prereq":["build-libraries","architecture-compatibility","architecture-ownership","internals-abi"]},{"id":"projects-legacy","title":"Проект 15 · Миграция legacy-модуля","stage":5,"tier":"specialization","difficulty":3,"what":"Взять существующий сложный модуль и изменить архитектуру без остановки его потребителей.","know":"Исследование неизвестного кода, characterization tests, migration seams, старое/новое поведение, incremental rollout и rollback.","why":"Дает более реалистичное доказательство инженерной зрелости, чем только написание нового проекта с нуля.","practice":"Критерии готовности: карта зависимостей и известных рисков; защитные тесты; несколько reviewable changes; сохраненная совместимость; измеримое снижение конкретной сложности; план возврата и объяснение оставшегося долга.","prereq":["architecture-legacy","git-changes","testing-integration"]},{"id":"projects-service","title":"Проект 16 · Сервис с полным жизненным циклом","stage":6,"tier":"specialization","difficulty":3,"what":"Спроектировать, проверить и сопровождать небольшой C++ сервис с реалистичными сбоями и ограничениями.","know":"Архитектурные требования, bounded concurrency, observability, fault injection, security boundaries, rollout и управление техническим риском.","why":"Объединяет реализацию, эксплуатацию, развитие и коммуникацию; сам по себе учебный сервис не заменяет командный опыт Senior.","practice":"Критерии готовности: согласованы latency/load/resource objectives; есть API contract, ADR и модель угроз; доказано восстановление после отказа; есть CI, релиз, runbook и rollback; независимый review; проведен учебный инцидент с последующим улучшением.","prereq":["delivery-ownership","security-threats","architecture-evolution","debugging-incidents","projects-queue","networking-backpressure","performance-strategy"]},{"id":"projects-qt","title":"Проект 17 · Приложение на Qt","stage":3,"tier":"specialization","difficulty":1,"what":"Настольное приложение для выбранного GUI-направления: список задач или адресная книга.","know":"Widgets либо QML, signals/slots, модель данных, event loop, правила владения QObject и отделение интерфейса от логики.","why":"Позволяет применить C++ в интерактивном продукте и освоить стороннюю платформу.","practice":"Сделайте добавление, поиск и сохранение записей; покройте модель тестами, не блокируйте интерфейс долгой работой, подготовьте запуск на чистой машине.","prereq":["oop-interfaces","serialization-json","testing-unit","build-packages"]}]},{"id":"serialization","title":"Файлы, сериализация и JSON","summary":"Как безопасно читать и сохранять данные, описывать формат и сохранять совместимость версий. Данные на диске и в сети требуют явного контракта.","stage":2,"track":"tools","prereq":["core","stl","errors"],"mini":["Чем представление объекта в памяти отличается от формата файла?","Как отличить конец файла от ошибки чтения?","Почему нельзя сохранять структуру с указателями простым копированием байтов?","Что произойдёт, если старая версия программы откроет новый формат?"],"practice":["Сохраните список задач в JSON и восстановите его после перезапуска.","Проверьте пустой, усечённый и неверно закодированный файл.","Добавьте версию формата и миграцию старых данных.","Докажите тестом, что сбой записи не уничтожает старую копию."],"skills":[{"id":"serialization-streams","title":"Файловые потоки: std::ifstream и std::ofstream","stage":1,"tier":"junior-required","difficulty":0,"what":"Чтение и запись файлов через объекты, управляющие файловым ресурсом.","know":"Открытие и закрытие, состояние потока, getline, текстовый и двоичный режимы; проверка результата чтения, записи и закрытия.","why":"Большинству прикладных программ нужно сохранять результаты и обрабатывать файлы.","practice":"Прочитайте числа из файла: отличите отсутствие файла, пустой файл и ошибочную строку.","prereq":["stl-string","pointers-lifetime"]},{"id":"serialization-filesystem","title":"Пути и каталоги: std::filesystem","stage":3,"tier":"junior-plus","difficulty":1,"what":"Стандартная библиотека для работы с путями и файловой системой, доступная с C++17.","know":"path, directory_iterator, existence, error_code, права доступа и различие логического пути и реального объекта.","why":"Позволяет писать переносимые файловые утилиты без ручного склеивания разделителей.","practice":"Выведите размер файлов каталога, обработав отсутствие доступа и исчезновение файла во время обхода.","prereq":["serialization-streams","errors-errorcode"]},{"id":"serialization-model","title":"Сериализация и контракт данных","stage":2,"tier":"junior-required","difficulty":1,"what":"Преобразование значений программы в согласованный формат и обратно.","know":"Поля, типы, обязательность, единицы измерения, отделение внутренней модели от формата хранения.","why":"Формат становится интерфейсом между версиями программы и потребителями данных.","practice":"Опишите формат контакта и выполните round-trip тест: объект → файл → равнозначный объект.","prereq":["types-aggregate","serialization-streams"]},{"id":"serialization-json","title":"JSON и библиотека nlohmann/json","stage":2,"tier":"junior-plus","difficulty":1,"what":"Текстовый формат обмена данными; JSON не является встроенным типом C++.","know":"Объекты, массивы, строки, числа, null; чтение через библиотеку, проверка наличия полей, типов и диапазонов.","why":"Помогает работать с настройками, HTTP API и простыми файлами данных.","practice":"Сохраните ToDo в JSON: неизвестные поля разрешите, неверный тип обязательного поля отклоните.","prereq":["serialization-model","stl-vector","build-packages"]},{"id":"serialization-unicode","title":"Unicode и UTF-8 в данных","stage":3,"tier":"junior-plus","difficulty":1,"what":"Различие байтового представления, кодовых точек и видимых пользователю символов.","know":"UTF-8 переменной длины; size строки считает байты; ошибки кодировки, нормализация и готовые библиотеки обработки текста.","why":"Русские имена и пути делают ошибочные предположения об одном байте на символ особенно заметными.","practice":"Проверьте сохранение и загрузку русского текста, эмодзи и повреждённой UTF-8 последовательности.","prereq":["types-characters","stl-string"]},{"id":"serialization-schema","title":"Схемы и эволюция формата","stage":4,"tier":"middle-required","difficulty":2,"what":"Правила изменения структуры данных при сохранении работы старых потребителей.","know":"Версия формата, значения по умолчанию, добавление и удаление полей, прямые и обратные миграции.","why":"Изменение класса не должно незаметно повреждать существующие файлы пользователей.","practice":"Добавьте поле приоритета задач и тесты загрузки документов двух предыдущих версий.","prereq":["serialization-model","testing-integration"]},{"id":"serialization-binary","title":"Двоичные форматы и endianness","stage":4,"tier":"specialization","difficulty":2,"what":"Компактное кодирование значений по явно определённым правилам.","know":"Порядок байтов, фиксированные размеры, varint, пределы длины, совместимость и инструменты вроде Protocol Buffers.","why":"Нужно для протоколов, больших объёмов данных и взаимодействия с другими языками.","practice":"Опишите и прочитайте заголовок бинарного файла без reinterpret_cast на произвольную структуру.","prereq":["serialization-model","internals-alignment","security-input"]},{"id":"serialization-atomic-save","title":"Надёжная запись и восстановление","stage":4,"tier":"middle-required","difficulty":2,"what":"Проектирование записи так, чтобы сбой не оставлял единственную повреждённую копию.","know":"Временный файл, проверка записи, замена, права, резервная копия; атомарность rename и гарантия сохранения на носителе зависят от ОС и файловой системы.","why":"Предотвращает потерю данных при аварии, нехватке места или остановке программы.","practice":"Имитируйте ошибку записи и проверьте, что старые данные доступны; отдельно опишите границы гарантий ОС.","prereq":["serialization-streams","testing-errors","os-syscalls"]}]}],"checkpoints":[{"id":"start","title":"C++ Beginner · с нуля","stage":0,"description":"Первая точка маршрута. Цель — научиться запускать код, понимать ввод и вывод и проверять результат маленькими экспериментами.","know":["Что такое исходный файл, компилятор, программа и ошибка.","Как сохранять файлы проекта и запускать программу из выбранной среды."],"can":["Собрать и запустить Hello, world.","Изменить программу, прочитать простую ошибку компиляции и исправить её."],"projects":["Конвертер единиц с вводом из консоли."],"tasks":["Повторить сборку и запуск без пошаговой инструкции."],"beforeNext":["Переменные и типы.","Условия, циклы, простые функции."],"hardSkills":[{"area":"Первая программа","items":["main, #include, std::cout, std::cin.","Сохранение, сборка и запуск."]}],"evidence":["Самостоятельно создал новый проект и объяснил каждую строку маленькой программы."]},{"id":"beginner","title":"Beginner · основы","stage":1,"description":"Вы умеете разложить небольшую задачу на функции и работать с данными в готовых безопасных контейнерах.","know":["Область видимости, время жизни, значения и ссылки.","Условия, циклы, функции, std::string и std::vector на базовом уровне."],"can":["Проверять входные данные и крайние случаи.","Использовать отладчик для пошагового выполнения."],"projects":["Калькулятор с обработкой некорректного ввода.","Консольная ToDo-программа с хранением задач в памяти."],"tasks":["Найти ошибку границы цикла.","Разбить длинную функцию на понятные операции."],"beforeNext":["Владение ресурсами и RAII.","Базовые STL, Git, сборка и тесты."],"hardSkills":[{"area":"Язык","items":["Функции, структуры, простые контейнеры, const."]},{"area":"Практика","items":["Пошаговая отладка, тестирование обычных и граничных входных данных."]}],"evidence":["Написал программу из нескольких функций без копирования готового решения.","Показал тесты пустого ввода, неверных данных и границ."]},{"id":"junior","title":"Контрольная точка · Junior C++","stage":2,"description":"Готовность к первой рабочей роли означает способность самостоятельно сделать небольшое понятное изменение, проверить его и объяснить. Эта точка оценивает базу; требования конкретной команды и специализации могут отличаться.","know":["Как программа проходит preprocessing, compilation и linking; чем compile error отличается от linker error и runtime failure.","Основные типы, преобразования, const, условия, циклы, функции, overloads, области видимости и время жизни локальных объектов.","Различие value, reference и pointer; stack/heap как практическую модель; dangling pointer, nullptr и базовые причины UB.","Классы, инварианты, конструкторы, деструкторы, RAII, unique_ptr; почему new/delete обычно скрывают внутри владельца ресурса.","string, vector, array, map/unordered_map по типовым задачам; итераторы, основные algorithms и опасность invalidation.","Понятие сложности O(n), O(log n), O(n log n); компромисс между поиском, вставкой, памятью и порядком элементов.","Базовую модель Git, target-based CMake, unit tests и основные инструменты debugger; контракт ошибки должен быть понятен вызывающему коду."],"can":["По небольшому требованию выделить функции и данные, реализовать решение без копирования готового проекта и объяснить каждый существенный фрагмент.","Собрать проект из нескольких .cpp, создать библиотеку и executable в CMake, подключить одну зависимость и повторить сборку из чистого checkout.","Использовать standard containers и algorithms вместо лишнего ручного управления памятью; обосновать передачу значения или ссылки.","Прочитать незнакомую функцию, проследить ее вызовы и сделать небольшую правку, сохранив существующий контракт.","Воспроизвести crash, найти нужный кадр стека, проверить переменные и исправить простую ошибку lifetime или выхода за границы.","Написать содержательные GoogleTest cases для основного поведения, границ и ошибок; добавить regression test на найденный дефект.","Создать ветку и небольшой PR с понятным описанием, разрешить простой конфликт и спокойно обработать замечания review."],"projects":["Адресная книга или менеджер задач с сохранением, библиотекой логики, CMake, GoogleTest и CI; не просто один файл с меню.","Анализатор текста или CSV с описанным форматом, диагностикой неверного ввода и ограничением размера данных.","Одна небольшая библиотека с примером отдельного потребителя и явными правилами владения."],"tasks":["Исправить use-after-free или iterator invalidation в коротком примере, показать отчет sanitizer и добавить проверку от повторения.","Реализовать обработку файла с подсчетом и сортировкой данных; объяснить сложность по времени и памяти.","Изменить существующий API вместе с вызывающим кодом и тестами, сохранив понятные ошибки.","Подключить GoogleTest к CMake-проекту и добиться выполнения тестов в чистом CI.","За ограниченное время прочитать небольшой чужой модуль, объяснить поток данных и внести одну проверяемую правку."],"beforeNext":["Научиться регулярно работать с существующим кодом, а не только начинать проекты с пустого файла.","Углубить copy/move semantics, exception safety, iterator invalidation и работу non-owning views.","Освоить интеграционные проверки, отладку гипотезами и анализ причин медленной работы.","Изучить основы ОС, сетей и concurrency настолько, насколько этого требуют реальные задачи выбранной области.","Собирать обратную связь по PR и устранять повторяющиеся замечания; автоматизировать типовые проверки."],"hardSkills":[{"area":"Язык C++","items":["Типы, функции, const, references, pointers, scope и lifetime.","Классы, базовая инкапсуляция, конструктор/деструктор, основы copy/move.","RAII и unique_ptr; распознавание основных случаев UB."]},{"area":"STL и алгоритмы","items":["string, vector, associative containers и выбор по операции.","Итераторы, базовые algorithms и правила invalidation.","Big O для поиска, сортировки и прохода по данным."]},{"area":"Инструменты","items":["Компилятор, warnings, Debug/Release и CMake targets.","Git: branch, commit, diff, merge и PR.","Debugger, ASan/UBSan на поддерживаемой платформе."]},{"area":"Качество и практика","items":["GoogleTest, границы и регрессионные проверки.","Проверка ввода, обработка ошибок и документированные ограничения.","README, чистая сборка, CI и небольшой законченный проект."]}],"evidence":["Другой человек собирает и запускает один из проектов по README без личных подсказок автора.","Автор самостоятельно меняет требование и обновляет реализацию с тестами; способен объяснить решение без чтения сгенерированного текста.","Есть хотя бы один разбор найденной ошибки: воспроизведение, причина, исправление и regression test.","CI проверяет сборку и тесты, а локальная проверка sanitizers не показывает известных ошибок на проверенных сценариях.","Независимый review подтверждает понятность кода и отсутствие критических пробелов в базовом владении ресурсами."]},{"id":"junior-plus","title":"Junior+ · самостоятельность","stage":3,"description":"Переход от задач с подробным планом к самостоятельному изменению небольшого компонента. Это учебный ориентир, а не универсальная должность.","know":["Перемещение, гарантии исключений, простые шаблоны.","Зависимости целей CMake, тестовые фикстуры и диагностика памяти."],"can":["Читать чужой код и найти место изменения.","Подготовить небольшой PR с тестами и объяснением решения."],"projects":["Библиотека парсинга с тестами и CI.","Qt-приложение или небольшой сетевой сервис — по выбранному направлению."],"tasks":["Исправить утечку, добавить регрессионный тест.","Обновить зависимость и проверить совместимость."],"beforeNext":["Системная модель ОС и памяти.","Конкурентность и обработка ошибок на границах компонентов.","Самостоятельное проектирование и проверка небольшого сервиса."],"hardSkills":[{"area":"Язык и инструменты","items":["Move semantics, templates, sanitizers, CMake targets."]},{"area":"Работа в команде","items":["Git PR, code review, воспроизводимое описание ошибки."]}],"evidence":["Изменил компонент по описанию поведения, без готового плана реализации.","Защитил выбор решения на code review."]},{"id":"middle","title":"Контрольная точка · Middle C++","stage":4,"description":"Middle самостоятельно доводит компонент или задачу средней сложности до результата: уточняет контракт, выбирает решение, проверяет ошибки и поддерживает его после интеграции. Оценка включает качество решений и самостоятельность, а не только объем изученного синтаксиса.","know":["Value semantics, Rule of Zero/Five по задаче, copy/move, lifetime temporaries, perfect forwarding на уровне чтения и применения, exception safety.","STL глубже типовых операций: allocator effects по необходимости, iterator categories, invalidation, ordered/unordered trade-offs и algorithm complexity.","Templates и constraints/concepts на уровне проектирования понятного generic API; стоимость усложнения шаблонной диагностики.","Модель памяти C++ на практическом уровне: data races, mutex, condition_variable, atomic basics, happens-before и безопасное завершение потоков.","Основы ОС: процессы, threads, virtual memory, files, blocking I/O; основы сети и хранения данных по выбранной области.","Разницу API/ABI, compile/link/load, виды библиотек, ограничения toolchain и управление зависимостями.","Принципы измерения performance: representative workload, profiler, allocations, locality и влияние оптимизации сборки.","Стратегии тестирования отказов, integration tests, property-based tests, fuzzing применимых парсеров и пределы покрытия."],"can":["Из неполного требования сформулировать контракт, границы ответственности и критерии приемки, указав неопределенности.","Спроектировать компонент с явным владением, стабильными инвариантами, понятными ошибками и тестируемыми зависимостями.","Реализовать конкурентный компонент с ограничением ресурсов, отменой и завершением; аргументировать синхронизацию.","Найти неочевидную ошибку через минимизацию, debugger, sanitizers и проверяемые гипотезы; не останавливаться на исчезновении симптома.","Измерить bottleneck, проверить гипотезу оптимизации и показать результат вместе с изменением памяти и tail latency, если они значимы.","Разбить изменение существующей системы на безопасные шаги, оценить совместимость и подготовить возврат к предыдущему поведению.","Настроить разумный CI, собрать артефакт релиза, добавить диагностические данные и проверить работу в целевом окружении.","Проводить review по correctness, lifetime, concurrency и контрактам; объяснять компромиссы с учетом сложности поддержки."],"projects":["Worker pool или многопоточный индексатор с ограниченной очередью, проверенными сценариями остановки и TSan там, где поддерживается.","Надежный HTTP-клиент либо локальное key-value хранилище с моделированием внешних отказов и понятной моделью гарантий.","Измеримое улучшение существующего проекта: profile до/после, защитные тесты и документированная цена решения."],"tasks":["Исправить редкую гонку или зависание по стекам и стресс-сценарию, затем сделать регрессионную проверку воспроизводимой.","Спроектировать API обработки задач с cancellation, ownership и error propagation; сравнить хотя бы две реализации границы.","Добавить новую возможность в незнакомый компонент, сохранив старые данные и существующих потребителей.","По профилю найти расход CPU или памяти и улучшить его без необоснованного усложнения остального кода.","Организовать отказ во время записи или внешнего запроса и доказать заявленные гарантии восстановления.","Отревьюить PR с subtle lifetime или concurrency defect и объяснить сценарий проявления."],"beforeNext":["Принимать решения на уровне нескольких компонентов и учитывать эксплуатацию, пользователей API и командную стоимость изменений.","Нарабатывать опыт сложных инцидентов, архитектурных миграций и безопасных изменений legacy-кода.","Углубить выбранную специализацию: high-performance, embedded, games, systems, backend или другую конкретную область.","Учиться вести ADR, обсуждать требования с разными участниками и заранее проверять наиболее рискованные предположения.","Помогать другим разработчикам расти через review, документацию и совместный разбор причин дефектов.","Оценивать успех по проверяемому эффекту для системы, а не по числу примененных patterns или языковых возможностей."],"hardSkills":[{"area":"Современный C++","items":["Copy/move и lifetime; RAII, exception safety и корректное применение views.","Templates, constraints/concepts и generic interfaces с разумной сложностью.","Контейнеры и algorithms с учетом invalidation, allocations и workload."]},{"area":"Concurrency и ОС","items":["Synchronization, data races, condition_variable, atomics по обоснованной задаче.","Backpressure, cancellation, graceful shutdown и ограниченные очереди.","Processes, threads, virtual memory и системный I/O в выбранной области."]},{"area":"Отладка и performance","items":["Debugger, dumps, sanitizers и расследование по гипотезам.","Profiler, benchmark methodology и воспроизводимые измерения.","Разделение корневой причины, симптома и ограничений имеющихся данных."]},{"area":"Проектирование","items":["Явное владение, контракты, cohesion и зависимости между модулями.","Безопасный refactoring и небольшие миграционные изменения.","API compatibility, обработка отказов и документация trade-offs."]},{"area":"Доставка и качество","items":["Integration, property и fault-injection tests по рискам.","CMake, зависимости, CI matrix и упаковка релиза.","Логи, метрики и диагностика поведения в целевом окружении."]}],"evidence":["Есть самостоятельно завершенный компонент с согласованными требованиями, тестами отказов и документированным API.","Есть расследование нетривиального дефекта с доказательством причины и защитой от повторения.","Хотя бы одна оптимизация подтверждена корректными измерениями и проверкой неизменности результата.","Изменение прошло независимый review и успешно встроено в существующую систему, а не работает только в отдельной демонстрации.","Разработчик объясняет альтернативы и ограничения решения, умеет сказать, какие гарантии пока не доказаны."]},{"id":"middle-plus","title":"Middle+ · системный взгляд","stage":5,"description":"Развитие от надёжной реализации компонента к решениям, затрагивающим систему, эксплуатацию и другие команды.","know":["Границы компонентов, стоимость зависимостей и эволюция API.","Профилирование, конкуренция за ресурсы и ограничения нагрузки."],"can":["Сравнивать варианты архитектуры по измеримым критериям.","Проводить безопасную миграцию без одномоментной переписи."],"projects":["Сервис с метриками, нагрузочным тестированием и планом восстановления.","Библиотека с политикой совместимости и проверкой потребителей."],"tasks":["Найти узкое место по профилю и проверить результат оптимизации.","Снизить технический долг с сохранением поведения."],"beforeNext":["Архитектурные компромиссы и управление рисками.","Работа с неопределённостью, инцидентами и техническими решениями команды."],"hardSkills":[{"area":"Системы","items":["Профилирование, конкурентность, наблюдаемость и отказоустойчивость."]},{"area":"Проектирование","items":["API, совместимость, технические решения и план миграции."]}],"evidence":["Сравнил минимум два решения и записал причины выбора.","Проверил изменение под нагрузкой и подготовил откат."]},{"id":"senior","title":"Контрольная точка · Senior C++","stage":6,"description":"Senior обеспечивает надежный результат в условиях неоднозначности, сложной системы и совместной работы. Нельзя получить этот уровень только завершением списка тем или одного учебного проекта: нужны подтвержденные решения, сопровождение и влияние на качество работы команды.","know":["Глубокие свойства C++ и toolchain в своей области: object lifetime, memory model, optimization, ABI и причины неочевидного UB.","Архитектурные последствия выбора данных, concurrency model, границ модулей, форматов и внешних зависимостей.","Поведение большой системы при перегрузке, частичном отказе, несовместимом обновлении, длительной работе и ограничении ресурсов.","Методы расследования производственных сбоев по неполным данным, требования к символам, telemetry и безопасному диагностическому коду.","Стратегии миграции legacy-систем, сохранения API/ABI/data compatibility и управления техническим долгом.","Безопасность по границам доверия, жизненному циклу зависимостей и обработке недоверенного ввода.","Стоимость тестирования, сборки, эксплуатации и изменений для команды; признаки избыточной архитектуры.","Глубокую специализацию своего домена; отсутствие необходимости быть экспертом одновременно во всех направлениях C++."],"can":["Перевести неоднозначную техническую или продуктовую задачу в проверяемые требования, варианты решения и поэтапный план.","Выявить наиболее дорогие риски, проверить их прототипом или измерением и объяснить решение заинтересованным участникам.","Спроектировать изменение нескольких компонентов с совместимостью промежуточных состояний, критериями выкладки и реалистичным rollback.","Руководить расследованием сложного сбоя: ограничить ущерб, распределить проверку гипотез, собрать доказательства и устранить системную причину.","Улучшить большой legacy-модуль без массового переписывания и потери поведения, которым уже пользуются другие команды.","Определить стратегию качества и наблюдаемости, соразмерную рискам и стоимости обратной связи.","Делать решения понятными через ADR, review и документацию; помогать коллегам самостоятельно решать более сложные задачи.","Оценивать результат после выпуска: надежность, производительность, сложность поддержки и влияние на работу команды."],"projects":["Миграция существующего модуля с несколькими потребителями: карта зависимостей, совместимые этапы, защитные проверки, выкладка и итоговая оценка.","Сервис или системный компонент с измеримыми требованиями, ограничением ресурсов, моделью отказов, наблюдаемостью и проверенным восстановлением.","Долгосрочное улучшение проекта: сокращение времени сборки, устранение класса ошибок, упрощение API или повышение надежности с доказанным эффектом."],"tasks":["Предложить два решения крупной задачи, сравнить риски и стоимость, проверить критическое предположение и оформить ADR.","Разобрать редкий crash в оптимизированной сборке по dump и telemetry, указать степень уверенности и предложить следующую диагностическую проверку.","Спланировать изменение бинарной границы или формата данных при неодновременном обновлении потребителей.","Провести учебный инцидент с восстановлением, разбором причин и действиями, которые изменяют систему, а не только инструкции людям.","Спроектировать тестовую и CI-стратегию большого проекта с ограниченным бюджетом времени и нестабильными проверками.","Помочь коллеге завершить незнакомую задачу через вопросы, review и объяснение контрактов, не забирая всю реализацию себе."],"beforeNext":["Продолжать углублять специализацию и пересматривать решения по новым измерениям и изменениям требований.","Поддерживать техническую преемственность: знания о системе должны быть доступны команде, а не только одному эксперту.","Развивать влияние на несколько команд только при соответствующем масштабе роли; Staff/Principal — отдельная траектория, а не обязательный следующий набор синтаксиса.","Сохранять навыки практической разработки и расследований, даже когда возрастает доля проектирования и коммуникации.","Проверять, что стандарты, архитектура и процессы уменьшают реальные риски, а не увеличивают стоимость работы без пользы."],"hardSkills":[{"area":"C++ и системные границы","items":["Глубокое понимание lifetime, memory model и compiler behavior в своем домене.","API/ABI, linkage, binary compatibility и ограничения платформы.","Обоснованное применение низкоуровневых приемов с проверкой корректности."]},{"area":"Архитектура и миграции","items":["Границы компонентов, владение и конкуренция на уровне системы.","ADR, risk-driven prototypes и сравнение trade-offs.","Legacy migration, compatibility, постепенный rollout и ограничения rollback."]},{"area":"Надежность и диагностика","items":["Инциденты, dumps, observability и доказательный root cause analysis.","Overload behavior, backpressure, resource limits и recovery.","Fault injection, security boundaries и профилактика классов дефектов."]},{"area":"Инженерная инфраструктура","items":["Масштабирование сборки, зависимостей, CI и стратегии тестирования.","Оценка стоимости проверок, нестабильных тестов и feedback loop.","Воспроизводимость релизов и поддержка целевых платформ."]},{"area":"Техническое лидерство","items":["Декомпозиция неопределенной задачи и проверяемые критерии успеха.","Полезный review, документация решений и передача контекста.","Наставничество и повышение самостоятельности команды."]}],"evidence":["Есть несколько сложных решений, которые прошли независимый review, выпуск и сопровождение; известны их последствия и ограничения.","Есть успешная миграция или существенное улучшение существующей системы с измеримым эффектом и сохраненной совместимостью.","Есть расследование серьезного или сложного инцидента с доказанной причиной и системной профилактикой повторения.","Коллеги способны поддерживать созданное решение по документации и контрактам; знание не замкнуто на авторе.","Улучшилось качество работы команды: меньше повторяющихся дефектов, быстрее обратная связь или больше самостоятельности коллег, с конкретными примерами."]}],"sources":[{"title":"ISO C++ · опубликованный стандарт","url":"https://isocpp.org/std/the-standard","note":"Статус стандарта и назначение нормативной спецификации."},{"title":"C++ Core Guidelines","url":"https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines","note":"Владение ресурсами, RAII, интерфейсы, безопасность и многопоточность."},{"title":"Поддержка стандартов в GCC","url":"https://gcc.gnu.org/projects/cxx-status.html","note":"Проверяйте поддержку конкретных возможностей языка своей версией компилятора."},{"title":"CMake · официальный учебник","url":"https://cmake.org/cmake/help/latest/guide/tutorial/index.html","note":"Цели сборки, библиотеки, зависимости, установка и тесты."},{"title":"GoogleTest · первые тесты","url":"https://google.github.io/googletest/primer.html","note":"Проверки, независимость тестов и тестовые фикстуры."},{"title":"Clang · AddressSanitizer","url":"https://clang.llvm.org/docs/AddressSanitizer.html","note":"Поиск ошибок памяти и ограничения диагностики."}]}</script><script type="application/json" id="initial-state">{}</script>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let BASE=JSON.parse($('#roadmap-data').textContent);
const STAGES=['С нуля','Beginner','Junior','Junior+','Middle','Middle+','Senior'];
const TIERS={'junior-required':'Нужно знать Junior','junior-plus':'Хорошо знать Junior','middle-required':'Нужно знать Middle','senior-required':'Нужно знать Senior','specialization':'По специализации','interview':'Собеседования / олимпиады'};
const DIFF=['🟢 Базовая · Basic','🟡 Средняя · Intermediate','🔴 Продвинутая · Advanced','🟣 Экспертная · Expert'];
const STATUS=['⬜ Не изучено','🟨 Изучаю','🟩 Знаю','✅ Применяю уверенно'];
const TRACKS={language:['Язык C++','#84dfb6'],tools:['Инструменты','#7fb8ec'],algorithms:['Алгоритмы','#c1a0ee'],systems:['Системы','#f2c878'],design:['Инженерия','#ec9fbd']};
const KEY='cpp-atlas-v1';
const fresh=()=>({version:1,status:{},notes:{},checks:{},positions:{},overrides:{},custom:[],customBranches:[],here:'core',updatedAt:0});
let state=fresh(), storageOK=true;
try{const a=JSON.parse(localStorage.getItem(KEY)||'null'),b=JSON.parse($('#initial-state').textContent||'{}');state={...fresh(),...((a?.updatedAt||0)>(b?.updatedAt||0)?a:b)};if(state.data){BASE=state.data;delete state.data}}catch(e){storageOK=false;}
let branches=[],skills=[],index={},branchIndex={},checkpoints=[],mode='map',focusBranch=null,selected=null,graphNodes=[],graphEdges=[],view={x:50,y:65,z:.8},filterStage='',drag=null;
function rebuild(){branches=[...BASE.branches,...state.customBranches].map(b=>({...b,skills:[]}));branchIndex=Object.fromEntries(branches.map(b=>[b.id,b]));skills=BASE.branches.flatMap(b=>b.skills.map(s=>({...s,branch:b.id}))).concat(state.custom).map(s=>({...s,...state.overrides[s.id],kind:'skill'}));index={};skills.forEach(s=>{index[s.id]=s;branchIndex[s.branch]?.skills.push(s)});branches.forEach(b=>{b.kind='branch';index[b.id]=b});checkpoints=BASE.checkpoints.map(c=>({...c,kind:'checkpoint'}));checkpoints.forEach(c=>index['cp-'+c.id]={...c,id:'cp-'+c.id});}
function toast(s){$('#toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',3200)}
function persist(){state.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify({...state,data:BASE}));storageOK=true}catch(e){storageOK=false}updateProgress()}
function status(id){return state.status[id]||0}
function mastered(s){return status(s.id)>=2}
function ready(s){return s.prereq.every(id=>status(id)>=2)}
function updateProgress(){const done=skills.filter(mastered).length;$('#progress-label').textContent=done+' / '+skills.length;$('#progress-bar').style.width=(100*done/skills.length)+'%';$('#save-status').textContent=storageOK?'● Автосохранение в этом браузере':'Автосохранение недоступно — экспортируйте файл';$('#save-status').style.color=storageOK?'':'#f2c878';$('#subtitle').textContent=skills.length+' навыков · '+branches.length+' веток · Ваш собственный темп';}
function renderNav(){const nav=$('#branch-nav');nav.innerHTML=branches.map(b=>`<button class="branch-nav" data-open="${esc(b.id)}"><i class="dot" style="background:${TRACKS[b.track]?.[1]||'#84dfb6'}"></i><span>${esc(b.title)}</span><small>${b.skills.filter(mastered).length}/${b.skills.length}</small></button>`).join('');$('#branch-count').textContent=branches.length;nav.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openBranch(el.dataset.open));$('#stages').innerHTML=STAGES.map((s,i)=>`<button class="stage-btn ${i===0?'active':''}" data-stage="${i}"><span>0${i+1} ${[2,4,6].includes(i)?' / CHECKPOINT':''}</span><strong>${esc(s)}</strong></button>`).join('');$('#stages').querySelectorAll('button').forEach(b=>b.onclick=()=>jumpStage(+b.dataset.stage));updateProgress()}
function setMode(m){mode=m;$('#canvas').hidden=m!=='map';$('#catalog').hidden=m==='map';$('.map-footer').hidden=m!=='map';['map','next','catalog','projects'].forEach(x=>$('#nav-'+x)?.classList.toggle('active',m===x));}
function overview(){setMode('map');focusBranch=null;drawGraph();view={x:40,y:35,z:.79};applyView();$('#breadcrumb').textContent='Карта / Обзор веток';}
function branchSkills(id){return branchIndex[id]?.skills||[]}
function openBranch(id){if(!branchIndex[id])return;setMode('map');focusBranch=id;select(id);drawGraph();const first=branchSkills(id).find(s=>!mastered(s)&&ready(s))||branchSkills(id)[0];if(first)centerNode(first.id,.9);else fitGraph();$('#breadcrumb').textContent='Карта / '+branchIndex[id].title+' · раскрытая ветка';}
