function makeNode(id,x,y,extra={}){const d=index[id];if(!d)return null;const p=state.positions[(focusBranch||'overview')+':'+id];return {id,d,x:p?.x??x,y:p?.y??y,w:d.kind==='skill'?232:246,h:d.kind==='checkpoint'?132:122,...extra}}
function graphLayout(){let nodes=[],edges=[];if(!focusBranch){for(let i=0;i<7;i++){let cp=checkpoints.find(c=>c.stage===i);if(cp)nodes.push(makeNode('cp-'+cp.id,i*370,55));}
const counts={},laneStarts={};let laneY=295;Object.keys(TRACKS).forEach(t=>{laneStarts[t]=laneY;const max=Math.max(1,...STAGES.map((_,i)=>branches.filter(b=>b.track===t&&b.stage===i).length));laneY+=max*158+65});branches.forEach(b=>{const col=b.stage,key=col+':'+b.track,n=counts[key]||0;counts[key]=n+1;nodes.push(makeNode(b.id,col*370,laneStarts[b.track]+n*158));});branches.forEach(b=>{(b.prereq||[]).forEach(p=>{if(branchIndex[p])edges.push({from:p,to:b.id,type:'recommended'})})});
const cpIds=checkpoints.slice().sort((a,b)=>a.stage-b.stage).map(c=>'cp-'+c.id);for(let i=1;i<cpIds.length;i++)edges.push({from:cpIds[i-1],to:cpIds[i],type:'milestone'});

function drawGraph(){graphLayout();const maxX=Math.max(2600,...graphNodes.map(n=>n.x+400)),maxY=Math.max(1700,...graphNodes.map(n=>n.y+250));$('#world').style.width=maxX+'px';$('#world').style.height=maxY+'px';let captions=!focusBranch?STAGES.map((s,i)=>`<div class="stage-caption" style="left:${i*370}px;top:0">0${i+1} / ${esc(s)}</div>`).join(''):'';$('#world').innerHTML=`<svg class="edges" width="${maxX}" height="${maxY}" aria-hidden="true"><defs><marker id="arr-required" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7eba99"/></marker><marker id="arr-recommended" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66839b"/></marker><marker id="arr-milestone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ab905d"/></marker></defs><g id="edge-paths"></g></svg>`+captions+graphNodes.map(nodeHTML).join('');$('#world').querySelectorAll('[data-node]').forEach(el=>{el.addEventListener('pointerdown',nodeDown);el.onclick=e=>{if(drag?.moved)return;select(el.dataset.node)};el.ondblclick=()=>{const d=index[el.dataset.node];if(d.kind==='branch')openBranch(d.id)};});drawEdges();applyView()}

function fitGraph(){if(!graphNodes.length)return;const r=$('#canvas').getBoundingClientRect(),minX=Math.min(...graphNodes.map(n=>n.x)),minY=Math.min(...graphNodes.map(n=>n.y)),maxX=Math.max(...graphNodes.map(n=>n.x+n.w)),maxY=Math.max(...graphNodes.map(n=>n.y+n.h));view.z=Math.max(.15,Math.min(1,(r.width-80)/(maxX-minX),(r.height-110)/(maxY-minY)));view.x=(r.width-(maxX-minX)*view.z)/2-minX*view.z;view.y=(r.height-70-(maxY-minY)*view.z)/2-minY*view.z;applyView()}

function showHelp(){selected=null;$('#detail').classList.remove('hidden');$('#detail').innerHTML=closeButton()+`<div class="eyebrow">Ваш личный маршрут</div><div class="hero-symbol">{ C++ }</div><h2>Прокачивайте навыки.<br>Собирайте опыт.</h2><p>От первой программы до проектирования систем. Выберите ветку, раскройте её и найдите следующий шаг.</p><div class="welcome-list"><div class="welcome-item"><b>01 / Начните с текущего места</b>Нажмите узел → «Я здесь». Новичку — ветка «${esc(branchIndex.core?.title||'Основы')}».</div><div class="welcome-item"><b>02 / Подтвердите знание практикой</b>У каждой темы есть задание; у каждой ветки — вопросы и мини-проекты.</div><div class="welcome-item"><b>03 / Возвращайтесь к пробелам</b>Раздел «Что изучать дальше» учитывает ваши отметки и зависимости.</div></div><button class="primary" id="begin" style="width:100%">Начать с основ →</button><h3>Легенда прогресса</h3>${STATUS.map(s=>`<div class="legend-row">${s}</div>`).join('')}<h3>Сложность</h3>${DIFF.map(s=>`<div class="legend-row">${s}</div>`).join('')}<h3>Типы связей</h3><div class="legend-row"><i class="legend-line"></i>Сплошная стрелка — prerequisite навыка</div><div class="legend-row"><i class="legend-line dash"></i>Пунктир — рекомендуемая подготовка ветки</div><div class="legend-row"><i class="legend-line gold"></i>Золотая — этап или объединение компетенций</div><p>Стрелка A → B означает: сначала A, затем B. Ветви можно изучать параллельно. Обзор показывает области; внутри ветки — точные зависимости навыков.</p><h3>Как читать уровни</h3><p>«Нужно знать Middle» добавляется к базе Junior. «Нужно знать Senior» — к базе Middle. «Хорошо знать Junior», специализации и олимпиадные темы изучаются по цели. Счётчик уровня включает обязательные темы и все их предпосылки; проекты — варианты практики на выбор.</p><h3>Современный C++</h3><p>Учебная база — C++17/20, затем возможности C++23 по поддержке вашего компилятора и стандартной библиотеки. C++11/14 изучаются через идеи, которые используются и сегодня. Новейшие стандарты не заменяют практику проектирования.</p><h3>Сохранение и редактирование</h3><p>Перетаскивайте узлы. Редактируйте карточки, добавляйте темы, заметки и зависимости. Автосохранение привязано к браузеру и месту открытия файла. Для переноса используйте JSON или HTML со своим прогрессом. В приватном режиме хранение может быть временным.</p><h3>Источники и дальнейшее чтение</h3><p>Содержание и распределение по уровням — авторская учебная модель. Технические ориентиры проверены 13 октября 2026 года по первичным источникам.</p>${BASE.sources.map(s=>`<div class="link-row"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><div class="muted" style="font-size:11px">${esc(s.note)}</div></div>`).join('')}<div class="detail-actions"><button id="add-branch">＋ Добавить ветку</button><button data-reset-layout>Восстановить раскладку</button></div>`;wireDetail();$('#begin').onclick=()=>openBranch('core');$('#add-branch').onclick=editBranch;}

let catalogFilters={q:'',tier:'',status:''};
function showCatalog(m='catalog'){setMode(m);$('#breadcrumb').textContent=({catalog:'Каталог / Поиск по всем навыкам',next:'Мой маршрут / Что изучать дальше',projects:'Практика / Проекты'}[m]);renderCatalog();}
function renderCatalog(){const c=$('#catalog');const headings={catalog:['Все навыки','Найдите тему, отфильтруйте требования или вернитесь к пробелам.'],next:['Следующий шаг','Сначала незавершённые темы, для которых освоены все указанные предпосылки.'],projects:['Учиться через проекты','От консольной программы до системы с измеримыми требованиями.']};const h=headings[mode]||headings.catalog;c.innerHTML=`<div class="catalog-top"><div class="eyebrow" style="color:var(--mint);margin-bottom:9px">${mode==='next'?'Постройте свой маршрут':'Библиотека навыков'}</div><h2>${h[0]}</h2><p class="muted">${h[1]}</p><div class="detail-actions"><button data-catalog-mode="catalog">Все темы</button><button data-catalog-mode="next">Что дальше</button><button data-catalog-mode="projects">Проекты</button><button id="clear-filters">Сбросить фильтры</button></div><div class="filters"><input id="search" aria-label="Поиск навыков" placeholder="Поиск: vector, память, CMake…" value="${esc(catalogFilters.q)}"><select id="filter-tier" aria-label="Требования"><option value="">Все требования</option>${Object.entries(TIERS).map(([k,v])=>`<option value="${k}" ${catalogFilters.tier===k?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="filter-status" aria-label="Статус"><option value="">Все статусы</option>${STATUS.map((s,i)=>`<option value="${i}" ${catalogFilters.status===String(i)?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="filter-stage" aria-label="Уровень"><option value="">Все уровни</option>${STAGES.map((s,i)=>`<option value="${i}" ${filterStage===String(i)?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="count-label" id="results-count"></div></div><div id="results" class="catalog-grid"></div>`;['search','filter-tier','filter-status','filter-stage'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{catalogFilters={q:$('#search').value,tier:$('#filter-tier').value,status:$('#filter-status').value};filterStage=$('#filter-stage').value;renderResults()}));c.querySelectorAll('[data-catalog-mode]').forEach(b=>b.onclick=()=>{catalogFilters={q:'',tier:'',status:''};filterStage='';showCatalog(b.dataset.catalogMode)});$('#clear-filters').onclick=()=>{catalogFilters={q:'',tier:'',status:''};filterStage='';renderCatalog()};renderResults();}
function renderResults(){let matches=skills.filter(s=>(!catalogFilters.q||(s.title+' '+s.what+' '+s.know+' '+branchIndex[s.branch].title).toLowerCase().includes(catalogFilters.q.toLowerCase()))&&(!catalogFilters.tier||s.tier===catalogFilters.tier)&&(catalogFilters.status===''||status(s.id)===+catalogFilters.status)&&(filterStage===''||s.stage===+filterStage));if(mode==='next')matches=matches.filter(s=>!mastered(s)&&ready(s)).sort((a,b)=>(status(b.id)===1)-(status(a.id)===1)||a.stage-b.stage||a.difficulty-b.difficulty);if(mode==='projects')matches=matches.filter(s=>s.branch==='projects');$('#results-count').textContent='Найдено: '+matches.length+(mode==='next'?' · Рекомендации — по зависимостям и этапу, а не по срокам.':'');$('#results').innerHTML=matches.length?matches.map(s=>`<button class="catalog-card" data-result="${s.id}"><div class="eyebrow" style="color:${TRACKS[branchIndex[s.branch].track]?.[1]}">${esc(STAGES[s.stage])} · ${esc(branchIndex[s.branch].title)}</div><b>${esc(s.title)}</b><p>${esc(s.what)}</p><div style="margin-top:15px;font-size:11px;color:var(--muted)">${esc(STATUS[status(s.id)])} · ${['🟢','🟡','🔴','🟣'][s.difficulty]}</div></button>`).join(''):'<p class="empty">Нет тем с такими фильтрами. Выберите другой уровень или сбросьте поиск.</p>';$('#results').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.result));}
function editSkill(s){const freshSkill=!s;const d=s||{title:'',branch:focusBranch||'core',stage:1,tier:'junior-required',difficulty:0,what:'',know:'',why:'',practice:'',prereq:[]};const dlg=$('#edit-dialog');dlg.innerHTML=`<form id="skill-form"><h2>${freshSkill?'Новая тема':'Редактирование темы'}</h2><div class="form-grid"><label class="full">Название<input name="title" value="${esc(d.title)}" required maxlength="110"></label><label>Ветка<select name="branch">${branches.map(b=>`<option value="${b.id}" ${b.id===d.branch?'selected':''}>${esc(b.title)}</option>`).join('')}</select></label><label>Этап<select name="stage">${STAGES.map((s,i)=>`<option value="${i}" ${i===d.stage?'selected':''}>${s}</option>`).join('')}</select></label><label>Требование<select name="tier">${Object.entries(TIERS).map(([k,v])=>`<option value="${k}" ${k===d.tier?'selected':''}>${v}</option>`).join('')}</select></label><label>Сложность<select name="difficulty">${DIFF.map((s,i)=>`<option value="${i}" ${i===d.difficulty?'selected':''}>${s}</option>`).join('')}</select></label>${[['what','Что это'],['know','Что нужно знать'],['why','Зачем это нужно'],['practice','Практическое задание']].map(([k,l])=>`<label class="full">${l}<textarea name="${k}" required>${esc(d[k])}</textarea></label>`).join('')}<div class="full"><label>Предварительные знания<input id="prereq-search" placeholder="Найти зависимость…"></label><div class="prereq-options">${skills.filter(x=>x.id!==s?.id).map(x=>`<label data-prereq-row><input type="checkbox" name="prereq" value="${x.id}" ${d.prereq.includes(x.id)?'checked':''}>${esc(x.title)} <small>· ${esc(branchIndex[x.branch].title)}</small></label>`).join('')}</div></div></div><div class="error" id="edit-error" role="alert"></div><div class="form-actions"><button type="button" id="cancel-edit">Отмена</button><button class="primary" type="submit">Сохранить тему</button></div></form>`;dlg.showModal();$('#cancel-edit').onclick=()=>dlg.close();$('#prereq-search').oninput=e=>dlg.querySelectorAll('[data-prereq-row]').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(e.target.value.toLowerCase()));$('#skill-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x=Object.fromEntries(['title','branch','what','know','why','practice','tier'].map(k=>[k,f.get(k).trim()]));Object.assign(x,{stage:+f.get('stage'),difficulty:+f.get('difficulty'),prereq:f.getAll('prereq')});const id=s?.id||'custom-'+Date.now().toString(36);const candidate=skills.filter(t=>t.id!==id).concat({...x,id});if(hasCycle(candidate)){return $('#edit-error').textContent='Эта зависимость создаёт цикл. Выберите другую предпосылку.'}if(s)state.overrides[id]=x;else state.custom.push({...x,id});persist();rebuild();renderNav();dlg.close();if(mode==='map')openBranch(x.branch);else renderCatalog();select(id);toast('Тема сохранена')};}
function hasCycle(items){const m=Object.fromEntries(items.map(s=>[s.id,s])),seen=new Set(),active=new Set();function dfs(id){if(active.has(id))return true;if(seen.has(id))return false;active.add(id);for(const p of m[id]?.prereq||[])if(dfs(p))return true;active.delete(id);seen.add(id);return false}return items.some(s=>dfs(s.id))}
function editBranch(){const dlg=$('#edit-dialog');dlg.innerHTML=`<form id="branch-form"><h2>Новая ветка</h2><div class="form-grid"><label class="full">Название<input name="title" required maxlength="90"></label><label class="full">О чём эта ветка<textarea name="summary" required></textarea></label><label>Направление<select name="track">${Object.entries(TRACKS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label><label>Начальный этап<select name="stage">${STAGES.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select></label></div><div class="form-actions"><button type="button" id="cancel-edit">Отмена</button><button class="primary">Добавить</button></div></form>`;dlg.showModal();$('#cancel-edit').onclick=()=>dlg.close();$('#branch-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id='branch-'+Date.now().toString(36);state.customBranches.push({id,title:f.get('title').trim(),summary:f.get('summary').trim(),track:f.get('track'),stage:+f.get('stage'),prereq:[],mini:[],practice:[],skills:[]});persist();rebuild();renderNav();dlg.close();openBranch(id);toast('Ветка создана. Добавьте в неё темы кнопкой «＋ Тема».')};}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function saveMenu(){const dlg=$('#save-dialog');dlg.innerHTML=`<h2>Сохранить свою карту</h2><p class="muted">Прогресс, заметки, задания, расположение узлов и изменения тем включены.</p><div style="display:grid;gap:10px;margin:22px 0"><button class="primary" id="save-json">Скачать резервную копию JSON</button><button id="save-html">Скачать HTML со всем прогрессом</button></div><p class="muted" style="font-size:12px">JSON можно импортировать в эту карту в другом браузере. HTML — самостоятельная копия, которая открывается без интернета.</p><div class="form-actions"><button id="close-save">Закрыть</button></div>`;dlg.showModal();$('#close-save').onclick=()=>dlg.close();$('#save-json').onclick=()=>{persist();download('cpp-atlas-progress.json',JSON.stringify({format:'cpp-atlas',version:1,data:BASE,state},null,2),'application/json');toast('Резервная копия подготовлена')};$('#save-html').onclick=()=>{persist();const clone=document.documentElement.cloneNode(true);clone.querySelector('#initial-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#roadmap-data').textContent=JSON.stringify(BASE).replace(/</g,'\\u003c');clone.querySelectorAll('dialog').forEach(x=>{x.removeAttribute('open');x.innerHTML=''});clone.querySelector('#world').innerHTML='';clone.querySelector('#detail').innerHTML='';clone.querySelector('#catalog').innerHTML='';clone.querySelector('#toast').textContent='';download('cpp-atlas-my-roadmap.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('HTML-копия подготовлена')};}
function validateImport(x){
const strings=v=>Array.isArray(v)&&v.every(t=>typeof t==='string');
if(x?.data?.branches&&x?.state?.customBranches){
 const bs=[...x.data.branches,...x.state.customBranches],bids=new Set(bs.map(b=>b.id));
 for(const b of bs)if(typeof b.summary!=='string'||!strings(b.prereq)||!strings(b.mini)||!strings(b.practice)||b.prereq.some(p=>!bids.has(p))||['__proto__','constructor','prototype'].includes(b.id))throw Error('Повреждена ветка или её зависимости');
}
if(Array.isArray(x?.data?.checkpoints))for(const c of x.data.checkpoints){
 if(!c||typeof c.id!=='string'||!/^[a-z0-9_-]+$/.test(c.id)||typeof c.title!=='string'||typeof c.description!=='string'||!Number.isInteger(c.stage)||c.stage<0||c.stage>6||['know','can','tasks','projects','beforeNext','evidence'].some(k=>!strings(c[k]))||!Array.isArray(c.hardSkills)||c.hardSkills.some(g=>typeof g.area!=='string'||!strings(g.items)))throw Error('Повреждена контрольная точка');
}
if(x?.format!=='cpp-atlas'||x.version!==1||!x.data||!Array.isArray(x.data.branches)||!Array.isArray(x.data.checkpoints)||!Array.isArray(x.data.sources)||!x.state||x.state.version!==1)throw Error('Это не резервная копия C++ Atlas версии 1.');const st=x.state;for(const k of ['status','notes','checks','positions','overrides'])if(!st[k]||Array.isArray(st[k])||typeof st[k]!=='object')throw Error('Повреждён раздел '+k);for(const k of ['custom','customBranches'])if(!Array.isArray(st[k]))throw Error('Повреждён раздел '+k);const bs=x.data.branches.concat(st.customBranches),ids=new Set();for(const b of bs){if(!/^[a-zA-Z0-9_-]+$/.test(b.id)||ids.has(b.id)||typeof b.title!=='string'||!Array.isArray(b.skills)||!TRACKS[b.track]||!Number.isInteger(b.stage)||b.stage<0||b.stage>6)throw Error('Некорректная ветка');ids.add(b.id)}for(const c of x.data.checkpoints){if(ids.has('cp-'+c.id))throw Error('Повтор контрольной точки');ids.add('cp-'+c.id)}const bIDs=new Set(bs.map(b=>b.id));const ss=x.data.branches.flatMap(b=>b.skills.map(s=>({...s,branch:b.id}))).concat(st.custom).map(s=>({...s,...st.overrides[s.id]}));for(const s of ss){if(['__proto__','constructor','prototype'].includes(s.id))throw Error('Недопустимый идентификатор');if(!/^[a-zA-Z0-9_-]+$/.test(s.id)||ids.has(s.id)||!bIDs.has(s.branch)||!Array.isArray(s.prereq)||!TIERS[s.tier]||!Number.isInteger(s.stage)||s.stage<0||s.stage>6||!Number.isInteger(s.difficulty)||s.difficulty<0||s.difficulty>3||['title','what','know','why','practice'].some(k=>typeof s[k]!=='string'))throw Error('Некорректный навык');ids.add(s.id)}const sIDs=new Set(ss.map(s=>s.id));if(ss.some(s=>s.prereq.some(p=>!sIDs.has(p)))||hasCycle(ss))throw Error('Нарушены зависимости или найден цикл');for(const v of Object.values(st.status))if(![0,1,2,3].includes(v))throw Error('Некорректный статус');for(const p of Object.values(st.positions))if(!p||!Number.isFinite(p.x)||!Number.isFinite(p.y))throw Error('Некорректные координаты');for(const src of x.data.sources)if(typeof src.title!=='string'||typeof src.note!=='string'||!/^https:\/\//.test(src.url))throw Error('Некорректный источник');return true}
$('#file-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10e6)throw Error('Файл слишком большой (максимум 10 МБ).');const x=JSON.parse(await f.text());validateImport(x);if(!confirm('Заменить текущую карту и прогресс данными из файла? Сначала экспортируйте текущую карту, если она нужна.'))return;BASE=x.data;state={...fresh(),...x.state};$('#roadmap-data').textContent=JSON.stringify(BASE).replace(/</g,'\\u003c');persist();rebuild();renderNav();overview();showHelp();toast('Карта и прогресс восстановлены')}catch(err){toast('Не удалось импортировать: '+err.message)}finally{e.target.value=''}};
$('#zoom-in').onclick=()=>zoom(1.2);$('#zoom-out').onclick=()=>zoom(1/1.2);$('#fit').onclick=fitGraph;$('#home').onclick=()=>navigate(state.here);$('#overview').onclick=overview;$('#nav-map').onclick=overview;$('#nav-next').onclick=()=>{filterStage='';showCatalog('next')};$('#nav-catalog').onclick=()=>{filterStage='';showCatalog('catalog')};$('#nav-projects').onclick=()=>{filterStage='';catalogFilters={q:'',tier:'',status:''};showCatalog('projects')};$('#catalog-btn').onclick=()=>{filterStage='';showCatalog('catalog')};$('#mobile-nav').onclick=()=>{$('#detail').classList.add('hidden');showCatalog('catalog')};$('#help').onclick=showHelp;$('#toolbar-help').onclick=showHelp;$('#detail-toggle').onclick=()=>{if($('#detail').classList.contains('hidden')){if(selected)select(selected);else showHelp()}else $('#detail').classList.add('hidden')};$('#add-topic').onclick=()=>editSkill();$('#export').onclick=saveMenu;$('#import').onclick=()=>$('#file-input').click();
rebuild();renderNav();overview();showHelp();
window.ATLAS={get state(){return state},get skills(){return skills},get branches(){return branches},get base(){return BASE},validateImport,hasCycle,navigate,openBranch,overview,showCatalog};
</script>
